    // ====== CANVAS RENDER (single source of truth for PNG / JPG / PDF) ======
    function roundRect(g, x, y, w, h, r) {
        g.beginPath();
        g.moveTo(x + r, y);
        g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
        g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
        g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
        g.closePath();
    }
    function fitText(g, text, maxW, startPx, weight) {
        var px = startPx;
        while (px > 8) {
            g.font = weight + ' ' + px + 'px "Noto Sans KR","Malgun Gothic",sans-serif';
            if (g.measureText(text).width <= maxW) break;
            px -= 1;
        }
        return px;
    }
    function renderSheetToCanvas(scale) {
        ensureSheet();
        var th = THEMES[sheet.theme] || THEMES.light;
        var cv = document.createElement('canvas');
        cv.width = Math.round(SHEET_W * scale);
        cv.height = Math.round(SHEET_H * scale);
        var g = cv.getContext('2d');
        g.scale(scale, scale);
        g.fillStyle = th.bg;
        g.fillRect(0, 0, SHEET_W, SHEET_H);
        g.textBaseline = 'middle';
        g.textAlign = 'center';

        var b = boardCells(), i, e, k, cell, lab, col, txt, px, dw, dh, vert;
        for (i = 0; i < sheet.els.length; i++) {
            e = sheet.els[i];
            if (e.kind === 'title') {
                g.fillStyle = th.text;
                g.globalAlpha = 1;
                px = fitText(g, sheetTitleText(), e.w, e.size, 'bold');
                g.fillText(sheetTitleText(), e.x + e.w / 2, e.y + px * 0.7);
            } else if (e.kind === 'desk') {
                dw = e.w || 150; dh = e.h || 44;
                vert = (sheet.deskSide === 'left' || sheet.deskSide === 'right');
                g.globalAlpha = 1;
                g.strokeStyle = th.text;
                g.lineWidth = 1.6;
                roundRect(g, e.x, e.y, dw, dh, 8);
                g.stroke();
                g.fillStyle = th.text;
                g.font = 'bold ' + e.size + 'px "Noto Sans KR","Malgun Gothic",sans-serif';
                if (vert) {
                    // stack the two syllables the way the DOM does
                    g.fillText('교', e.x + dw / 2, e.y + dh / 2 - e.size * 0.6);
                    g.fillText('탁', e.x + dw / 2, e.y + dh / 2 + e.size * 0.6);
                } else {
                    g.fillText('교탁', e.x + dw / 2, e.y + dh / 2);
                }
            } else if (e.kind === 'board') {
                g.globalAlpha = 1;
                g.fillStyle = th.panel;
                roundRect(g, e.x, e.y, b.w, b.h, 14);
                g.fill();
                if (sheet.theme === 'paper') { g.strokeStyle = th.line; g.lineWidth = 1.2; g.stroke(); }
                for (k = 0; k < b.list.length; k++) {
                    cell = b.list[k];
                    if (!cell.on) continue;
                    lab = seatLabel(cell.num);
                    if (cell.num == null) { col = th.off; txt = th.sub; }
                    else if (sheet.theme === 'paper') { col = '#ffffff'; txt = '#000000'; }
                    else { col = ((students[cell.num] || {}).gender === 'F') ? th.f : th.m; txt = '#ffffff'; }
                    g.fillStyle = col;
                    roundRect(g, e.x + cell.x, e.y + cell.y, cell.w, cell.h, 9);
                    g.fill();
                    if (sheet.theme === 'paper') { g.strokeStyle = th.line; g.lineWidth = 1.1; g.stroke(); }
                    if (lab) {
                        g.fillStyle = txt;
                        fitText(g, lab, cell.w - 10, sheet.cellFont, 'bold');
                        g.fillText(lab, e.x + cell.x + cell.w / 2, e.y + cell.y + cell.h / 2 + 1);
                    }
                }
            } else {
                if (!e.text) continue;
                g.globalAlpha = e.faint ? 0.62 : 1;
                g.fillStyle = faintColor(th);
                g.font = '600 ' + e.size + 'px "Noto Sans KR","Malgun Gothic",sans-serif';
                g.textAlign = 'left';
                g.fillText(e.text, e.x, e.y + e.size * 0.7);
                g.textAlign = 'center';
                g.globalAlpha = 1;
            }
        }
        g.globalAlpha = 1;
        return cv;
    }

    function downloadBlob(blob, name) {
        if (window.navigator && window.navigator.msSaveBlob) { window.navigator.msSaveBlob(blob, name); return; }
        var url = window.URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
            if (a.parentNode) a.parentNode.removeChild(a);
            window.URL.revokeObjectURL(url);
        }, 120);
    }
    function sheetFileName(ext) {
        return (className || 'class').replace(/[\\/:*?"<>|]/g, '') + '_자리배치표.' + ext;
    }
    function dataUrlToBytes(u) {
        var b64 = u.substring(u.indexOf(',') + 1);
        var bin = atob(b64), n = bin.length, arr = new Uint8Array(n), i;
        for (i = 0; i < n; i++) arr[i] = bin.charCodeAt(i);
        return arr;
    }

    function exportImage(kind) {
        var cv = renderSheetToCanvas(2);
        if (kind === 'jpg') {
            // JPEG has no alpha; the canvas is already opaque, but be explicit
            var out = document.createElement('canvas');
            out.width = cv.width; out.height = cv.height;
            var g = out.getContext('2d');
            g.fillStyle = (THEMES[sheet.theme] || THEMES.light).bg;
            g.fillRect(0, 0, out.width, out.height);
            g.drawImage(cv, 0, 0);
            downloadBlob(new Blob([dataUrlToBytes(out.toDataURL('image/jpeg', 0.94))], { type: 'image/jpeg' }), sheetFileName('jpg'));
        } else {
            downloadBlob(new Blob([dataUrlToBytes(cv.toDataURL('image/png'))], { type: 'image/png' }), sheetFileName('png'));
        }
    }

    // ---- minimal one-page PDF wrapping the JPEG ----
    function exportPdf() {
        var cv = renderSheetToCanvas(2);
        var tmp = document.createElement('canvas');
        tmp.width = cv.width; tmp.height = cv.height;
        var g = tmp.getContext('2d');
        g.fillStyle = (THEMES[sheet.theme] || THEMES.light).bg;
        g.fillRect(0, 0, tmp.width, tmp.height);
        g.drawImage(cv, 0, 0);
        var jpg = dataUrlToBytes(tmp.toDataURL('image/jpeg', 0.94));

        var PW = 842, PH = 595;                                  // A4 landscape, points
        var sc = Math.min(PW / SHEET_W, PH / SHEET_H);
        var dw = SHEET_W * sc, dh = SHEET_H * sc;
        var dx = (PW - dw) / 2, dy = (PH - dh) / 2;

        var objs = [];
        objs.push('<</Type/Catalog/Pages 2 0 R>>');
        objs.push('<</Type/Pages/Kids[3 0 R]/Count 1>>');
        objs.push('<</Type/Page/Parent 2 0 R/MediaBox[0 0 ' + PW + ' ' + PH +
                  ']/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>');

        var content = 'q ' + dw.toFixed(2) + ' 0 0 ' + dh.toFixed(2) + ' ' +
                      dx.toFixed(2) + ' ' + dy.toFixed(2) + ' cm /Im0 Do Q';

        var parts = [], offsets = [], pos = 0;
        function push(str) { parts.push(str); pos += str.length; }
        function pushBytes(arr) { parts.push(arr); pos += arr.length; }

        push('%PDF-1.4\n');
        var i;
        for (i = 0; i < 3; i++) {
            offsets.push(pos);
            push((i + 1) + ' 0 obj\n' + objs[i] + '\nendobj\n');
        }
        offsets.push(pos);
        push('4 0 obj\n<</Type/XObject/Subtype/Image/Width ' + tmp.width + '/Height ' + tmp.height +
             '/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ' + jpg.length + '>>\nstream\n');
        pushBytes(jpg);
        push('\nendstream\nendobj\n');
        offsets.push(pos);
        push('5 0 obj\n<</Length ' + content.length + '>>\nstream\n' + content + '\nendstream\nendobj\n');

        var xref = pos;
        var x = 'xref\n0 6\n0000000000 65535 f \n';
        for (i = 0; i < 5; i++) {
            var o = String(offsets[i]);
            while (o.length < 10) o = '0' + o;
            x += o + ' 00000 n \n';
        }
        x += 'trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n' + xref + '\n%%EOF\n';
        push(x);

        var blobParts = [], j;
        for (j = 0; j < parts.length; j++) {
            if (typeof parts[j] === 'string') {
                var str = parts[j], u = new Uint8Array(str.length), q;
                for (q = 0; q < str.length; q++) u[q] = str.charCodeAt(q) & 0xff;
                blobParts.push(u);

        downloadBlob(new Blob(blobParts, { type: 'application/pdf' }), sheetFileName('pdf'));
    }

    // ---- HWP: written as HWPX (the open OWPML package Hancom 2014+ reads) ----
    var CRC_T = null;
    function crc32(buf) {

                CRC_T[i] = c >>> 0;

        for (i = 0; i < buf.length; i++) c = CRC_T[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
        return (c ^ 0xFFFFFFFF) >>> 0;

    function utf8Bytes(str) {

            else if (cc < 0x800) { out.push(0xC0 | (cc >> 6), 0x80 | (cc & 63)); }
            else if (cc >= 0xD800 && cc <= 0xDBFF) {

                out.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
            } else out.push(0xE0 | (cc >> 12), 0x80 | ((cc >> 6) & 63), 0x80 | (cc & 63));

            var lh = [].concat([0x50, 0x4b, 0x03, 0x04], u16(20), u16(0), u16(0), u16(0), u16(0),
                u32(crc), u32(data.length), u32(data.length), u16(nameB.length), u16(0));
            chunks.push(new Uint8Array(lh)); chunks.push(nameB); chunks.push(data);
            central.push({ name: nameB, crc: crc, len: data.length, off: offset });
            offset += lh.length + nameB.length + data.length;

    // ---- print: opens the browser dialog with just the sheet on the page ----

    var PRINT_MARGIN_MM = 10;
    var printTimer = null, printObjUrl = null;
    function printBox() {
        var port = (ensureSheet().paper === 'port');
        var pw = port ? 210 : 297, ph = port ? 297 : 210;
        return {
            port: port,
            w: pw - PRINT_MARGIN_MM * 2,
            h: ph - PRINT_MARGIN_MM * 2 - 2          // 2mm headroom against rounding
        };
    }
    // The browser draws its date/title/URL/page-number header and footer inside the
    // @page margins. With those margins at zero there is nowhere for them to go, so the
    // white border is made with padding on the print area instead.
    function updatePageRule() {
        var el = document.getElementById('pageRule');
        if (!el) return;
        var bx = printBox();
        var pageH = bx.port ? 297 : 210;
        el.textContent =
            '@page { size: A4 ' + (bx.port ? 'portrait' : 'landscape') + '; margin: 0; }' +
            '@media print { #printArea { box-sizing: border-box; padding: ' + PRINT_MARGIN_MM + 'mm; height: ' +
            (pageH - 2) + 'mm; }' +
            ' #printImg { max-width: ' + bx.w + 'mm; max-height: ' + bx.h + 'mm; } }';
    }
    function setPrintImage(url, isObjectUrl, cb) {
        var img = document.getElementById('printImg');
        if (!img) { if (cb) cb(); return; }
        var called = false;
        function go() { if (called) return; called = true; if (cb) cb(); }
        img.onload = go;
        img.onerror = go;
        if (printObjUrl) { try { URL.revokeObjectURL(printObjUrl); } catch (e) {} }
        printObjUrl = isObjectUrl ? url : null;
        img.src = url;
        setTimeout(go, 2500);
    }
    // Keep the print copy current in the background so Ctrl+P also prints the latest sheet.
    function refreshPrintImage(cb) {
        updatePageRule();
        var cv;
        try { cv = renderSheetToCanvas(2); } catch (e) { if (cb) cb(); return; }
        if (cv.toBlob && window.URL && URL.createObjectURL) {
            cv.toBlob(function (blob) {
                if (blob) setPrintImage(URL.createObjectURL(blob), true, cb);
                else setPrintImage(cv.toDataURL('image/png'), false, cb);
            }, 'image/png');
        } else {
            setPrintImage(cv.toDataURL('image/png'), false, cb);
        }
    }
    function schedulePrintRefresh() {
        if (printTimer) clearTimeout(printTimer);
        printTimer = setTimeout(function () { printTimer = null; refreshPrintImage(null); }, 400);
    }
    var printing = false;
    function doPrint() {
        if (printing) return;
        printing = true;
        if (printTimer) { clearTimeout(printTimer); printTimer = null; }
        refreshPrintImage(function () {
            printing = false;
            window.print();
        });
    }
    // Ctrl+P straight after an edit: make sure the page size and image are not stale.
    window.addEventListener('beforeprint', function () {
        updatePageRule();
        if (printTimer) {
            clearTimeout(printTimer); printTimer = null;
            try { setPrintImage(renderSheetToCanvas(2).toDataURL('image/png'), false, null); } catch (e) {}
        }
    });

    // ---- format save / load (layout only, seating comes from the app) ----
    function formatPayload() {
        ensureSheet();
        return { v: 2, paper: sheet.paper, theme: sheet.theme, deskSide: sheet.deskSide,
                 label: sheet.label, cellFont: sheet.cellFont, els: sheet.els };
    }
    function applyFormat(o) {
        if (!o || !o.els) return false;
        sheet = {
            paper: o.paper === 'port' ? 'port' : 'land',
            theme: THEMES[o.theme] ? o.theme : 'light',
            deskSide: o.deskSide || 'bottom',
            label: o.label || '이름',
            cellFont: o.cellFont || 17,
            els: o.els
        };
        applyPaper();
        ensureSheet();
        return true;
    }
    function saveFormat() {
        var lines = [], i;
        for (i = 0; i < 100; i++) lines.push('.');
        lines.push('FMT;1;' + JSON.stringify(formatPayload()));
        downloadBlob(new Blob([lines.join('\r\n')], { type: 'text/plain;charset=utf-8' }), '자리배치표_형식.txt');
    }
    function loadFormat() {
        var fi = document.getElementById('fmtFile');
        if (!fi || !fi.files || !fi.files[0]) return;
        var reader = new FileReader();
        reader.onload = function (e) {
            var text = String(e && e.target ? e.target.result : reader.result);
            var m = text.replace(/\r/g, '').split('\n'), i, line, ok = false;
            for (i = 0; i < m.length; i++) {
                line = m[i];
                if (line.indexOf('FMT;1;') !== 0) continue;
                try {
                    if (applyFormat(JSON.parse(line.substring(6)))) ok = true;
                } catch (err) { ok = false; }
                break;
            }
            if (!ok) { alert('형식 파일을 읽을 수 없습니다.'); return; }
            selEl = null;
            render();
        };
        reader.onerror = function () { alert('파일을 읽지 못했습니다.'); };
        reader.readAsText(fi.files[0], 'utf-8');
    }

    // ---- share: the whole chart travels inside the link, valid for one hour ----
    function makeShareLink() {
        ensureSheet();
        var seats = [], r, c, src = hasResult ? newSeats : currentSeats;
        for (r = 0; r < rows; r++) for (c = 0; c < NC(); c++) {
            if (src[r][c] != null) seats.push(r + ',' + c + ',' + src[r][c]);
        }
        var names = {}, i, n;
        for (i = 0; i < participants.length; i++) {
            n = participants[i];
            names[n] = [(students[n] || {}).name || '', (students[n] || {}).gender || 'M'];
        }
        var off = [];
        for (r = 0; r < rows; r++) for (c = 0; c < NC(); c++) if (!enabledSeats[r][c]) off.push(r + ',' + c);
        var payload = {
            exp: Date.now() + 3600000,
            cls: className, rows: rows, cols: cols,
            td: tripleDesk, off: off, seats: seats, names: names,
            fmt: formatPayload()
        };
        var b64;
        try {
            b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        } catch (e) { alert('공유 링크를 만들지 못했습니다.'); return; }
        lastPayload = b64;
        var longUrl = appBaseUrl() + '#s=' + b64;
        shareUrl = longUrl;
        shareShort = '';
        shareBusy = true;
        shareMsg = '';
        render();
        storeShare(b64, function (code) {
            shareBusy = false;
            if (code) {
                shareShort = appDirUrl() + code;
                shareUrl = shareShort;
            }
            copyShare(shareUrl);
            render();
        });
    }
    // https://host/seatrandomizer/index.html  ->  .../index.html   (long link base)
    function appBaseUrl() { return location.href.split('#')[0].split('?')[0]; }
    // https://host/seatrandomizer/index.html  ->  https://host/seatrandomizer/   (short link base)
    function appDirUrl() {
        var u = appBaseUrl();
        var cut = u.lastIndexOf('/');
        var tail = u.substring(cut + 1);
        if (tail.indexOf('.') >= 0 || /^[A-Za-z0-9]{4,10}$/.test(tail)) u = u.substring(0, cut + 1);
        else if (u.charAt(u.length - 1) !== '/') u += '/';
        return u;
    }
    function copyShare(url) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(function () {
                shareMsg = '링크를 복사했습니다. 1시간 동안 열 수 있습니다.';
                render();
            }, function () { shareMsg = ''; render(); });
        }
    }
    // QR of whatever link we ended up with
    function renderShareQr() {
        if (!shareUrl || typeof qrcode === 'undefined') return '';
        var q, n, i, j, sz = 190, quiet = 4;   // spec asks for a 4-module quiet zone
        try {
            q = qrcode(0, 'L');
            q.addData(shareUrl);
            q.make();
        } catch (e) { return '<div class="hintdim">링크가 너무 길어 QR을 만들 수 없습니다.</div>'; }
        n = q.getModuleCount();
        px = sz / (n + quiet * 2);
        var out = '<svg class="qrSvg" width="' + sz + '" height="' + sz + '" viewBox="0 0 ' + (n + quiet * 2) + ' ' + (n + quiet * 2) + '">';
        out += '<rect width="100%" height="100%" fill="#ffffff"/>';
        for (i = 0; i < n; i++) for (j = 0; j < n; j++) {
            if (q.isDark(i, j)) out += '<rect x="' + (j + quiet) + '" y="' + (i + quiet) + '" width="1" height="1" fill="#000000"/>';
        }
        out += '</svg>';
        return out;
    }
    // Opening a shared link jumps straight to a print-ready sheet.
    function shareNotice(title, msg) {
        document.getElementById('sidebar').innerHTML = '';
        document.getElementById('app').innerHTML =
            '<div class="panel narrow"><div class="title">' + escapeHtml(title) + '</div>' +
            '<div class="hintline">' + escapeHtml(msg) + '</div></div>';
    }
    // Entry point for a shared link: either a short code or the inline payload.
    function tryOpenShared() {
        var code = codeFromLocation();
        if (code) {
            shareNotice('불러오는 중', '공유된 자리배치표를 가져오고 있습니다…');
            loadShare(code, function (payload, err) {
                if (payload) {
                    if (openPayload(payload)) return;
                    shareNotice('열 수 없음', '공유 데이터를 읽지 못했습니다.');
                    return;
                }
                if (err === 'expired') shareNotice('링크 만료', '이 공유 링크는 1시간이 지나 더 이상 열 수 없습니다.');
                else if (err === 'missing') shareNotice('링크 없음', '없는 링크이거나 이미 만료된 링크입니다.');
                else if (err === 'noconfig') shareNotice('설정 필요', '이 사이트에 공유 서버가 설정되어 있지 않습니다.');
                else shareNotice('연결 실패', '공유 서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.');
            });
            return true;
        }
        var h = location.hash || '';
        if (h.indexOf('#s=') !== 0) return false;
        return openPayload(h.substring(3));
    }
    function openPayload(raw) {
        var b64 = String(raw).replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        var o;
        try { o = JSON.parse(decodeURIComponent(escape(atob(b64)))); } catch (e) { return false; }
        if (!o || !o.exp) return false;
        if (Date.now() > o.exp) {
            shareNotice('링크 만료', '이 공유 링크는 1시간이 지나 더 이상 열 수 없습니다.');
            return true;
        }
        className = o.cls || '';
        rows = o.rows; cols = o.cols;
        tripleDesk = o.td || null;
        enabledSeats = emptyGrid(true);
        currentSeats = emptyGrid(null);
        newSeats = emptyGrid(null);
        var i, p;
        for (i = 0; i < (o.off || []).length; i++) {
            p = o.off[i].split(',');
            if (enabledSeats[+p[0]]) enabledSeats[+p[0]][+p[1]] = false;
        }
        students = {};
        participants = [];
        for (var k in o.names) if (o.names.hasOwnProperty(k)) {
            students[+k] = { name: o.names[k][0], gender: o.names[k][1] };
            participants.push(+k);
        }
        participants.sort(function (a, b) { return a - b; });
        studentCount = participants.length ? participants[participants.length - 1] : 0;
        for (i = 0; i < (o.seats || []).length; i++) {
            p = o.seats[i].split(',');
            newSeats[+p[0]][+p[1]] = +p[2];
            currentSeats[+p[0]][+p[1]] = +p[2];
        }
        hasResult = true;
        applyFormat(o.fmt);
        view = 'print.sheet';
        render();
        return true;
    }

    // ====== SAVE / LOAD ======
    function openLoadDialog(inputId) {
        var fi = document.getElementById(inputId);
        if (!fi) return;
        fi.value = '';
        fi.click();
    }
    function saveToFile() {
        var lines = [], i, r, c, num, s, content, blob, url, a, k, p;
        for (i = 0; i < 100; i++) lines.push('.');
        lines.push('META;NAME;"' + escapeTextName(className) + '"');
        if (tripleDesk) lines.push('META;TRIPLE;' + tripleDesk.r + ',' + tripleDesk.c);
        lines.push('META;ROWS;' + rows);
        lines.push('META;COLS;' + cols);
        lines.push('META;COUNT;' + studentCount);
        lines.push('META;ABSENT;"' + getAbsentText() + '"');
        var disabledList = [];
        for (r = 0; r < rows; r++) for (c = 0; c < NC(); c++) if (!enabledSeats[r][c]) disabledList.push(r + ',' + c);
        lines.push('META;DISABLED;"' + disabledList.join(';') + '"');
        for (i = 0; i < participants.length; i++) {
            num = participants[i];
            s = students[num] || { name: '', gender: 'M' };
            lines.push('S;' + num + ';"' + escapeTextName(s.name || '') + '";' + (s.gender || 'M'));
        }
        var out = hasResult ? newSeats : currentSeats;
        for (r = 0; r < rows; r++) for (c = 0; c < NC(); c++) {
            if (out[r] && out[r][c] != null) lines.push('P;' + r + ';' + c + ';' + out[r][c]);
        }
        for (i = 0; i < participants.length; i++) {
            num = participants[i];
            var cd = conditions[num];
            if (!cd) continue;
            if (cd.mustPairWith != null) lines.push('CF;' + num + ';' + cd.mustPairWith);
            if (cd.pairGender) lines.push('CG;' + num + ';' + cd.pairGender);
            if (cd.allowedSeats && cd.allowedSeats.length > 0) {
                var arr = [];
                for (k = 0; k < cd.allowedSeats.length; k++) {
                    p = cd.allowedSeats[k];
                    arr.push(p.r + ',' + p.c);
                }
                lines.push('CS;' + num + ';"' + arr.join(';') + '"');
            }
        }
        content = lines.join('\r\n');
        if (window.Blob) {
            blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            if (window.navigator && window.navigator.msSaveBlob) { window.navigator.msSaveBlob(blob, 'seat_save.txt'); return; }
            if (window.URL && window.URL.createObjectURL) {
                url = window.URL.createObjectURL(blob);
                a = document.createElement('a');
                a.href = url; a.download = 'seat_save.txt';
                document.body.appendChild(a);
                if (a.click) a.click(); else window.location.href = url;
                setTimeout(function () {
                    if (a.parentNode) a.parentNode.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 100);
                return;
            }
        }
        alert('이 브라우저에서는 저장 기능을 지원하지 않습니다.');
    }

    function loadFromSelectedFile(inputId, studentsOnly) {
        var fi = document.getElementById(inputId), file, reader;
        if (!fi || !fi.files || !fi.files[0]) { alert('불러올 txt 파일을 먼저 선택해 주세요.'); return; }
        file = fi.files[0];
        if (!window.FileReader) { alert('이 브라우저에서는 불러오기 기능을 지원하지 않습니다.'); return; }
        reader = new FileReader();
        reader.onload = function (e) {
            var text = e && e.target ? e.target.result : reader.result;
            if (parseLoadedText(text, studentsOnly)) {
                condEditNum = null; checkedRows = {};
                viewSelectedRC = null; selectedBankNum = null; selectedSeatRC = null;
                if (studentsOnly) { view = 'students.list'; }
                else { view = 'seats.random'; hasResult = true; }
                render();
            }
        };
        reader.onerror = function () { alert('파일을 읽지 못했습니다.'); };
        reader.readAsText(file, 'utf-8');
    }

    function parseLoadedText(text, studentsOnly) {
        var normalized = String(text).replace(/\r/g, '');
        var lines = normalized.split('\n');
        var metaRows = null, metaCols = null, metaCount = null, metaAbsent = null, metaDisabled = null;
        var metaName = null, metaTriple = null;
        var loadedStudents = {}, placements = [], condF = {}, condG = {}, condS = {};
        var i, line, m, num, parsedAbs, parts, k, rr, cc;

        for (i = 0; i < lines.length; i++) {
            line = trim(lines[i]);
            if (line === '' || line === '.') continue;
            m = line.match(/^META\s*;\s*NAME\s*;\s*"((?:[^"]|"")*)"\s*$/i); if (m) { metaName = m[1].replace(/""/g, '"'); continue; }
            m = line.match(/^META\s*;\s*TRIPLE\s*;\s*(\d+)\s*,\s*(\d+)\s*$/i); if (m) { metaTriple = { r: parseInt(m[1],10), c: parseInt(m[2],10) }; continue; }
            m = line.match(/^META\s*;\s*ROWS\s*;\s*(\d+)\s*$/i); if (m) { metaRows = parseInt(m[1], 10); continue; }
            m = line.match(/^META\s*;\s*COLS\s*;\s*(\d+)\s*$/i); if (m) { metaCols = parseInt(m[1], 10); continue; }
            m = line.match(/^META\s*;\s*COUNT\s*;\s*(\d+)\s*$/i); if (m) { metaCount = parseInt(m[1], 10); continue; }
            m = line.match(/^META\s*;\s*ABSENT\s*;\s*"([^"]*)"\s*$/i); if (m) { metaAbsent = m[1]; continue; }
            m = line.match(/^META\s*;\s*DISABLED\s*;\s*"([^"]*)"\s*$/i); if (m) { metaDisabled = m[1]; continue; }
            m = line.match(/^S\s*;\s*(\d+)\s*;\s*"((?:[^"]|"")*)"\s*;\s*([MFN])\s*$/i);
            if (m) {
                num = parseInt(m[1], 10);
                loadedStudents[num] = { name: m[2].replace(/""/g, '"'), gender: m[3].toUpperCase() };
                continue;
            }
            m = line.match(/^P\s*;\s*(\d+)\s*;\s*(\d+)\s*;\s*(\d+)\s*$/i);
            if (m) { placements.push({ r: parseInt(m[1], 10), c: parseInt(m[2], 10), num: parseInt(m[3], 10) }); continue; }
            m = line.match(/^CF\s*;\s*(\d+)\s*;\s*(\d+)\s*$/i);
            if (m) { condF[parseInt(m[1], 10)] = parseInt(m[2], 10); continue; }
            m = line.match(/^CG\s*;\s*(\d+)\s*;\s*([MF])\s*$/i);
            if (m) { condG[parseInt(m[1], 10)] = m[2].toUpperCase(); continue; }
            m = line.match(/^CS\s*;\s*(\d+)\s*;\s*"([^"]*)"\s*$/i);
            if (m) {
                var arr = [], items = m[2].split(';');
                for (k = 0; k < items.length; k++) {
                    if (items[k] === '') continue;
                    var pp = items[k].split(',');
                    if (pp.length === 2) arr.push({ r: parseInt(pp[0], 10), c: parseInt(pp[1], 10) });
                }
                condS[parseInt(m[1], 10)] = arr;
                continue;
            }
        }
        if (metaCount == null || (!studentsOnly && (metaRows == null || metaCols == null))) {
            alert('저장 파일에서 기본 정보를 확인할 수 없습니다.'); return false;
        }
        if (metaCount < 1 || (!studentsOnly && (metaRows < 1 || metaCols < 1))) {
            alert('저장 파일의 값이 올바르지 않습니다.'); return false;
        }
        parsedAbs = parseAbsentList(metaAbsent || '', metaCount);
        if (parsedAbs === null) { alert('저장 파일의 결번 정보가 올바르지 않습니다.'); return false; }

        if (metaName != null) className = metaName;
        if (!studentsOnly) {
            rows = metaRows; cols = metaCols;
            tripleDesk = (metaTriple && metaTriple.r < metaRows && metaTriple.c % 2 === 0 && metaTriple.c + 1 < metaCols) ? metaTriple : null;
        }
        studentCount = metaCount;
        absentNumbers = parsedAbs;
        buildParticipants();
        if (participants.length < 1) { alert('저장 파일의 참여 인원이 부족합니다.'); return false; }

        if (!studentsOnly) {
            enabledSeats = emptyGrid(true);
            if (metaDisabled) {
                parts = metaDisabled.split(';');
                for (k = 0; k < parts.length; k++) {
                    if (parts[k] === '') continue;
                    var dpp = parts[k].split(',');
                    if (dpp.length === 2) {
                        rr = parseInt(dpp[0], 10); cc = parseInt(dpp[1], 10);
                        if (rr >= 0 && rr < rows && cc >= 0 && cc < NC()) enabledSeats[rr][cc] = false;
                    }
                }
            }
        }

        students = {};
        for (i = 0; i < participants.length; i++) {
            num = participants[i];
            var ls = loadedStudents[num];
            students[num] = ls
                ? { name: ls.name || '', gender: ls.gender === 'F' ? 'F' : 'M' }
                : { name: '', gender: 'M' };
        }

        if (!studentsOnly) {
            currentSeats = emptyGrid(null);
            newSeats = emptyGrid(null);
            for (i = 0; i < placements.length; i++) {
                var p2 = placements[i];
                if (p2.r < 0 || p2.r >= rows || p2.c < 0 || p2.c >= NC()) continue;
                if (!enabledSeats[p2.r][p2.c]) continue;
                if (participants.indexOf(p2.num) < 0) continue;
                newSeats[p2.r][p2.c] = p2.num;
                currentSeats[p2.r][p2.c] = p2.num;
            }
        } else {
            // keep grid, just drop anyone no longer on the roster
            for (rr = 0; rr < rows; rr++) for (cc = 0; cc < NC(); cc++) {
                if (currentSeats[rr][cc] != null && participants.indexOf(currentSeats[rr][cc]) < 0) currentSeats[rr][cc] = null;
                if (newSeats[rr][cc] != null && participants.indexOf(newSeats[rr][cc]) < 0) newSeats[rr][cc] = null;
            }
        }

        conditions = {};
        for (i = 0; i < participants.length; i++) {
            num = participants[i];
            conditions[num] = {
                mustPairWith: condF[num] != null ? condF[num] : null,
                pairGender: condG[num] || '',
                allowedSeats: condS[num] || []
            };
        }
        sanitizeConditionsAgainstGrid();
        return true;
    }

    // ====== INIT ======
    function setDefaults() {
        rows = 5; cols = 6;
        studentCount = 30;
        absentNumbers = [];
        students = {};
        conditions = {};
        buildParticipants();
        enabledSeats = emptyGrid(true);
        currentSeats = emptyGrid(null);
        newSeats = emptyGrid(null);
        var i, num;
        for (i = 0; i < participants.length; i++) {
            num = participants[i];
            students[num] = { name: '', gender: 'M' };
        }
        hasResult = false;
    }

    setDefaults();
    if (!tryOpenShared()) render();
    // following a share link from an already-open page only changes the hash
    window.addEventListener('hashchange', function () { tryOpenShared(); });
})();
</script>
