<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자리 바꾸기</title>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: #e9edf3;
    background-color: #14171c;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}
body::before {
    content: "";
    position: fixed;
    left: 0; top: 0; right: 0; bottom: 0;
    z-index: -1;
    pointer-events: none;
    background-image:
        radial-gradient(1000px 720px at 8% -12%, rgba(96,126,178,0.20), transparent 62%),
        radial-gradient(880px 640px at 104% 112%, rgba(72,94,138,0.18), transparent 62%),
        linear-gradient(158deg, #171a20 0%, #1c2027 48%, #13161b 100%);
}

/* ============ SHELL + SIDEBAR ============ */
.shell { display: flex; min-height: 100vh; align-items: stretch; }
.sidebar {
    position: sticky;
    top: 0;
    align-self: flex-start;
    flex: 0 0 220px;
    width: 220px;
    height: 100vh;
    padding: 26px 16px 20px;
    overflow-y: auto;
    background: rgba(255,255,255,0.035);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    backdrop-filter: blur(14px) saturate(140%);
    border-right: 1px solid rgba(255,255,255,0.07);
    scrollbar-width: none;
    -ms-overflow-style: none;
}
.sidebar::-webkit-scrollbar { display: none; }
.navBrand {
    padding: 0 11px 22px;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: #eef2f8;
}
.navGroup { margin-bottom: 2px; }
.navTop {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 11px 12px;
    border-radius: 13px;
    border: 1px solid transparent;
    background: transparent;
    color: #a6b1c0;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
    transition: background .18s, color .18s, border-color .18s;
}
.navTop:hover { background: rgba(255,255,255,0.06); color: #e7ecf3; }
.navTop.active {
    color: #ffffff;
    background: linear-gradient(135deg, rgba(92,142,250,0.32), rgba(92,142,250,0.11));
    border-color: rgba(132,176,255,0.34);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16);
}
.navIco { flex: 0 0 20px; width: 20px; height: 20px; display: block; }
.navSubs {
    margin: 4px 0 12px 21px;
    padding-left: 12px;
    border-left: 1px solid rgba(255,255,255,0.11);
}
.navSub {
    display: block;
    width: 100%;
    margin: 2px 0;
    padding: 8px 11px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: #8d98a8;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: background .16s, color .16s;
}
.navSub:hover { color: #dbe3ee; background: rgba(255,255,255,0.05); }
.navSub.active { color: #93baff; background: rgba(110,160,255,0.14); }

/* ============ MAIN ============ */
.main {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 34px 26px;
}
/* No backdrop-filter here on purpose: anything animating inside the panel would force
   the browser to re-blur the backdrop every frame. The layered translucent fill below
   reads the same against the static page gradient and costs nothing. */
.panel {
    position: relative;
    width: 100%;
    max-width: 940px;
    padding: 30px 34px 32px;
    border-radius: 26px;
    background:
        linear-gradient(158deg, rgba(255,255,255,0.085) 0%, rgba(255,255,255,0.030) 45%, rgba(255,255,255,0.055) 100%),
        rgba(28,33,41,0.62);
    border: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 26px 70px rgba(0,0,0,0.50), inset 0 1px 0 rgba(255,255,255,0.15);
}
.panel.narrow { max-width: 620px; }
.title {
    font-size: 29px;
    font-weight: 800;
    text-align: center;
    letter-spacing: -0.6px;
    margin: 0 0 22px 0;
    background: linear-gradient(180deg, #ffffff 0%, #b6c1d1 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}
.hintline { text-align: center; font-size: 13px; color: #8b96a6; margin: -12px 0 18px; }

/* ============ FORM ============ */
.split { display: flex; gap: 26px; align-items: flex-start; }
.splitL { flex: 1 1 auto; min-width: 0; }
.splitR { flex: 0 0 auto; text-align: center; padding-top: 22px; }
.field { margin-bottom: 15px; }
.fieldLabel {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #97a3b4;
    letter-spacing: .2px;
    margin-bottom: 7px;
}
.inputbox {
    width: 100%;
    padding: 13px 16px;
    border-radius: 14px;
    background: rgba(9,12,17,0.55);
    border: 1px solid rgba(255,255,255,0.085);
    color: #f0f3f8;
    font-size: 17px;
    font-weight: 600;
    font-family: inherit;
    outline: none;
    transition: border-color .18s, box-shadow .18s, background .18s;
}
.inputbox:focus {
    border-color: rgba(120,165,255,0.55);
    background: rgba(9,12,17,0.78);
    box-shadow: 0 0 0 3px rgba(90,140,255,0.15);
}
.inputbox:disabled { opacity: .4; }
.inputbox::placeholder { color: #5d6674; font-weight: 500; }
.selectbox {
    width: 100%;
    padding: 12px 14px;
    border-radius: 13px;
    background: rgba(9,12,17,0.6);
    border: 1px solid rgba(255,255,255,0.085);
    color: #eef2f7;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    outline: none;
}

/* ============ BUTTONS ============ */
.btn {
    padding: 12px 22px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.075);
    color: #e9edf3;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
}
.btn:hover { background: rgba(255,255,255,0.135); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: .35; cursor: default; transform: none; }
.btn:disabled:hover { background: rgba(255,255,255,0.075); transform: none; }
.btn.primary {
    background: linear-gradient(145deg, #4183fb, #2b62d8);
    border-color: rgba(255,255,255,0.20);
    box-shadow: 0 8px 22px rgba(45,100,220,0.34), inset 0 1px 0 rgba(255,255,255,0.30);
}
.btn.primary:hover { background: linear-gradient(145deg, #4f8cfc, #3169e0); }
.btn.green {
    background: linear-gradient(145deg, #2fb571, #1e8f55);
    border-color: rgba(255,255,255,0.18);
    box-shadow: 0 8px 20px rgba(30,140,85,0.30), inset 0 1px 0 rgba(255,255,255,0.26);
}
.btn.red {
    background: linear-gradient(145deg, #e34e4e, #bd3636);
    border-color: rgba(255,255,255,0.18);
    box-shadow: 0 8px 20px rgba(190,55,55,0.30), inset 0 1px 0 rgba(255,255,255,0.24);
}
.btn.amber {
    background: linear-gradient(145deg, #f2c94a, #dca81c);
    border-color: rgba(255,255,255,0.28);
    color: #2b2510;
    box-shadow: 0 8px 20px rgba(210,160,20,0.28), inset 0 1px 0 rgba(255,255,255,0.55);
}
.btn.orange {
    background: linear-gradient(145deg, #f28c2e, #d47015);
    border-color: rgba(255,255,255,0.18);
    box-shadow: 0 8px 20px rgba(210,110,20,0.28), inset 0 1px 0 rgba(255,255,255,0.26);
}
.btn.tiny { padding: 6px 15px; font-size: 13px; border-radius: 10px; }
.btn.sm { padding: 9px 17px; font-size: 14px; border-radius: 12px; }
.controls { text-align: center; margin-top: 20px; }
.controls .btn { margin: 5px 5px; }
.rowBetween { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ============ SEAT BOARD ============ */
.boardWrap { text-align: center; }
.flipRow { display: block; text-align: center; margin-bottom: 8px; }
.chalkRow { display: block; text-align: center; margin-bottom: 10px; }
.chalkRow.bottom { margin-bottom: 0; margin-top: 10px; }
.boardRow {
    display: block;
    text-align: center;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
    scrollbar-width: none;
    -ms-overflow-style: none;
}
.boardRow::-webkit-scrollbar { display: none; }
.chalk {
    display: inline-block;
    padding: 6px 32px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 7px;
    text-indent: 7px;
    color: #909baa;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.075);
}
.seatBoard {
    --cw: 78px;
    --ch: 60px;
    position: relative;
    display: inline-block;
    padding: 14px;
    border-radius: 20px;
    background: rgba(7,9,13,0.46);
    border: 1px solid rgba(255,255,255,0.07);
    box-shadow: inset 0 2px 22px rgba(0,0,0,0.45);
    overflow: hidden;
}
.seatRow { white-space: nowrap; margin-bottom: 7px; }
.seatRow:last-child { margin-bottom: 0; }
.seatCell {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: var(--cw);
    height: var(--ch);
    margin: 0 2px;
    padding: 0 4px;
    vertical-align: middle;
    flex: 0 0 auto;
    min-width: 0;
    border-radius: 12px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.07);
    color: #ffffff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.15;
    cursor: pointer;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    transition: transform .14s ease, box-shadow .16s ease, background .16s ease;
}
.seatCell:hover { transform: translateY(-2px); }
.seatCell.static, .seatCell.static:hover { cursor: default; transform: none; }
.seatCell.filledM {
    background: linear-gradient(150deg, #4183fb, #2a5fc4);
    border-color: rgba(255,255,255,0.20);
    box-shadow: 0 6px 16px rgba(40,90,200,0.32), inset 0 1px 0 rgba(255,255,255,0.26);
}
.seatCell.filledF {
    background: linear-gradient(150deg, #e35d95, #bf3d73);
    border-color: rgba(255,255,255,0.20);
    box-shadow: 0 6px 16px rgba(180,55,105,0.32), inset 0 1px 0 rgba(255,255,255,0.26);
}
.seatCell.disabled {
    background: transparent;
    border: 1px dashed rgba(255,255,255,0.12);
    cursor: default;
}
.seatCell.disabled:hover { transform: none; }
.seatCell.allowed {
    background: linear-gradient(150deg, #4183fb, #2a5fc4);
    border-color: rgba(245,205,80,0.9);
    box-shadow: 0 0 0 2px rgba(245,205,80,0.75), 0 6px 16px rgba(40,90,200,0.3);
}
.seatCell.selected {
    box-shadow: 0 0 0 3px #f5cd50, 0 10px 26px rgba(0,0,0,0.45);
    transform: translateY(-2px);
}
.seatCell.dropTarget { box-shadow: 0 0 0 2px rgba(120,180,255,0.8); }
.cellNum {
    font-size: 11px;
    font-weight: 500;
    color: rgba(255,255,255,0.82);
    line-height: 1.1;
    margin-bottom: 2px;
}
.cellName {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.15;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.deskGap { display: inline-block; width: 16px; vertical-align: middle; }
.miniCell { margin: 0 1px; border-radius: 8px; font-size: 12px; }
.seatBoard.mini { --cw: 40px; --ch: 32px; }
.miniCell .cellNum { font-size: 9px; }
.miniCell .cellName { font-size: 11px; }
.seatBoard.mini { padding: 9px; border-radius: 15px; }
.deskGrp { display: inline-flex; vertical-align: middle; }
.deskGrp.desk3 { width: calc(var(--cw) * 2 + 8px); }
.deskGrp.desk3 .seatCell { flex: 1 1 0; width: auto; padding: 0 1px; }
.seatBoard.mini .deskGrp.desk3 { width: calc(var(--cw) * 2 + 4px); }
.seatBoard.mini .seatRow { margin-bottom: 4px; }
.previewCap { font-size: 13px; color: #8d99a9; margin-top: 9px; font-weight: 600; }

/* ============ BANK ============ */
.bank {
    margin: 14px 0 4px;
    padding: 12px;
    border-radius: 16px;
    background: rgba(7,9,13,0.4);
    border: 1px solid rgba(255,255,255,0.06);
    text-align: center;
    min-height: 54px;
}
.bankSlot {
    display: inline-block;
    margin: 4px;
    padding: 8px 15px;
    border-radius: 11px;
    background: linear-gradient(145deg, #4183fb, #2a5fc4);
    border: 1px solid rgba(255,255,255,0.18);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
}
.bankSlot.femaleSlot { background: linear-gradient(145deg, #e35d95, #bf3d73); }
.bankSlot:hover { transform: translateY(-2px); }
.bankSlot.selected { box-shadow: 0 0 0 3px #f5cd50; }
.bankEmpty { color: #7a8494; font-size: 14px; padding: 12px 0; }

/* ============ TABLE ============ */
.tableWrap {
    max-height: 470px;
    overflow-y: auto;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(7,9,13,0.32);
    scrollbar-width: none;
    -ms-overflow-style: none;
}
.tableWrap::-webkit-scrollbar { display: none; width: 0; height: 0; }
.stable { width: 100%; border-collapse: collapse; }
.stable thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    font-size: 13px;
    font-weight: 600;
    color: #96a2b3;
    padding: 11px 6px;
    background: rgba(26,30,37,0.97);
    border-bottom: 1px solid rgba(255,255,255,0.07);
}
.stable td {
    padding: 8px 6px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    border-bottom: 1px solid rgba(255,255,255,0.045);
}
.stable tbody tr:nth-child(odd) { background: rgba(255,255,255,0.022); }
.stable tbody tr.absentRow td { color: #5f6a79; font-weight: 500; }
.colChk { width: 44px; }
.colNum { width: 70px; }
.colGen { width: 70px; }
.colCond { width: 110px; }
.gTagM { color: #7fb0ff; }
.gTagF { color: #f193ba; }
input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #4183fb; }
input[type="radio"] { width: 16px; height: 16px; cursor: pointer; accent-color: #4183fb; }
.checkline {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: #c2cbd8;
    cursor: pointer;
    margin: 6px 14px 6px 0;
}

/* ============ NUMBER GRID (조건 목록) ============ */
.numGrid { text-align: center; }
.numbtn {
    display: inline-block;
    width: 60px;
    margin: 4px;
    padding: 11px 0;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.06);
    color: #dde4ee;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s, background .15s;
}
.numbtn:hover { transform: translateY(-2px); background: rgba(255,255,255,0.12); }
.numbtn.set {
    background: linear-gradient(145deg, #f28c2e, #d47015);
    border-color: rgba(255,255,255,0.2);
    box-shadow: 0 6px 16px rgba(210,110,20,0.28), inset 0 1px 0 rgba(255,255,255,0.26);
}

/* ============ CONDITION SECTIONS ============ */
.condSection {
    margin-bottom: 15px;
    padding: 16px 18px;
    border-radius: 18px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.07);
}
.condSection.disabled { opacity: .42; pointer-events: none; }
.condSectionTitle {
    font-size: 13px;
    font-weight: 700;
    color: #f0c14b;
    letter-spacing: .3px;
    margin-bottom: 11px;
}
.radioLine {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-right: 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}
.backbtn {
    position: absolute;
    top: 26px;
    right: 30px;
    padding: 8px 16px;
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.11);
    color: #dbe2eb;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background .16s;
}
.backbtn:hover { background: rgba(255,255,255,0.15); }
.fileinput { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.stepDot { text-align: center; font-size: 13px; color: #8b96a6; font-weight: 600; margin-bottom: 14px; }

/* ============ REVEAL (SHIFT) ============ */
.seatCell.spinning {
    background: linear-gradient(150deg, #5c6675, #3e4653);
    border-color: rgba(255,255,255,0.14);
    transition: none;
    animation: spinPulse .34s ease-in-out infinite alternate;
}
.seatRow:nth-child(2n) .seatCell.spinning { animation-delay: -.11s; }
.seatRow:nth-child(3n) .seatCell.spinning { animation-delay: -.22s; }
.seatCell.spinning .cellName { opacity: .6; }
@keyframes spinPulse {
    from { transform: translateY(0) scale(1); }
    to   { transform: translateY(-3px) scale(1.03); }
}
.seatCell.locked { animation: lockPop .46s cubic-bezier(.16,1.2,.3,1) both; }
@keyframes lockPop {
    0%   { transform: scale(.55) rotateX(70deg); opacity: 0; }
    45%  { transform: scale(1.22) rotateX(0deg); opacity: 1; }
    75%  { transform: scale(.96); }
    100% { transform: scale(1); }
}
/* the gold flare is a sibling overlay: only opacity/transform animate, so it composites */
.flare {
    position: fixed;
    z-index: 94;
    border-radius: 14px;
    pointer-events: none;
    box-shadow: 0 0 0 4px rgba(245,205,80,.6), 0 0 34px 8px rgba(245,205,80,.5);
    animation: flareOut .5s ease-out both;
}
@keyframes flareOut {
    0%   { opacity: 0; transform: scale(.8); }
    28%  { opacity: 1; transform: scale(1.06); }
    100% { opacity: 0; transform: scale(1); }
}
.sweep {
    position: absolute;
    top: 0; bottom: 0;
    width: 46%;
    pointer-events: none;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.13) 38%, rgba(180,215,255,.32) 52%, rgba(255,255,255,.13) 66%, transparent);
    animation: sweepRun 1.05s cubic-bezier(.4,0,.25,1) forwards;
}
@keyframes sweepRun { from { left: -50%; } to { left: 108%; } }
.flash {
    position: fixed;
    left: 0; top: 0; right: 0; bottom: 0;
    z-index: 85;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(200,225,255,.30), transparent 68%);
    animation: flashOut .55s ease-out forwards;
}
@keyframes flashOut { from { opacity: 1; } to { opacity: 0; } }
.seatCell.burst { animation: burstFx .6s cubic-bezier(.2,1,.3,1) both; }
@keyframes burstFx {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.3) rotate(-4deg); }
    60%  { transform: scale(.94) rotate(3deg); }
    100% { transform: scale(1) rotate(0); }
}
.spark { position: fixed; z-index: 96; width: 9px; height: 9px; border-radius: 50%; pointer-events: none; }

/* ============ INLINE EDIT TABLE ============ */
.cellInput {
    width: 100%;
    max-width: 210px;
    padding: 6px 11px;
    border-radius: 9px;
    background: rgba(9,12,17,0.55);
    border: 1px solid rgba(255,255,255,0.09);
    color: #eef2f7;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    outline: none;
    transition: border-color .16s, box-shadow .16s;
}
.cellInput:focus { border-color: rgba(120,165,255,0.6); box-shadow: 0 0 0 2px rgba(90,140,255,0.17); }
.cellInput:disabled { opacity: .3; }
.genBtn {
    padding: 5px 14px;
    border-radius: 9px;
    border: 1px solid rgba(127,176,255,0.32);
    background: rgba(65,131,251,0.18);
    color: #7fb0ff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s;
}
.genBtn:hover { background: rgba(65,131,251,0.3); }
.genBtn.f {
    border-color: rgba(241,147,186,0.32);
    background: rgba(227,93,149,0.18);
    color: #f193ba;
}
.genBtn.f:hover { background: rgba(227,93,149,0.3); }
.genBtn:disabled { opacity: .3; cursor: default; }


/* ============ PRINT SHEET EDITOR ============ */
.panel.wide { max-width: 1160px; }
.sheetArea { display: flex; gap: 14px; align-items: flex-start; }
.toolCol { display: flex; flex-direction: column; gap: 10px; flex: 0 0 auto; padding-top: 2px; }
.toolBtn {
    width: 44px; height: 44px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.06);
    color: #b9c3d1;
    cursor: pointer;
    transition: transform .15s, background .15s, color .15s, box-shadow .15s;
}
.toolBtn:hover { transform: translateY(-2px); background: rgba(255,255,255,0.12); color: #fff; }
.toolBtn.active {
    color: #fff;
    background: linear-gradient(145deg, #4183fb, #2b62d8);
    border-color: rgba(255,255,255,0.22);
    box-shadow: 0 6px 18px rgba(45,100,220,.36), inset 0 1px 0 rgba(255,255,255,.3);
}
.toolBtn svg { width: 22px; height: 22px; display: block; }
.sheetHost { flex: 1 1 auto; min-width: 0; width: 100%; max-width: 100%; overflow: hidden; }
.sheetOuter {
    position: relative;
    width: 100%;
    max-width: 100%;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.10);
    background: #0d1014;
}
.sheetPage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1000px;
    height: 707px;
    transform-origin: 0 0;
    user-select: none;
    -webkit-user-select: none;
}
.sEl { position: absolute; box-sizing: border-box; cursor: move; }
/* editor-only guides: never part of the exported/printed sheet */
.sEl.guide { outline: 1px dashed rgba(140,150,165,.75); outline-offset: 3px; }
.sEl.selEl { outline: 2px dashed rgba(120,175,255,.95); outline-offset: 3px; }
.sTitle { text-align: center; font-weight: 800; letter-spacing: -0.5px; white-space: nowrap; }
.sText { font-weight: 600; white-space: nowrap; }
.sDesk {
    display: flex; align-items: center; justify-content: center;
    border: 1.6px solid currentColor; border-radius: 8px; font-weight: 700;
}
.sDesk .vtext { writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 2px; }
.sBoard { border-radius: 14px; border: 1px solid transparent; }
.sCell {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    border-radius: 9px; border: 1px solid transparent;
    font-weight: 700; font-size: 17px;
    overflow: hidden; white-space: nowrap;
}
.minisel {
    padding: 6px 10px; border-radius: 10px;
    background: rgba(9,12,17,0.6); border: 1px solid rgba(255,255,255,0.10);
    color: #eef2f7; font-family: inherit; font-size: 14px; font-weight: 600; outline: none;
}
.numbox {
    width: 62px; margin-left: 6px; padding: 6px 8px; border-radius: 9px;
    background: rgba(9,12,17,0.6); border: 1px solid rgba(255,255,255,0.10);
    color: #eef2f7; font-family: inherit; font-size: 14px; font-weight: 600; outline: none;
}
.txtbox {
    width: 200px; margin-left: 6px; padding: 6px 10px; border-radius: 9px;
    background: rgba(9,12,17,0.6); border: 1px solid rgba(255,255,255,0.10);
    color: #eef2f7; font-family: inherit; font-size: 14px; font-weight: 600; outline: none;
}
.numbox:focus, .txtbox:focus { border-color: rgba(120,165,255,0.6); }
.hintdim { font-size: 13px; color: #7d8797; }
.sheetBar { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
@media (max-width: 860px) {
    .sheetArea { gap: 8px; }
    .toolCol { flex-direction: row; }
    .sheetArea { flex-direction: column; }
    .toolBtn { width: 40px; height: 40px; }
}


.sharePanel {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    flex-wrap: wrap; margin-top: 16px; padding: 16px;
    border-radius: 18px; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
}
.qrSvg { display: block; border-radius: 10px; background: #fff; padding: 6px; flex: 0 0 auto; }
.shareInfo { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; min-width: 0; }
.shareLbl { font-size: 13px; font-weight: 700; color: #9aa5b4; }
.shareBox { width: 320px; max-width: 60vw; margin-left: 0; }
@media (max-width: 620px) { .shareBox { width: 100%; max-width: 100%; } }



.sMark { position: absolute; white-space: nowrap; font-weight: 600; pointer-events: none; cursor: default; }
.sText.editing {
    cursor: text;
    min-width: 60px;
    outline: 2px solid rgba(120,175,255,.95) !important;
    outline-offset: 3px;
    user-select: text;
    -webkit-user-select: text;
    caret-color: #4183fb;
}
.sText.editing:empty::before { content: '텍스트 입력'; opacity: .45; }

/* ============ PRINT ============ */
#printArea { display: none; }
@media print {
    html, body {
        background: #ffffff !important;
        background-image: none !important;
        height: auto !important;
    }
    body > *:not(#printArea):not(#pageRule) { display: none !important; }
    /* the screen gradient lives on a fixed pseudo-element, which body > * does not reach */
    body::before, body::after { display: none !important; content: none !important; }
    #printArea {
        display: flex !important;
        align-items: center;
        justify-content: center;
        width: 100%;
        overflow: hidden;
        break-inside: avoid;
        page-break-inside: avoid;
    }
    #printImg { display: block; width: auto; height: auto; }
}

/* ============ MOBILE ============ */
@media (max-width: 860px) {
    .shell { flex-direction: column; }
    .sidebar {
        position: sticky;
        top: 0;
        z-index: 60;
        flex: none;
        width: 100%;
        height: auto;
        padding: 10px 12px;
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
    }
    .navBrand { display: none; }
    .navGroup { display: contents; }
    .navTop {
        grid-row: 1;
        justify-content: center;
        gap: 7px;
        padding: 9px 6px;
        font-size: 13.5px;
        border-radius: 12px;
        background: rgba(255,255,255,0.05);
        border-color: rgba(255,255,255,0.08);
    }
    .navIco { flex: 0 0 17px; width: 17px; height: 17px; }
    .navSubs {
        grid-row: 2;
        grid-column: 1 / -1;
        display: flex;
        gap: 6px;
        margin: 2px 0 0;
        padding: 8px 0 0;
        border-left: none;
        border-top: 1px solid rgba(255,255,255,0.08);
    }
    .navSub { flex: 1 1 0; text-align: center; padding: 7px 4px; font-size: 13px; }
    .main { padding: 20px 14px 34px; align-items: flex-start; }
    .panel { padding: 24px 18px 26px; border-radius: 22px; }
    .title { font-size: 24px; }
    .backbtn { top: 20px; right: 18px; padding: 7px 13px; font-size: 13px; }
    .split { flex-direction: column; gap: 16px; }
    .splitR { width: 100%; padding-top: 0; }
    .seatBoard { --cw: 52px; --ch: 48px; }
    .seatBoard.mini { --cw: 32px; --ch: 26px; }
    .seatCell { font-size: 12px; margin: 0 1px; padding: 0 2px; }
    .cellNum { font-size: 9px; margin-bottom: 1px; }
    .cellName { font-size: 12px; }
    .miniCell .cellName { font-size: 9px; }
    .deskGap { width: 9px; }
    .stable td { font-size: 14px; padding: 7px 3px; }
    .tableWrap { max-height: 400px; }
    .colNum { width: 46px; }
    .colChk { width: 48px; }
    .colCond { width: 78px; }
    .numbtn { width: 50px; padding: 9px 0; font-size: 13px; }
}
@media (max-width: 520px) {
    .main { padding: 16px 10px 30px; }
    .panel { padding: 22px 14px 24px; }
    .seatBoard { padding: 11px; }
    .seatBoard { --cw: 44px; --ch: 44px; }
    .seatBoard.mini { --cw: 28px; --ch: 24px; }
    .seatCell { margin: 0 1px; }
    .cellNum { font-size: 8px; margin-bottom: 0; }
    .cellName { font-size: 11px; }
    .deskGap { width: 7px; }
    .btn { padding: 10px 16px; font-size: 14px; }
    .controls .btn { margin: 4px 3px; }
    .navTop { font-size: 12.5px; gap: 5px; }
}
</style>
</head>

</div>

<script type="text/javascript">

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';

    // Redraw only the preview so typing never loses focus. Preview is display-only.
    function refreshPreview() {
        var wrap = document.getElementById('previewWrap');
        if (!wrap) return;
        var rEl = document.getElementById('rowsInput'), cEl = document.getElementById('colsInput');
        if (rEl && cEl) {
            var rv = trim(rEl.value), cv = trim(cEl.value);
            if (/^\d+$/.test(rv) && /^\d+$/.test(cv)) {
                var nr = parseInt(rv, 10), nc = parseInt(cv, 10);
                if (nr >= 1 && nr <= 20 && nc >= 1 && nc <= 20 && (nr !== rows || nc !== cols)) resizeGrids(nr, nc);
            }
        }
        wrap.innerHTML = renderSeatBoardHtml('previewBoard', { mode: 'static', mini: true }) +
            '<div class="previewCap">미리 보기</div>';
    }
    function resizeGrids(nr, nc) {
        var oldE = enabledSeats, oldC = currentSeats, oldN = newSeats;
        var oldRows = rows, oldCols = cols, r, c;
        rows = nr; cols = nc;
        enabledSeats = emptyGrid(true);
        currentSeats = emptyGrid(null);
        newSeats = emptyGrid(null);
        for (r = 0; r < Math.min(rows, oldRows); r++) {
            for (c = 0; c < Math.min(cols, oldCols); c++) {
                enabledSeats[r][c] = oldE[r][c];
                currentSeats[r][c] = oldC[r][c];
                newSeats[r][c] = oldN[r][c];
            }
        }
        if (tripleDesk && (tripleDesk.r >= rows || tripleDesk.c % 2 !== 0 || tripleDesk.c + 1 >= cols)) {
            tripleDesk = null;
        }
        if (tripleDesk && tripleDesk.r < oldRows) {
            enabledSeats[tripleDesk.r][cols] = oldE[tripleDesk.r][oldCols];
            currentSeats[tripleDesk.r][cols] = oldC[tripleDesk.r][oldCols];
            newSeats[tripleDesk.r][cols] = oldN[tripleDesk.r][oldCols];
        }
        sanitizeConditionsAgainstGrid();
    }
    function commitSizeInputs(silent) {
        var rEl = document.getElementById('rowsInput');
        if (!rEl) return true;
        var clsEl = document.getElementById('classInput');
        if (clsEl) className = trim(clsEl.value);
        var cEl = document.getElementById('colsInput');
        var nEl = document.getElementById('countInput');
        var aEl = document.getElementById('absentInput');
        var rv = trim(rEl.value), cv = trim(cEl.value), nv = trim(nEl.value), av = aEl.value;
        if (!/^\d+$/.test(rv) || !/^\d+$/.test(cv) || !/^\d+$/.test(nv)) {
            if (!silent) alert('행 수, 열 수, 끝번호는 숫자로 입력해 주세요.');
            return false;
        }
        var nr = parseInt(rv, 10), nc = parseInt(cv, 10), nn = parseInt(nv, 10);
        if (nr < 1 || nc < 1 || nn < 1) {
            if (!silent) alert('행 수, 열 수, 끝번호는 1 이상이어야 합니다.');
            return false;
        }
        if (nr > 20 || nc > 20 || nn > 200) {
            if (!silent) alert('행/열은 20 이하, 끝번호는 200 이하로 입력해 주세요.');
            return false;
        }
        var abs = parseAbsentList(av, nn);
        if (abs === null) {
            if (!silent) alert('결번은 끝번호 범위 안의 숫자를 쉼표로 구분해 입력해 주세요.');
            return false;
        }
        if (nr !== rows || nc !== cols) resizeGrids(nr, nc);
        studentCount = nn;
        absentNumbers = abs;
        syncRoster();
        return true;
    }

    // ====== VIEW: 반 설정 > 자리 사용 설정 ======
    function renderSeatUse(app) {
        var html = '';
        html += '<div class="panel">';
        html += '<div class="title">자리 사용 설정</div>';
        html += '<div class="hintline">칸을 눌러 사용 여부를 바꿉니다 (사용 ' + countEnabled() + ' / 학생 ' + participants.length +
            (tripleDesk ? ', 3인 책상 ' + (tripleDesk.r + 1) + '행' : '') + ')</div>';
        html += boardWithChalk('useBoard', { mode: 'seatuse' }, true);
        html += '<div class="controls">';
        html += '<button id="allOnBtn" class="btn">전체 사용</button>';
        html += '<button id="allOffBtn" class="btn">전체 해제</button>';
        html += '<button id="fitBtn" class="btn primary">인원수만큼</button>';
        html += '</div>';
        html += '<div class="controls" style="margin-top:4px;">';
        html += '<button id="tripleBtn" class="btn sm' + (deskPickMode ? ' primary' : '') + '">' +
            (deskPickMode ? '3인 책상: 자리를 고르세요' : '3인 책상 지정') + '</button>';
        if (tripleDesk) html += '<button id="tripleClearBtn" class="btn sm">3인 책상 해제</button>';
        html += '</div></div>';
        app.innerHTML = html;

        attachFlip();
        document.getElementById('tripleBtn').onclick = function () {
            deskPickMode = !deskPickMode; render();
        };
        if (tripleDesk) {
            document.getElementById('tripleClearBtn').onclick = function () {
                tripleDesk = null; deskPickMode = false; render();
            };
        }
        attachBoardClicks('useBoard', function (r, c) {
            if (deskPickMode) {
                var st = deskStartOf(r, c);
                if (st < 0) { deskPickMode = false; render(); return; }
                var already = (tripleDesk && tripleDesk.r === r && tripleDesk.c === st);
                if (!already) {
                    // only one 3-seat desk at a time: clear the old spare seat first
                    if (tripleDesk) {
                        currentSeats[tripleDesk.r][cols] = null;
                        newSeats[tripleDesk.r][cols] = null;
                    }
                    tripleDesk = { r: r, c: st };
                    enabledSeats[r][cols] = true;
                } else {
                    currentSeats[r][cols] = null;
                    newSeats[r][cols] = null;
                    tripleDesk = null;
                }
                deskPickMode = false;
                syncExtraSeats();
                sanitizeConditionsAgainstGrid();
                render();
                return;
            }
            enabledSeats[r][c] = !enabledSeats[r][c];
            if (!enabledSeats[r][c]) { currentSeats[r][c] = null; newSeats[r][c] = null; }
            sanitizeConditionsAgainstGrid();
            render();
        });
        document.getElementById('allOnBtn').onclick = function () { enabledSeats = emptyGrid(true); render(); };
        document.getElementById('allOffBtn').onclick = function () {
            enabledSeats = emptyGrid(false);
            currentSeats = emptyGrid(null); newSeats = emptyGrid(null);
            sanitizeConditionsAgainstGrid(); render();
        };
        document.getElementById('fitBtn').onclick = function () {
            enabledSeats = emptyGrid(false);
            var left = participants.length, r, dk, di, si, order;
            for (r = 0; r < rows && left > 0; r++) {
                order = rowDesks(r);
                for (di = 0; di < order.length && left > 0; di++) {
                    dk = order[di];
                    for (si = 0; si < dk.seats.length && left > 0; si++) {
                        enabledSeats[r][dk.seats[si]] = true; left--;
                    }
                }
            }
            var rr, cc;
            for (rr = 0; rr < rows; rr++) for (cc = 0; cc < NC(); cc++) {
                if (!enabledSeats[rr][cc]) { currentSeats[rr][cc] = null; newSeats[rr][cc] = null; }
            }
            sanitizeConditionsAgainstGrid(); render();
        };
    }

                if (pc && pc.mustPairWith === num) pc.mustPairWith = null;
            }
            conditions[num] = { mustPairWith: null, pairGender: '', allowedSeats: [] };

        document.getElementById('clearAllowedBtn').onclick = function () {

        document.getElementById('copyAllowedBtn').onclick = function () {

            var arr = [], k;
            for (k = 0; k < c.allowedSeats.length; k++) arr.push({ r: c.allowedSeats[k].r, c: c.allowedSeats[k].c });
            condSeatClipboard = arr;
            render();
        };
        document.getElementById('pasteAllowedBtn').onclick = function () {
            if (locked || !condSeatClipboard) return;
            var arr = [], k, pp;
            for (k = 0; k < condSeatClipboard.length; k++) {
                pp = condSeatClipboard[k];
                if (pp.r < rows && pp.c < NC() && enabledSeats[pp.r] && enabledSeats[pp.r][pp.c]) arr.push({ r: pp.r, c: pp.c });
            }
            c.allowedSeats = arr; render();
        };
        attachBoardClicks('allowedBoard', function (r, cc) {
            if (locked || !enabledSeats[r][cc]) return;
            var found = -1, k;
            for (k = 0; k < c.allowedSeats.length; k++) {
                if (c.allowedSeats[k].r === r && c.allowedSeats[k].c === cc) { found = k; break; }
            }
            if (found >= 0) c.allowedSeats.splice(found, 1);
            else c.allowedSeats.push({ r: r, c: cc });
            render();
        });
    }

    function attachBankInteractions() {
        var bank = document.getElementById('bank');
        if (!bank) return;
        function slotFrom(node) {
            while (node && node !== bank) {
                if (node.getAttribute && node.getAttribute('data-bn') !== null) return node;
                node = node.parentNode;
            }
            return null;
        }
        bank.onclick = function (ev) {
            var el = slotFrom(ev.target);
            if (!el) return;
            var num = parseInt(el.getAttribute('data-bn'), 10);
            selectedSeatRC = null;
            selectedBankNum = (selectedBankNum === num) ? null : num;
            render();
        };
        bank.ondragstart = function (ev) {
            var el = slotFrom(ev.target);
            if (!el) return;
            dragSource = { kind: 'bank', num: parseInt(el.getAttribute('data-bn'), 10) };
            if (ev.dataTransfer) {
                ev.dataTransfer.effectAllowed = 'move';
                ev.dataTransfer.setData('text/plain', String(dragSource.num));
            }
        };
        bank.ondragend = function () { dragSource = null; };
        bank.ondragover = function (ev) { ev.preventDefault(); };
        bank.ondrop = function (ev) {
            ev.preventDefault();
            if (dragSource && dragSource.kind === 'seat') {
                currentSeats[dragSource.r][dragSource.c] = null;
                dragSource = null;
                render();
            }
        };
    }

    function attachPlaceInteractions() {
        var board = document.getElementById('mainBoard');
        if (!board) return;
        var hot = null;
        function rc(node) {
            var el = cellFrom(board, node);
            if (!el) return null;
            return { el: el, r: parseInt(el.getAttribute('data-r'), 10), c: parseInt(el.getAttribute('data-c'), 10) };
        }
        board.onclick = function (ev) {
            var t = rc(ev.target);
            if (t) handlePlaceClick(t.r, t.c);
        };
        board.ondragstart = function (ev) {
            var t = rc(ev.target);
            if (!t || currentSeats[t.r][t.c] == null) { ev.preventDefault(); return; }
            dragSource = { kind: 'seat', num: currentSeats[t.r][t.c], r: t.r, c: t.c };
            if (ev.dataTransfer) {
                ev.dataTransfer.effectAllowed = 'move';
                ev.dataTransfer.setData('text/plain', String(dragSource.num));
            }
        };
        board.ondragend = function () {
            dragSource = null;
            if (hot) { hot.className = hot.className.replace(/ dropTarget/g, ''); hot = null; }
        };
        board.ondragover = function (ev) {
            var t = rc(ev.target);
            if (!t || !enabledSeats[t.r][t.c]) return;
            ev.preventDefault();
            if (hot !== t.el) {
                if (hot) hot.className = hot.className.replace(/ dropTarget/g, '');
                hot = t.el;
                hot.className += ' dropTarget';
            }
        };
        board.ondragleave = function (ev) {
            if (hot && !cellFrom(board, ev.relatedTarget)) {
                hot.className = hot.className.replace(/ dropTarget/g, '');
                hot = null;
            }
        };
        board.ondrop = function (ev) {
            ev.preventDefault();
            if (hot) { hot.className = hot.className.replace(/ dropTarget/g, ''); hot = null; }
            var t = rc(ev.target);
            if (!t || !dragSource || !enabledSeats[t.r][t.c]) return;
            if (dragSource.kind === 'bank') {
                currentSeats[t.r][t.c] = dragSource.num;
            } else {
                var prev = currentSeats[t.r][t.c];
                currentSeats[t.r][t.c] = dragSource.num;
                currentSeats[dragSource.r][dragSource.c] = prev;
            }
            dragSource = null;
            selectedBankNum = null; selectedSeatRC = null;
            render();
        };
    }

    function handlePlaceClick(r, c) {
        if (!enabledSeats[r][c]) return;
        if (selectedBankNum != null) {
            currentSeats[r][c] = selectedBankNum;
            selectedBankNum = null; selectedSeatRC = null;
            render(); return;
        }
        if (selectedSeatRC) {
            var sr = selectedSeatRC.r, sc = selectedSeatRC.c;
            if (sr === r && sc === c) { selectedSeatRC = null; render(); return; }
            var t = currentSeats[r][c];
            currentSeats[r][c] = currentSeats[sr][sc];
            currentSeats[sr][sc] = t;
            selectedSeatRC = null; render(); return;
        }
        if (currentSeats[r][c] != null) { selectedSeatRC = { r: r, c: c }; render(); }
    }

    // ====== ARRANGEMENT ======
    function doArrangement(fancy) {
        if (revealing) return;
        if (participants.length === 0) { alert('학생이 없습니다.'); return; }
        if (countEnabled() < participants.length) {
            alert('사용 가능한 자리가 인원수보다 적습니다.');
            return;
        }
        if (applyConditions) {
            var i, num, c, partner;
            for (i = 0; i < participants.length; i++) {
                num = participants[i];
                c = conditions[num];
                if (c && c.mustPairWith != null) {
                    partner = c.mustPairWith;
                    if (participants.indexOf(partner) < 0) { alert('조건에 오류 발생: 조건을 모두 완성할 수 없습니다'); return; }
                    if (conditions[partner] && conditions[partner].mustPairWith != null && conditions[partner].mustPairWith !== num) {
                        alert('조건에 오류 발생: 조건을 모두 완성할 수 없습니다'); return;
                    }
                    ensureCondition(partner).mustPairWith = num;
                }
            }
        }
        var attempts = 0, result = null;
        while (attempts < 14 && !result) { result = runBacktrackSolver(); attempts++; }
        if (!result) { alert('조건에 오류 발생: 조건을 모두 완성할 수 없습니다'); return; }
        newSeats = result;
        viewSelectedRC = null;
        if (fancy) startReveal();
        else { hasResult = true; render(); }
    }

    // ====== SHIFT REVEAL ======
    function startReveal() {
        hasResult = true;
        revealing = true;
        render();
        var board = document.getElementById('mainBoard');
        if (!board) { revealing = false; render(); return; }

        var targets = [], r, c, el;
        for (r = 0; r < rows; r++) for (c = 0; c < NC(); c++) {
            if (newSeats[r][c] == null) continue;
            el = board.querySelector('[data-r="' + r + '"][data-c="' + c + '"]');
            if (el) targets.push({ el: el, num: newSeats[r][c] });
        }
        if (targets.length === 0) { revealing = false; render(); return; }
        shuffle(targets);

        var fx = document.getElementById('fx');
        var flash = document.createElement('div');
        flash.className = 'flash';
        fx.appendChild(flash);
        setTimeout(function () { if (flash.parentNode) flash.parentNode.removeChild(flash); }, 600);
        var sweep = document.createElement('div');
        sweep.className = 'sweep';
        board.appendChild(sweep);
        setTimeout(function () { if (sweep.parentNode) sweep.parentNode.removeChild(sweep); }, 1150);

        var pool = [], pi;
        for (pi = 0; pi < participants.length; pi++) {
            var ps = students[participants[pi]] || {};
            pool.push(ps.name ? ps.name : (participants[pi] + '번'));
        }

        // Build both spans up front and only ever write text into them, so neither the
        // spin ticks nor the lock have to re-parse HTML.
        var t, numSpan, nameSpan;
        for (t = 0; t < targets.length; t++) {
            targets[t].el.className = 'seatCell spinning';
            targets[t].el.innerHTML = '';
            numSpan = document.createElement('span');
            numSpan.className = 'cellNum';
            numSpan.style.display = 'none';
            nameSpan = document.createElement('span');
            nameSpan.className = 'cellName';
            targets[t].numTn = document.createTextNode('');
            targets[t].tn = document.createTextNode('');
            numSpan.appendChild(targets[t].numTn);
            nameSpan.appendChild(targets[t].tn);
            targets[t].el.appendChild(numSpan);
            targets[t].el.appendChild(nameSpan);
            targets[t].numSpan = numSpan;
            targets[t].tn.data = pool[(Math.random() * pool.length) | 0];
        }
        // one layout pass for the whole board; the cells do not move during the reveal
        for (t = 0; t < targets.length; t++) targets[t].rect = targets[t].el.getBoundingClientRect();
        var live = targets.slice(0);
        var spinner = setInterval(function () {
            var k;
            for (k = 0; k < live.length; k++) live[k].tn.data = pool[(Math.random() * pool.length) | 0];
        }, 55);

        // Work out the whole schedule first so the roll knows how long it has to climb.
        var n = targets.length;
        var base = n > 22 ? 105 : (n > 12 ? 150 : 200);
        var at = 330, sched = [], i2, gap;
        for (i2 = 0; i2 < n; i2++) {
            sched.push(at);
            gap = Math.max(42, base * (0.28 + 1.9 * Math.pow((i2 + 1) / n, 2)));
            at += gap;
        }
        var delay = at;


        for (i2 = 0; i2 < n; i2++) {
            (function (item, when, idx, last) {
                revealTimers.push(setTimeout(function () {
                    item.done = true;
                    var li = live.indexOf(item);
                    if (li >= 0) live.splice(li, 1);
                    var st = students[item.num] || {};
                    var g = genderTag(st.gender || 'M');
                    var nm = st.name || '';
                    if (nm === '') {
                        item.numSpan.style.display = 'none';
                        item.tn.data = item.num + '번';
                    } else {
                        item.numTn.data = item.num;
                        item.numSpan.style.display = '';
                        item.tn.data = nm;
                    }
                    item.el.className = 'seatCell filled' + g + ' locked';
                    flareAt(item.el, item.rect);
                    sparkAt(item.el, g === 'F' ? '#f393bb' : '#8fbaff', last ? 10 : 2, item.rect);
                }, when));
            })(targets[i2], sched[i2], i2, i2 === n - 1);
        }
        revealTimers.push(setTimeout(function () {
            clearInterval(spinner);
            clearRevealTimers();
            revealing = false;
            render();
        }, delay + 620));
    }

    function spotlightCell(r, c) {

        if (!board) return;

        if (!el) return;
        el.className = el.className.replace(/ burst/g, '') + ' burst';
        var g = genderTag((students[newSeats[r][c]] || {}).gender || 'M');
        flareAt(el);
        sparkAt(el, g === 'F' ? '#f393bb' : '#8fbaff', 12);

    }

    // gold flare drawn over a seat that just locked (opacity/transform only)
    function flareAt(el, rect) {
        var box = rect || el.getBoundingClientRect();
        var d = document.createElement('div');
        d.className = 'flare';
        d.style.left = box.left + 'px';
        d.style.top = box.top + 'px';
        d.style.width = box.width + 'px';
        d.style.height = box.height + 'px';
        document.getElementById('fx').appendChild(d);
        setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 520);
    }

    function sparkAt(el, color, count, rect) {
        var box = rect || el.getBoundingClientRect();
        var cx = box.left + box.width / 2, cy = box.top + box.height / 2, i;
        for (i = 0; i < count; i++) {
            (function (idx) {
                var d = document.createElement('div');
                d.className = 'spark';
                d.style.background = color;
                d.style.boxShadow = '0 0 10px 2px ' + color;
                d.style.left = (cx - 4) + 'px';
                d.style.top = (cy - 4) + 'px';
                document.getElementById('fx').appendChild(d);
                var ang = (Math.PI * 2 * idx) / count + Math.random() * 0.6;
                var dist = 32 + Math.random() * 60;
                var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
                if (d.animate) {
                    var anim = d.animate([
                        { transform: 'translate(0,0) scale(1)', opacity: 1 },
                        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(0.2)', opacity: 0 }
                    ], { duration: 600 + Math.random() * 260, easing: 'cubic-bezier(.15,.8,.3,1)' });
                    anim.onfinish = function () { if (d.parentNode) d.parentNode.removeChild(d); };
                } else {
                    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 560);
                }
            })(i);
        }
    }

    // ====== SOLVER ======
    function runBacktrackSolver() {
        var order = buildPlacementOrder();
        var seats = emptyGrid(null);
        var stepsObj = { steps: 0, max: 200000 };
        var prev = collectPrevPairsAndSeats();
        var ok = backtrackPlace(order, 0, seats, stepsObj, prev);
        return ok ? seats : null;
    }
    function cond(num) {
        if (!applyConditions) return {};
        return conditions[num] || {};
    }
    function buildPlacementOrder() {
        var p = participants.slice(0);
        shuffle(p);
        var visited = {}, order = [], i, num, c;
        for (i = 0; i < p.length; i++) {
            num = p[i];
            if (visited[num]) continue;
            order.push(num); visited[num] = true;
            c = cond(num);
            if (c.mustPairWith != null && !visited[c.mustPairWith]) {
                order.push(c.mustPairWith);
                visited[c.mustPairWith] = true;
            }
        }
        return order;
    }
    function collectPrevPairsAndSeats() {
        var prevPairs = [], prevSeats = {}, r, c, mates, mi, a, b;
        for (r = 0; r < rows; r++) {
            for (c = 0; c < NC(); c++) {
                a = currentSeats[r][c];
                if (a == null) continue;
                if (!prevSeats[a]) prevSeats[a] = [];
                prevSeats[a].push({ r: r, c: c });
                mates = deskMates(r, c);
                for (mi = 0; mi < mates.length; mi++) {
                    if (mates[mi].c <= c) continue;          // count each pair once
                    b = currentSeats[mates[mi].r][mates[mi].c];
                    if (b != null) prevPairs.push([a < b ? a : b, a < b ? b : a]);
                }
            }
        }
        return { pairs: prevPairs, seats: prevSeats };
    }
    function backtrackPlace(order, idx, seats, stepsObj, prev) {
        stepsObj.steps++;
        if (stepsObj.steps > stepsObj.max) return false;
        if (idx >= order.length) return true;
        var num = order[idx];
        var cands = candidateSeatsFor(num, seats, prev);
        shuffle(cands);
        var i;
        for (i = 0; i < cands.length; i++) {
            var pos = cands[i];
            seats[pos.r][pos.c] = num;
            if (checkPlacementConstraints(num, pos, seats, prev)) {
                if (backtrackPlace(order, idx + 1, seats, stepsObj, prev)) return true;
            }
            seats[pos.r][pos.c] = null;
            if (stepsObj.steps > stepsObj.max) return false;
        }
        return false;
    }
    function candidateSeatsFor(num, seats, prev) {
        var c = cond(num);
        var locked = c.mustPairWith != null;
        var cands = [];
        var partnerPos = locked ? findStudentInGrid(seats, c.mustPairWith) : null;
        if (partnerPos) {
            var pm = deskMates(partnerPos.r, partnerPos.c), q;
            for (q = 0; q < pm.length; q++) {
                if (!enabledSeats[pm[q].r][pm[q].c]) continue;
                if (seats[pm[q].r][pm[q].c] != null) continue;
                if (!seatPassesPlacementFilters(num, pm[q], prev, true)) continue;
                cands.push(pm[q]);
            }
            return cands;
        }
        var r, cc;
        for (r = 0; r < rows; r++) {
            for (cc = 0; cc < NC(); cc++) {
                if (!enabledSeats[r][cc]) continue;
                if (seats[r][cc] != null) continue;
                if (!seatPassesPlacementFilters(num, { r: r, c: cc }, prev, locked)) continue;
                if (locked) {
                    var mm = deskMates(r, cc), free = false, z;
                    for (z = 0; z < mm.length; z++) {
                        if (enabledSeats[mm[z].r][mm[z].c] && seats[mm[z].r][mm[z].c] == null) { free = true; break; }
                    }
                    if (!free) continue;
                }
                cands.push({ r: r, c: cc });
            }

            }

            if (c2.mustPairWith != null && c2.mustPairWith !== num) {

            if (c2.mustPairWith == null && c2.pairGender) {

    // Cell metrics are shared by the DOM editor and the canvas exporter so what you
    // arrange on screen is exactly what lands in the PNG/JPG/PDF.
    var S_CELL_W = 78, S_CELL_H = 54, S_CELL_GAP = 7, S_DESK_GAP = 18, S_PAD = 14;
    var A4_LONG = 1000, A4_SHORT = 707;          // 1 : 1.414

    function applyPaper() {

    // Unrotated grid: cells laid out row by row, desks separated by a wider gap.
    function boardBaseCells() {
        var list = [], ro = displayRowOrder();
        var ri, r, di, si, desks, dk, x, y, maxW = 0, deskW, cw, c;
        var src = hasResult ? newSeats : currentSeats;
        for (ri = 0; ri < ro.length; ri++) {
            r = ro[ri];
            desks = rowDesks(r);
            y = S_PAD + ri * (S_CELL_H + S_CELL_GAP);
            x = S_PAD;
            for (di = 0; di < desks.length; di++) {
                dk = desks[di];
                // a desk is always two seats wide, however many people sit at it
                deskW = 2 * S_CELL_W + S_CELL_GAP;
                if (dk.seats.length === 1) deskW = S_CELL_W;
                cw = (deskW - (dk.seats.length - 1) * S_CELL_GAP) / dk.seats.length;
                for (si = 0; si < dk.seats.length; si++) {
                    c = dk.seats[si];
                    list.push({
                        x: x, y: y, w: cw, h: S_CELL_H,
                        on: !!(enabledSeats[r] && enabledSeats[r][c]),
                        num: src[r] ? src[r][c] : null
                    });
                    x += cw;
                    if (si < dk.seats.length - 1) x += S_CELL_GAP;
                }
                if (di < desks.length - 1) x += S_DESK_GAP;
            }
            if (x + S_PAD > maxW) maxW = x + S_PAD;

            w: maxW,
            h: rows * S_CELL_H + (rows - 1) * S_CELL_GAP + S_PAD * 2

            else if (deg === 180) { nx = b.w - e.x - e.w; ny = b.h - e.y - e.h;  nw = e.w; nh = e.h; }
            else                  { nx = e.y;             ny = b.w - e.x - e.w;  nw = e.h; nh = e.w; }
            out.push({ x: nx, y: ny, w: nw, h: nh, on: e.on, num: e.num });

        if (!page) return;
        var els = page.querySelectorAll('[data-el]'), i, el, id, on, cn;
        for (i = 0; i < els.length; i++) {
            el = els[i];
            id = el.getAttribute('data-el');
            on = !!(selEl && selEl.id === id);
            cn = el.className.replace(/ ?selEl/g, '');
            el.className = on ? cn + ' selEl' : cn;
        }
    }
    function fitSheet() {
        var outer = document.getElementById('sheetOuter');
        var page = document.getElementById('sheetPage');
        if (!outer || !page) return;
        var sc = outer.clientWidth / SHEET_W;
        page.style.transform = 'scale(' + sc + ')';
        outer.style.height = Math.round(SHEET_H * sc) + 'px';
    }
    function bindSheetDrag() {
        var page = document.getElementById('sheetPage');
        if (!page) return;
        fitSheet();
        function scaleOf() { return page.getBoundingClientRect().width / SHEET_W; }
        page.onmousedown = function (ev) {
            var node = ev.target, id = null;
            while (node && node !== page) {
                if (node.getAttribute && node.getAttribute('data-el')) { id = node.getAttribute('data-el'); break; }
                node = node.parentNode;
            }
            if (editingEl) {
                // clicks inside the editor just move the caret
                if (id === editingEl.id) return;
                // anything else ends the edit first
                ev.preventDefault();
                commitInlineEdit();
                return;
            }
            if (printTool === 'text') {
                ev.preventDefault();
                var box = page.getBoundingClientRect(), sc = scaleOf();
                var nx = Math.round((ev.clientX - box.left) / sc);
                var ny = Math.round((ev.clientY - box.top) / sc);
                var el = { id: 'u' + Date.now(), kind: 'text', x: nx, y: ny, text: '', size: 18 };
                sheet.els.push(el);
                printTool = 'move';
                startInlineEdit(el);
                return;
            }
            if (!id) { selEl = null; lastDown = null; render(); return; }
            var e = elById(id);
            if (!e) return;
            ev.preventDefault();
            // our own double-click detection: the first click re-renders the sheet, which
            // would swallow a native dblclick
            var now = Date.now();
            if (e.kind === 'text' && !e.locked && lastDown && lastDown.id === id && now - lastDown.t < 450) {
                lastDown = null;
                startInlineEdit(e);
                return;
            }
            lastDown = { id: id, t: now };
            var reselect = (selEl !== e);
            selEl = e;
            markSelection();
            sheetDrag = { e: e, sx: ev.clientX, sy: ev.clientY, ox: e.x, oy: e.y,
                          sc: scaleOf(), node: document.querySelector('[data-el="' + id + '"]'),
                          moved: false, reselect: reselect };
        };
    }
    function startInlineEdit(e) {
        editingEl = e;

        editCancel = false;
        selEl = e;
        sheetDrag = null;
        render();
        var node = document.querySelector('[data-el="' + e.id + '"]');
        if (!node) { editingEl = null; return; }
        node.oninput = function () { e.text = node.textContent; };
        node.onkeydown = function (ev) {
            if (ev.key === 'Enter') { ev.preventDefault(); node.blur(); }
            else if (ev.key === 'Escape') { ev.preventDefault(); editCancel = true; node.blur(); }
        };
        node.onpaste = function (ev) {
            // keep it plain text: no pasted fonts, colours or line breaks
            var t = (ev.clipboardData || window.clipboardData).getData('text') || '';
            ev.preventDefault();
            t = t.replace(/[\r\n]+/g, ' ');
            if (document.queryCommandSupported && document.queryCommandSupported('insertText')) {
                document.execCommand('insertText', false, t);
            } else {
                node.textContent += t;

            e.text = node.textContent;

        node.onblur = function () { commitInlineEdit(true); };
        node.focus();
        var sel = window.getSelection(), range = document.createRange();
        range.selectNodeContents(node);

    // defer: when focus left because something else was clicked, let that click land
    // on its button before the panel is rebuilt
    function commitInlineEdit(defer) {
        var e = editingEl;
        if (!e) return;
        editingEl = null;
        if (editCancel) e.text = editOrig;
        e.text = trim(String(e.text || '').replace(/\s+/g, ' ')).substring(0, 80);
        if (!e.text) {
            // emptied out means delete
            var i;
            for (i = 0; i < sheet.els.length; i++) if (sheet.els[i] === e) { sheet.els.splice(i, 1); break; }
            if (selEl === e) selEl = null;
        }
        if (defer) setTimeout(render, 0); else render();
    }
    document.addEventListener('mousemove', function (ev) {
        if (!sheetDrag) return;
        var dx = (ev.clientX - sheetDrag.sx) / sheetDrag.sc;
        var dy = (ev.clientY - sheetDrag.sy) / sheetDrag.sc;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) sheetDrag.moved = true;
        sheetDrag.e.x = Math.round(sheetDrag.ox + dx);
        sheetDrag.e.y = Math.round(sheetDrag.oy + dy);
        if (sheetDrag.node) {
            sheetDrag.node.style.left = sheetDrag.e.x + 'px';
            sheetDrag.node.style.top = sheetDrag.e.y + 'px';
        }
    });
    document.addEventListener('mouseup', function () {
        if (!sheetDrag) return;
        var need = sheetDrag.moved || sheetDrag.reselect;
        sheetDrag = null;
        if (need) render();
