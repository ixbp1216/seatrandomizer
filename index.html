    function renderBankHtml() {
        var placed = {}, r, c, i, num, html = '', any = false;
        for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) {
            if (currentSeats[r][c] != null) placed[currentSeats[r][c]] = true;
        }
        for (i = 0; i < participants.length; i++) {
            num = participants[i];
            if (placed[num]) continue;
            any = true;
            html += '<button class="bankSlot' + ((students[num] || {}).gender === 'F' ? ' femaleSlot' : '') +
                (selectedBankNum === num ? ' selected' : '') + '" data-bn="' + num + '" draggable="true">' +
                escapeHtml(getStudentShort(num)) + '</button>';
        }
        if (!any) html = '<div class="bankEmpty">모든 학생이 배치되었습니다.</div>';
        return html;
    }

    function attachBankInteractions() {
        var slots = document.querySelectorAll('[data-bn]'), i;
        for (i = 0; i < slots.length; i++) {
            (function (el) {
                var num = parseInt(el.getAttribute('data-bn'), 10);
                el.onclick = function () {
                    selectedSeatRC = null;
                    selectedBankNum = (selectedBankNum === num) ? null : num;
                    render();
                };
                el.ondragstart = function (ev) {
                    dragSource = { kind: 'bank', num: num };
                    if (ev.dataTransfer) { ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', String(num)); }
                };
                el.ondragend = function () { dragSource = null; };
            })(slots[i]);
        }
        var bank = document.getElementById('bank');
        if (!bank) return;
        bank.ondragover = function (ev) { ev.preventDefault(); };
        bank.ondrop = function (ev) {
            ev.preventDefault();
            if (dragSource && dragSource.kind === 'seat') {
                currentSeats[dragSource.r][dragSource.c] = null;
                dragSource = null;
                render();
            }
        };
    }

    function attachPlaceInteractions() {
        var board = document.getElementById('mainBoard');
        if (!board) return;
        var cells = board.getElementsByTagName('button'), i;
        for (i = 0; i < cells.length; i++) {
            (function (el) {
                var r = parseInt(el.getAttribute('data-r'), 10);
                var c = parseInt(el.getAttribute('data-c'), 10);
                el.onclick = function () { handlePlaceClick(r, c); };
                el.ondragstart = function (ev) {
                    if (currentSeats[r][c] == null) { ev.preventDefault(); return; }
                    dragSource = { kind: 'seat', num: currentSeats[r][c], r: r, c: c };
                    if (ev.dataTransfer) { ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', String(currentSeats[r][c])); }
                };
                el.ondragend = function () { dragSource = null; };
                el.ondragover = function (ev) { if (enabledSeats[r][c]) { ev.preventDefault(); el.className += ' dropTarget'; } };
                el.ondragleave = function () { el.className = el.className.replace(/ dropTarget/g, ''); };
                el.ondrop = function (ev) {
                    ev.preventDefault();
                    el.className = el.className.replace(/ dropTarget/g, '');
                    if (!dragSource || !enabledSeats[r][c]) return;
                    if (dragSource.kind === 'bank') {
                        currentSeats[r][c] = dragSource.num;
                    } else {
                        var t = currentSeats[r][c];
                        currentSeats[r][c] = dragSource.num;
                        currentSeats[dragSource.r][dragSource.c] = t;
                    }
                    dragSource = null;
                    selectedBankNum = null; selectedSeatRC = null;
                    render();
                };
            })(cells[i]);
        }
    }

    function handlePlaceClick(r, c) {
        if (!enabledSeats[r][c]) return;
        if (selectedBankNum != null) {
            currentSeats[r][c] = selectedBankNum;
            selectedBankNum = null; selectedSeatRC = null;
            render(); return;
        }
        if (selectedSeatRC) {
            var sr = selectedSeatRC.r, sc = selectedSeatRC.c;
            if (sr === r && sc === c) { selectedSeatRC = null; render(); return; }
            var t = currentSeats[r][c];
            currentSeats[r][c] = currentSeats[sr][sc];
            currentSeats[sr][sc] = t;
            selectedSeatRC = null; render(); return;
        }
        if (currentSeats[r][c] != null) { selectedSeatRC = { r: r, c: c }; render(); }
    }

    // ====== VIEW: 자리 배치 > 랜덤 배치 ======
    function renderRandom(app) {
        var html = '';
        html += '<div class="panel">';
        html += '<div class="title">랜덤 배치</div>';
        html += boardWithChalk('mainBoard', { mode: 'view', useCurrent: !hasResult }, true);
        html += '<div style="text-align:center;margin-top:14px;">';
        html += '<label class="checkline"><input type="checkbox" id="optPair"' + (randomOptions.noSamePair ? ' checked' : '') + '>같은 짝 다시 반복 금지</label>';
        html += '<label class="checkline"><input type="checkbox" id="optSeat"' + (randomOptions.noSameSeat ? ' checked' : '') + '>했던 자리 다시 앉지 않기</label>';
        html += '</div>';
        html += '<div class="controls">';
        if (hasResult) {
            html += '<button id="backEditBtn" class="btn">되돌리기</button>';
            html += '<button id="applySeatBtn" class="btn green">현재 자리로 적용</button>';
        }
        html += '<button id="goBtn" class="btn primary">자리 배치</button>';
        html += '</div>';
        html += '<div class="controls" style="margin-top:4px;">';
        html += '<button id="saveBtn" class="btn sm">저장</button>';
        html += '<input id="loadFileR" class="fileinput" type="file" accept=".txt">';
        html += '<button id="loadBtn2" class="btn sm">불러오기</button>';
        html += '</div>';
        html += '<div class="hintline" style="margin:14px 0 0;">Shift+배치로 추첨 연출' +
            (condOnCtrl ? ' · Ctrl+배치로 조건 적용' : '') + '</div>';
        html += '</div>';
        app.innerHTML = html;

        attachFlip();
        document.getElementById('optPair').onchange = function () { randomOptions.noSamePair = this.checked; };
        document.getElementById('optSeat').onchange = function () { randomOptions.noSameSeat = this.checked; };
        document.getElementById('saveBtn').onclick = saveToFile;
        document.getElementById('loadBtn2').onclick = function () { openLoadDialog('loadFileR'); };
        document.getElementById('loadFileR').onchange = function () { loadFromSelectedFile('loadFileR', false); };
        document.getElementById('goBtn').onclick = function (ev) {
            applyConditions = condOnCtrl ? !!(ev.ctrlKey || ev.metaKey) : true;
            doArrangement(!!ev.shiftKey);
        };
        if (hasResult) {
            document.getElementById('backEditBtn').onclick = function () {
                hasResult = false; viewSelectedRC = null; render();
            };
            document.getElementById('applySeatBtn').onclick = function () {
                var r, c;
                for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) currentSeats[r][c] = newSeats[r][c];
                hasResult = false; viewSelectedRC = null; render();
            };
            attachBoardClicks('mainBoard', function (r, c, ev) {
                if (revealing) return;
                if (!enabledSeats[r][c] || newSeats[r][c] == null) { viewSelectedRC = null; render(); return; }
                if (ev && ev.shiftKey) { spotlightCell(r, c); return; }
                if (!viewSelectedRC) viewSelectedRC = { r: r, c: c };
                else if (viewSelectedRC.r === r && viewSelectedRC.c === c) viewSelectedRC = null;
                else {
                    var sr = viewSelectedRC.r, sc = viewSelectedRC.c;
                    var t = newSeats[r][c];
                    newSeats[r][c] = newSeats[sr][sc];
                    newSeats[sr][sc] = t;
                    viewSelectedRC = null;
                }
                render();
            });
        }
    }

    // ====== ARRANGEMENT ======
    function doArrangement(fancy) {
        if (revealing) return;
        if (participants.length === 0) { alert('학생이 없습니다.'); return; }
        if (countEnabled() < participants.length) {
            alert('사용 가능한 자리가 인원수보다 적습니다.');
            return;
        }
        if (applyConditions) {
            var i, num, c, partner;
            for (i = 0; i < participants.length; i++) {
                num = participants[i];
                c = conditions[num];
                if (c && c.mustPairWith != null) {
                    partner = c.mustPairWith;
                    if (participants.indexOf(partner) < 0) { alert('조건에 오류 발생: 조건을 모두 완성할 수 없습니다'); return; }
                    if (conditions[partner] && conditions[partner].mustPairWith != null && conditions[partner].mustPairWith !== num) {
                        alert('조건에 오류 발생: 조건을 모두 완성할 수 없습니다'); return;
                    }
                    ensureCondition(partner).mustPairWith = num;
                }
            }
        }
        var attempts = 0, result = null;
        while (attempts < 14 && !result) { result = runBacktrackSolver(); attempts++; }
        if (!result) { alert('조건에 오류 발생: 조건을 모두 완성할 수 없습니다'); return; }
        newSeats = result;
        viewSelectedRC = null;
        if (fancy) startReveal();
        else { hasResult = true; render(); }
    }

    // ====== SHIFT REVEAL ======
    function startReveal() {
        hasResult = true;
        revealing = true;
        render();
        var board = document.getElementById('mainBoard');
        if (!board) { revealing = false; render(); return; }

        var targets = [], r, c, el;
        for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) {
            if (newSeats[r][c] == null) continue;
            el = board.querySelector('[data-r="' + r + '"][data-c="' + c + '"]');
            if (el) targets.push({ el: el, num: newSeats[r][c] });
        }
        if (targets.length === 0) { revealing = false; render(); return; }
        shuffle(targets);

        var fx = document.getElementById('fx');
        var flash = document.createElement('div');
        flash.className = 'flash';
        fx.appendChild(flash);
        setTimeout(function () { if (flash.parentNode) flash.parentNode.removeChild(flash); }, 600);
        var sweep = document.createElement('div');
        sweep.className = 'sweep';
        board.appendChild(sweep);
        setTimeout(function () { if (sweep.parentNode) sweep.parentNode.removeChild(sweep); }, 1150);

        var pool = participants.slice(0), t;
        for (t = 0; t < targets.length; t++) {
            targets[t].el.className = 'seatCell spinning';
            targets[t].el.innerHTML = '<span class="cellName">' + escapeHtml(randPoolName(pool)) + '</span>';
        }
        var spinner = setInterval(function () {
            var k;
            for (k = 0; k < targets.length; k++) {
                if (targets[k].done) continue;
                targets[k].el.innerHTML = '<span class="cellName">' + escapeHtml(randPoolName(pool)) + '</span>';
            }
        }, 62);

        // Tension comes from pacing, not effects: each reveal waits longer than the last,
        // and the final seat is held back while its name keeps flickering.
        var base = targets.length > 22 ? 70 : (targets.length > 12 ? 100 : 145);
        var delay = 620, i2, gap;
        for (i2 = 0; i2 < targets.length; i2++) {
            if (i2 === targets.length - 1) delay += 620;
            (function (item, at) {
                revealTimers.push(setTimeout(function () {
                    item.done = true;
                    var g = genderTag((students[item.num] || {}).gender || 'M');
                    item.el.className = 'seatCell filled' + g + ' locked';
                    item.el.innerHTML = twoLineLabel(item.num);
                    sparkAt(item.el, g === 'F' ? '#f393bb' : '#8fbaff', 5);
                }, at));
            })(targets[i2], delay);
            gap = base * (1 + 2.6 * (i2 + 1) / targets.length);
            delay += gap;
        }
        revealTimers.push(setTimeout(function () {
            clearInterval(spinner);
            clearRevealTimers();
            revealing = false;
            render();
        }, delay + 620));
    }

    function randPoolName(pool) {
        var n = pool[Math.floor(Math.random() * pool.length)];
        var s = students[n] || {};
        return s.name ? s.name : (n + '번');
    }

    function spotlightCell(r, c) {
        var board = document.getElementById('mainBoard');
        if (!board) return;
        var el = board.querySelector('[data-r="' + r + '"][data-c="' + c + '"]');
        if (!el) return;
        el.className = el.className.replace(/ burst/g, '') + ' burst';
        var g = genderTag((students[newSeats[r][c]] || {}).gender || 'M');
        sparkAt(el, g === 'F' ? '#f393bb' : '#8fbaff', 14);
        setTimeout(function () { el.className = el.className.replace(/ burst/g, ''); }, 640);
    }

    function sparkAt(el, color, count) {
        var box = el.getBoundingClientRect();
        var cx = box.left + box.width / 2, cy = box.top + box.height / 2, i;
        for (i = 0; i < count; i++) {
            (function (idx) {
                var d = document.createElement('div');
                d.className = 'spark';
                d.style.background = color;
                d.style.boxShadow = '0 0 10px 2px ' + color;
                d.style.left = (cx - 4) + 'px';
                d.style.top = (cy - 4) + 'px';
                document.getElementById('fx').appendChild(d);
                var ang = (Math.PI * 2 * idx) / count + Math.random() * 0.6;
                var dist = 32 + Math.random() * 60;
                var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
                if (d.animate) {
                    var anim = d.animate([
                        { transform: 'translate(0,0) scale(1)', opacity: 1 },
                        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(0.2)', opacity: 0 }
                    ], { duration: 600 + Math.random() * 260, easing: 'cubic-bezier(.15,.8,.3,1)' });
                    anim.onfinish = function () { if (d.parentNode) d.parentNode.removeChild(d); };
                } else {
                    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 560);
                }
            })(i);
        }
    }

    // ====== SOLVER ======
    function runBacktrackSolver() {
        var order = buildPlacementOrder();
        var seats = emptyGrid(null);
        var stepsObj = { steps: 0, max: 200000 };
        var prev = collectPrevPairsAndSeats();
        var ok = backtrackPlace(order, 0, seats, stepsObj, prev);
        return ok ? seats : null;
    }
    function cond(num) {
        if (!applyConditions) return {};
        return conditions[num] || {};
    }
    function buildPlacementOrder() {
        var p = participants.slice(0);
        shuffle(p);
        var visited = {}, order = [], i, num, c;
        for (i = 0; i < p.length; i++) {
            num = p[i];
            if (visited[num]) continue;
            order.push(num); visited[num] = true;
            c = cond(num);
            if (c.mustPairWith != null && !visited[c.mustPairWith]) {
                order.push(c.mustPairWith);
                visited[c.mustPairWith] = true;
            }
        }
        return order;
    }
    function collectPrevPairsAndSeats() {
        var prevPairs = [], prevSeats = {}, r, c, mate, a, b;
        for (r = 0; r < rows; r++) {
            for (c = 0; c < cols; c++) {
                a = currentSeats[r][c];
                if (a == null) continue;
                if (!prevSeats[a]) prevSeats[a] = [];
                prevSeats[a].push({ r: r, c: c });
                mate = getMate(r, c);
                if (mate && mate.c > c) {
                    b = currentSeats[mate.r][mate.c];
                    if (b != null) {
                        prevPairs.push([a < b ? a : b, a < b ? b : a]);
                    }
                }
            }
        }
        return { pairs: prevPairs, seats: prevSeats };
    }
    function backtrackPlace(order, idx, seats, stepsObj, prev) {
        stepsObj.steps++;
        if (stepsObj.steps > stepsObj.max) return false;
        if (idx >= order.length) return true;
        var num = order[idx];
        var cands = candidateSeatsFor(num, seats, prev);
        shuffle(cands);
        var i;
        for (i = 0; i < cands.length; i++) {
            var pos = cands[i];
            seats[pos.r][pos.c] = num;
            if (checkPlacementConstraints(num, pos, seats, prev)) {
                if (backtrackPlace(order, idx + 1, seats, stepsObj, prev)) return true;
            }
            seats[pos.r][pos.c] = null;
            if (stepsObj.steps > stepsObj.max) return false;
        }
        return false;
    }
    function candidateSeatsFor(num, seats, prev) {
        var c = cond(num);
        var locked = c.mustPairWith != null;
        var cands = [];
        var partnerPos = locked ? findStudentInGrid(seats, c.mustPairWith) : null;
        if (partnerPos) {
            var mate = getMate(partnerPos.r, partnerPos.c);
            if (!mate) return cands;
            if (!enabledSeats[mate.r][mate.c]) return cands;
            if (seats[mate.r][mate.c] != null) return cands;
            if (!seatPassesPlacementFilters(num, mate, prev, true)) return cands;
            cands.push(mate);
            return cands;
        }
        var r, cc;
        for (r = 0; r < rows; r++) {
            for (cc = 0; cc < cols; cc++) {
                if (!enabledSeats[r][cc]) continue;
                if (seats[r][cc] != null) continue;
                if (!seatPassesPlacementFilters(num, { r: r, c: cc }, prev, locked)) continue;
                if (locked) {
                    var m = getMate(r, cc);
                    if (!m) continue;
                    if (!enabledSeats[m.r][m.c]) continue;
                    if (seats[m.r][m.c] != null) continue;
                }
                cands.push({ r: r, c: cc });
            }
        }
        return cands;
    }
    function seatPassesPlacementFilters(num, pos, prev, ignoreAllowed) {
        var c = cond(num);
        if (!ignoreAllowed && c.allowedSeats && c.allowedSeats.length > 0 && c.mustPairWith == null) {
            var ok = false, k;
            for (k = 0; k < c.allowedSeats.length; k++) {
                if (c.allowedSeats[k].r === pos.r && c.allowedSeats[k].c === pos.c) { ok = true; break; }
            }
            if (!ok) return false;
        }
        if (randomOptions.noSameSeat && prev.seats[num]) {
            var i;
            for (i = 0; i < prev.seats[num].length; i++) {
                if (prev.seats[num][i].r === pos.r && prev.seats[num][i].c === pos.c) return false;
            }
        }
        return true;
    }
    function checkPlacementConstraints(num, pos, seats, prev) {
        var mate = getMate(pos.r, pos.c);
        if (!mate) return true;
        if (!enabledSeats[mate.r][mate.c]) return true;
        var partner = seats[mate.r][mate.c];
        if (partner == null) return true;
        var c1 = cond(num), c2 = cond(partner);
        if (c1.mustPairWith != null && c1.mustPairWith !== partner) return false;
        if (c2.mustPairWith != null && c2.mustPairWith !== num) return false;
        if (c1.mustPairWith == null && c1.pairGender) {
            var pg = students[partner] ? students[partner].gender : 'M';
            if (pg !== c1.pairGender) return false;
        }
        if (c2.mustPairWith == null && c2.pairGender) {
            var ng = students[num] ? students[num].gender : 'M';
            if (ng !== c2.pairGender) return false;
        }
        if (randomOptions.noSamePair) {
            var lo = num < partner ? num : partner;
            var hi = num < partner ? partner : num;
            var i;
            for (i = 0; i < prev.pairs.length; i++) {
                if (prev.pairs[i][0] === lo && prev.pairs[i][1] === hi) return false;
            }
        }
        return true;
    }
    function findStudentInGrid(grid, num) {
        var r, c;
        for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) if (grid[r][c] === num) return { r: r, c: c };
        return null;
    }

    // ====== SAVE / LOAD ======
    function openLoadDialog(inputId) {
        var fi = document.getElementById(inputId);
        if (!fi) return;
        fi.value = '';
        fi.click();
    }
    function saveToFile() {
        var lines = [], i, r, c, num, s, content, blob, url, a, k, p;
        for (i = 0; i < 100; i++) lines.push('.');
        lines.push('META;ROWS;' + rows);
        lines.push('META;COLS;' + cols);
        lines.push('META;COUNT;' + studentCount);
        lines.push('META;ABSENT;"' + getAbsentText() + '"');
        var disabledList = [];
        for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) if (!enabledSeats[r][c]) disabledList.push(r + ',' + c);
        lines.push('META;DISABLED;"' + disabledList.join(';') + '"');
        for (i = 0; i < participants.length; i++) {
            num = participants[i];
            s = students[num] || { name: '', gender: 'M' };
            lines.push('S;' + num + ';"' + escapeTextName(s.name || '') + '";' + (s.gender || 'M'));
        }
        var out = hasResult ? newSeats : currentSeats;
        for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) {
            if (out[r] && out[r][c] != null) lines.push('P;' + r + ';' + c + ';' + out[r][c]);
        }
        for (i = 0; i < participants.length; i++) {
            num = participants[i];
            var cd = conditions[num];
            if (!cd) continue;
            if (cd.mustPairWith != null) lines.push('CF;' + num + ';' + cd.mustPairWith);
            if (cd.pairGender) lines.push('CG;' + num + ';' + cd.pairGender);
            if (cd.allowedSeats && cd.allowedSeats.length > 0) {
                var arr = [];
                for (k = 0; k < cd.allowedSeats.length; k++) {
                    p = cd.allowedSeats[k];
                    arr.push(p.r + ',' + p.c);
                }
                lines.push('CS;' + num + ';"' + arr.join(';') + '"');
            }
        }
        content = lines.join('\r\n');
        if (window.Blob) {
            blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            if (window.navigator && window.navigator.msSaveBlob) { window.navigator.msSaveBlob(blob, 'seat_save.txt'); return; }
            if (window.URL && window.URL.createObjectURL) {
                url = window.URL.createObjectURL(blob);
                a = document.createElement('a');
                a.href = url; a.download = 'seat_save.txt';
                document.body.appendChild(a);
                if (a.click) a.click(); else window.location.href = url;
                setTimeout(function () {
                    if (a.parentNode) a.parentNode.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 100);
                return;
            }
        }
        alert('이 브라우저에서는 저장 기능을 지원하지 않습니다.');
    }

    function loadFromSelectedFile(inputId, studentsOnly) {
        var fi = document.getElementById(inputId), file, reader;
        if (!fi || !fi.files || !fi.files[0]) { alert('불러올 txt 파일을 먼저 선택해 주세요.'); return; }
        file = fi.files[0];
        if (!window.FileReader) { alert('이 브라우저에서는 불러오기 기능을 지원하지 않습니다.'); return; }
        reader = new FileReader();
        reader.onload = function (e) {
            var text = e && e.target ? e.target.result : reader.result;
            if (parseLoadedText(text, studentsOnly)) {
                condEditNum = null; checkedRows = {};
                viewSelectedRC = null; selectedBankNum = null; selectedSeatRC = null;
                if (studentsOnly) { view = 'students.list'; }
                else { view = 'seats.random'; hasResult = true; }
                render();
            }
        };
        reader.onerror = function () { alert('파일을 읽지 못했습니다.'); };
        reader.readAsText(file, 'utf-8');
    }

    function parseLoadedText(text, studentsOnly) {
        var normalized = String(text).replace(/\r/g, '');
        var lines = normalized.split('\n');
        var metaRows = null, metaCols = null, metaCount = null, metaAbsent = null, metaDisabled = null;
        var loadedStudents = {}, placements = [], condF = {}, condG = {}, condS = {};
        var i, line, m, num, parsedAbs, parts, k, rr, cc;

        for (i = 0; i < lines.length; i++) {
            line = trim(lines[i]);
            if (line === '' || line === '.') continue;
            m = line.match(/^META\s*;\s*ROWS\s*;\s*(\d+)\s*$/i); if (m) { metaRows = parseInt(m[1], 10); continue; }
            m = line.match(/^META\s*;\s*COLS\s*;\s*(\d+)\s*$/i); if (m) { metaCols = parseInt(m[1], 10); continue; }
            m = line.match(/^META\s*;\s*COUNT\s*;\s*(\d+)\s*$/i); if (m) { metaCount = parseInt(m[1], 10); continue; }
            m = line.match(/^META\s*;\s*ABSENT\s*;\s*"([^"]*)"\s*$/i); if (m) { metaAbsent = m[1]; continue; }
            m = line.match(/^META\s*;\s*DISABLED\s*;\s*"([^"]*)"\s*$/i); if (m) { metaDisabled = m[1]; continue; }
            m = line.match(/^S\s*;\s*(\d+)\s*;\s*"((?:[^"]|"")*)"\s*;\s*([MFN])\s*$/i);
            if (m) {
                num = parseInt(m[1], 10);
                loadedStudents[num] = { name: m[2].replace(/""/g, '"'), gender: m[3].toUpperCase() };
                continue;
            }
            m = line.match(/^P\s*;\s*(\d+)\s*;\s*(\d+)\s*;\s*(\d+)\s*$/i);
            if (m) { placements.push({ r: parseInt(m[1], 10), c: parseInt(m[2], 10), num: parseInt(m[3], 10) }); continue; }
            m = line.match(/^CF\s*;\s*(\d+)\s*;\s*(\d+)\s*$/i);
            if (m) { condF[parseInt(m[1], 10)] = parseInt(m[2], 10); continue; }
            m = line.match(/^CG\s*;\s*(\d+)\s*;\s*([MF])\s*$/i);
            if (m) { condG[parseInt(m[1], 10)] = m[2].toUpperCase(); continue; }
            m = line.match(/^CS\s*;\s*(\d+)\s*;\s*"([^"]*)"\s*$/i);
            if (m) {
                var arr = [], items = m[2].split(';');
                for (k = 0; k < items.length; k++) {
                    if (items[k] === '') continue;
                    var pp = items[k].split(',');
                    if (pp.length === 2) arr.push({ r: parseInt(pp[0], 10), c: parseInt(pp[1], 10) });
                }
                condS[parseInt(m[1], 10)] = arr;
                continue;
            }
        }
        if (metaCount == null || (!studentsOnly && (metaRows == null || metaCols == null))) {
            alert('저장 파일에서 기본 정보를 확인할 수 없습니다.'); return false;
        }
        if (metaCount < 1 || (!studentsOnly && (metaRows < 1 || metaCols < 1))) {
            alert('저장 파일의 값이 올바르지 않습니다.'); return false;
        }
        parsedAbs = parseAbsentList(metaAbsent || '', metaCount);
        if (parsedAbs === null) { alert('저장 파일의 결번 정보가 올바르지 않습니다.'); return false; }

        if (!studentsOnly) {
            rows = metaRows; cols = metaCols;
        }
        studentCount = metaCount;
        absentNumbers = parsedAbs;
        buildParticipants();
        if (participants.length < 1) { alert('저장 파일의 참여 인원이 부족합니다.'); return false; }

        if (!studentsOnly) {
            enabledSeats = emptyGrid(true);
            if (metaDisabled) {
                parts = metaDisabled.split(';');
                for (k = 0; k < parts.length; k++) {
                    if (parts[k] === '') continue;
                    var dpp = parts[k].split(',');
                    if (dpp.length === 2) {
                        rr = parseInt(dpp[0], 10); cc = parseInt(dpp[1], 10);
                        if (rr >= 0 && rr < rows && cc >= 0 && cc < cols) enabledSeats[rr][cc] = false;
                    }
                }
            }
        }

        students = {};
        for (i = 0; i < participants.length; i++) {
            num = participants[i];
            var ls = loadedStudents[num];
            students[num] = ls
                ? { name: ls.name || '', gender: ls.gender === 'F' ? 'F' : 'M' }
                : { name: '', gender: 'M' };
        }

        if (!studentsOnly) {
            currentSeats = emptyGrid(null);
            newSeats = emptyGrid(null);
            for (i = 0; i < placements.length; i++) {
                var p2 = placements[i];
                if (p2.r < 0 || p2.r >= rows || p2.c < 0 || p2.c >= cols) continue;
                if (!enabledSeats[p2.r][p2.c]) continue;
                if (participants.indexOf(p2.num) < 0) continue;
                newSeats[p2.r][p2.c] = p2.num;
                currentSeats[p2.r][p2.c] = p2.num;
            }
        } else {
            // keep grid, just drop anyone no longer on the roster
            for (rr = 0; rr < rows; rr++) for (cc = 0; cc < cols; cc++) {
                if (currentSeats[rr][cc] != null && participants.indexOf(currentSeats[rr][cc]) < 0) currentSeats[rr][cc] = null;
                if (newSeats[rr][cc] != null && participants.indexOf(newSeats[rr][cc]) < 0) newSeats[rr][cc] = null;
            }
        }

        conditions = {};
        for (i = 0; i < participants.length; i++) {
            num = participants[i];
            conditions[num] = {
                mustPairWith: condF[num] != null ? condF[num] : null,
                pairGender: condG[num] || '',
                allowedSeats: condS[num] || []
            };
        }
        sanitizeConditionsAgainstGrid();
        return true;
    }

    // ====== INIT ======
    function setDefaults() {
        rows = 5; cols = 6;
        studentCount = 30;
        absentNumbers = [];
        students = {};
        conditions = {};
        buildParticipants();
        enabledSeats = emptyGrid(true);
        currentSeats = emptyGrid(null);
        newSeats = emptyGrid(null);
        var i, num;
        for (i = 0; i < participants.length; i++) {
            num = participants[i];
            students[num] = { name: '', gender: 'M' };
        }
        hasResult = false;
    }

    setDefaults();
    render();
})();
</script>
