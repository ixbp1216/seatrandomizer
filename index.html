<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자리 바꾸기</title>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: #e9edf3;
    background-color: #14171c;
    background-image:
        radial-gradient(1000px 720px at 8% -12%, rgba(96,126,178,0.20), transparent 62%),
        radial-gradient(880px 640px at 104% 112%, rgba(72,94,138,0.18), transparent 62%),
        linear-gradient(158deg, #171a20 0%, #1c2027 48%, #13161b 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

/* ============ SHELL + SIDEBAR ============ */
.shell { display: flex; min-height: 100vh; align-items: stretch; }
.sidebar {
    position: sticky;
    top: 0;
    align-self: flex-start;
    flex: 0 0 220px;
    width: 220px;
    height: 100vh;
    padding: 26px 16px 20px;
    overflow-y: auto;
    background: rgba(255,255,255,0.035);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
    backdrop-filter: blur(24px) saturate(150%);
    border-right: 1px solid rgba(255,255,255,0.07);
    scrollbar-width: none;
    -ms-overflow-style: none;
}
.sidebar::-webkit-scrollbar { display: none; }
.navBrand {
    padding: 0 11px 22px;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: #eef2f8;
}
.navGroup { margin-bottom: 2px; }
.navTop {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 11px 12px;
    border-radius: 13px;
    border: 1px solid transparent;
    background: transparent;
    color: #a6b1c0;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
    transition: background .18s, color .18s, border-color .18s;
}
.navTop:hover { background: rgba(255,255,255,0.06); color: #e7ecf3; }
.navTop.active {
    color: #ffffff;
    background: linear-gradient(135deg, rgba(92,142,250,0.32), rgba(92,142,250,0.11));
    border-color: rgba(132,176,255,0.34);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16);
}
.navIco { flex: 0 0 20px; width: 20px; height: 20px; display: block; }
.navSubs {
    margin: 4px 0 12px 21px;
    padding-left: 12px;
    border-left: 1px solid rgba(255,255,255,0.11);
}
.navSub {
    display: block;
    width: 100%;
    margin: 2px 0;
    padding: 8px 11px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: #8d98a8;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: background .16s, color .16s;
}
.navSub:hover { color: #dbe3ee; background: rgba(255,255,255,0.05); }
.navSub.active { color: #93baff; background: rgba(110,160,255,0.14); }

/* ============ MAIN ============ */
.main {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 34px 26px;
}
.panel {
    position: relative;
    width: 100%;
    max-width: 940px;
    padding: 30px 34px 32px;
    border-radius: 26px;
    background: rgba(255,255,255,0.048);
    -webkit-backdrop-filter: blur(26px) saturate(155%);
    backdrop-filter: blur(26px) saturate(155%);
    border: 1px solid rgba(255,255,255,0.095);
    box-shadow: 0 26px 70px rgba(0,0,0,0.50), inset 0 1px 0 rgba(255,255,255,0.13);
}
.panel.narrow { max-width: 620px; }
.title {
    font-size: 29px;
    font-weight: 800;
    text-align: center;
    letter-spacing: -0.6px;
    margin: 0 0 22px 0;
    background: linear-gradient(180deg, #ffffff 0%, #b6c1d1 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}
.hintline { text-align: center; font-size: 13px; color: #8b96a6; margin: -12px 0 18px; }

/* ============ FORM ============ */
.split { display: flex; gap: 26px; align-items: flex-start; }
.splitL { flex: 1 1 auto; min-width: 0; }
.splitR { flex: 0 0 auto; text-align: center; padding-top: 22px; }
.field { margin-bottom: 15px; }
.fieldLabel {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #97a3b4;
    letter-spacing: .2px;
    margin-bottom: 7px;
}
.inputbox {
    width: 100%;
    padding: 13px 16px;
    border-radius: 14px;
    background: rgba(9,12,17,0.55);
    border: 1px solid rgba(255,255,255,0.085);
    color: #f0f3f8;
    font-size: 17px;
    font-weight: 600;
    font-family: inherit;
    outline: none;
    transition: border-color .18s, box-shadow .18s, background .18s;
}
.inputbox:focus {
    border-color: rgba(120,165,255,0.55);
    background: rgba(9,12,17,0.78);
    box-shadow: 0 0 0 3px rgba(90,140,255,0.15);
}
.inputbox:disabled { opacity: .4; }
.inputbox::placeholder { color: #5d6674; font-weight: 500; }
.selectbox {
    width: 100%;
    padding: 12px 14px;
    border-radius: 13px;
    background: rgba(9,12,17,0.6);
    border: 1px solid rgba(255,255,255,0.085);
    color: #eef2f7;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    outline: none;
}

/* ============ BUTTONS ============ */
.btn {
    padding: 12px 22px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.075);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    color: #e9edf3;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
}
.btn:hover { background: rgba(255,255,255,0.135); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: .35; cursor: default; transform: none; }
.btn:disabled:hover { background: rgba(255,255,255,0.075); transform: none; }
.btn.primary {
    background: linear-gradient(145deg, #4183fb, #2b62d8);
    border-color: rgba(255,255,255,0.20);
    box-shadow: 0 8px 22px rgba(45,100,220,0.34), inset 0 1px 0 rgba(255,255,255,0.30);
}
.btn.primary:hover { background: linear-gradient(145deg, #4f8cfc, #3169e0); }
.btn.green {
    background: linear-gradient(145deg, #2fb571, #1e8f55);
    border-color: rgba(255,255,255,0.18);
    box-shadow: 0 8px 20px rgba(30,140,85,0.30), inset 0 1px 0 rgba(255,255,255,0.26);
}
.btn.red {
    background: linear-gradient(145deg, #e34e4e, #bd3636);
    border-color: rgba(255,255,255,0.18);
    box-shadow: 0 8px 20px rgba(190,55,55,0.30), inset 0 1px 0 rgba(255,255,255,0.24);
}
.btn.amber {
    background: linear-gradient(145deg, #f2c94a, #dca81c);
    border-color: rgba(255,255,255,0.28);
    color: #2b2510;
    box-shadow: 0 8px 20px rgba(210,160,20,0.28), inset 0 1px 0 rgba(255,255,255,0.55);
}
.btn.orange {
    background: linear-gradient(145deg, #f28c2e, #d47015);
    border-color: rgba(255,255,255,0.18);
    box-shadow: 0 8px 20px rgba(210,110,20,0.28), inset 0 1px 0 rgba(255,255,255,0.26);
}
.btn.tiny { padding: 6px 15px; font-size: 13px; border-radius: 10px; }
.btn.sm { padding: 9px 17px; font-size: 14px; border-radius: 12px; }
.controls { text-align: center; margin-top: 20px; }
.controls .btn { margin: 5px 5px; }
.rowBetween { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ============ SEAT BOARD ============ */
.boardWrap { text-align: center; }
.flipRow { display: block; text-align: center; margin-bottom: 8px; }
.chalkRow { display: block; text-align: center; margin-bottom: 10px; }
.chalkRow.bottom { margin-bottom: 0; margin-top: 10px; }
.boardRow {
    display: block;
    text-align: center;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
    scrollbar-width: none;
    -ms-overflow-style: none;
}
.boardRow::-webkit-scrollbar { display: none; }
.chalk {
    display: inline-block;
    padding: 6px 32px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 7px;
    text-indent: 7px;
    color: #909baa;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.075);
}
.seatBoard {
    position: relative;
    display: inline-block;
    padding: 14px;
    border-radius: 20px;
    background: rgba(7,9,13,0.46);
    border: 1px solid rgba(255,255,255,0.07);
    box-shadow: inset 0 2px 22px rgba(0,0,0,0.45);
    overflow: hidden;
}
.seatRow { white-space: nowrap; margin-bottom: 7px; }
.seatRow:last-child { margin-bottom: 0; }
.seatCell {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 78px;
    height: 60px;
    margin: 0 2px;
    padding: 0 4px;
    vertical-align: middle;
    border-radius: 12px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.07);
    color: #ffffff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.15;
    cursor: pointer;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    transition: transform .14s ease, box-shadow .16s ease, background .16s ease;
}
.seatCell:hover { transform: translateY(-2px); }
.seatCell.static, .seatCell.static:hover { cursor: default; transform: none; }
.seatCell.filledM {
    background: linear-gradient(150deg, #4183fb, #2a5fc4);
    border-color: rgba(255,255,255,0.20);
    box-shadow: 0 6px 16px rgba(40,90,200,0.32), inset 0 1px 0 rgba(255,255,255,0.26);
}
.seatCell.filledF {
    background: linear-gradient(150deg, #e35d95, #bf3d73);
    border-color: rgba(255,255,255,0.20);
    box-shadow: 0 6px 16px rgba(180,55,105,0.32), inset 0 1px 0 rgba(255,255,255,0.26);
}
.seatCell.disabled {
    background: transparent;
    border: 1px dashed rgba(255,255,255,0.12);
    cursor: default;
}
.seatCell.disabled:hover { transform: none; }
.seatCell.allowed {
    background: linear-gradient(150deg, #4183fb, #2a5fc4);
    border-color: rgba(245,205,80,0.9);
    box-shadow: 0 0 0 2px rgba(245,205,80,0.75), 0 6px 16px rgba(40,90,200,0.3);
}
.seatCell.selected {
    box-shadow: 0 0 0 3px #f5cd50, 0 10px 26px rgba(0,0,0,0.45);
    transform: translateY(-2px);
}
.seatCell.dropTarget { box-shadow: 0 0 0 2px rgba(120,180,255,0.8); }
.cellNum {
    font-size: 11px;
    font-weight: 500;
    color: rgba(255,255,255,0.82);
    line-height: 1.1;
    margin-bottom: 2px;
}
.cellName {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.15;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.deskGap { display: inline-block; width: 16px; vertical-align: middle; }
.miniCell { width: 40px; height: 32px; margin: 0 1px; border-radius: 8px; font-size: 12px; }
.miniCell .cellNum { font-size: 9px; }
.miniCell .cellName { font-size: 11px; }
.seatBoard.mini { padding: 9px; border-radius: 15px; }
.seatBoard.mini .seatRow { margin-bottom: 4px; }
.previewCap { font-size: 13px; color: #8d99a9; margin-top: 9px; font-weight: 600; }

/* ============ BANK ============ */
.bank {
    margin: 14px 0 4px;
    padding: 12px;
    border-radius: 16px;
    background: rgba(7,9,13,0.4);
    border: 1px solid rgba(255,255,255,0.06);
    text-align: center;
    min-height: 54px;
}
.bankSlot {
    display: inline-block;
    margin: 4px;
    padding: 8px 15px;
    border-radius: 11px;
    background: linear-gradient(145deg, #4183fb, #2a5fc4);
    border: 1px solid rgba(255,255,255,0.18);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
}
.bankSlot.femaleSlot { background: linear-gradient(145deg, #e35d95, #bf3d73); }
.bankSlot:hover { transform: translateY(-2px); }
.bankSlot.selected { box-shadow: 0 0 0 3px #f5cd50; }
.bankEmpty { color: #7a8494; font-size: 14px; padding: 12px 0; }

/* ============ TABLE ============ */
.tableWrap {
    max-height: 470px;
    overflow-y: auto;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(7,9,13,0.32);
    scrollbar-width: none;
    -ms-overflow-style: none;
}
.tableWrap::-webkit-scrollbar { display: none; width: 0; height: 0; }
.stable { width: 100%; border-collapse: collapse; }
.stable thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    font-size: 13px;
    font-weight: 600;
    color: #96a2b3;
    padding: 11px 6px;
    background: rgba(26,30,37,0.97);
    border-bottom: 1px solid rgba(255,255,255,0.07);
}
.stable td {
    padding: 8px 6px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    border-bottom: 1px solid rgba(255,255,255,0.045);
}
.stable tbody tr:nth-child(odd) { background: rgba(255,255,255,0.022); }
.stable tbody tr.absentRow td { color: #5f6a79; font-weight: 500; }
.colChk { width: 44px; }
.colNum { width: 70px; }
.colGen { width: 70px; }
.colCond { width: 110px; }
.gTagM { color: #7fb0ff; }
.gTagF { color: #f193ba; }
input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #4183fb; }
input[type="radio"] { width: 16px; height: 16px; cursor: pointer; accent-color: #4183fb; }
.checkline {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: #c2cbd8;
    cursor: pointer;
    margin: 6px 14px 6px 0;
}

/* ============ NUMBER GRID (조건 목록) ============ */
.numGrid { text-align: center; }
.numbtn {
    display: inline-block;
    width: 60px;
    margin: 4px;
    padding: 11px 0;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.06);
    color: #dde4ee;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s, background .15s;
}
.numbtn:hover { transform: translateY(-2px); background: rgba(255,255,255,0.12); }
.numbtn.set {
    background: linear-gradient(145deg, #f28c2e, #d47015);
    border-color: rgba(255,255,255,0.2);
    box-shadow: 0 6px 16px rgba(210,110,20,0.28), inset 0 1px 0 rgba(255,255,255,0.26);
}

/* ============ CONDITION SECTIONS ============ */
.condSection {
    margin-bottom: 15px;
    padding: 16px 18px;
    border-radius: 18px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.07);
}
.condSection.disabled { opacity: .42; pointer-events: none; }
.condSectionTitle {
    font-size: 13px;
    font-weight: 700;
    color: #f0c14b;
    letter-spacing: .3px;
    margin-bottom: 11px;
}
.radioLine {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-right: 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}
.backbtn {
    position: absolute;
    top: 26px;
    right: 30px;
    padding: 8px 16px;
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.11);
    color: #dbe2eb;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background .16s;
}
.backbtn:hover { background: rgba(255,255,255,0.15); }
.fileinput { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.stepDot { text-align: center; font-size: 13px; color: #8b96a6; font-weight: 600; margin-bottom: 14px; }

/* ============ REVEAL (SHIFT) ============ */
.seatCell.spinning {
    background: linear-gradient(150deg, #5c6675, #3e4653);
    border-color: rgba(255,255,255,0.14);
    animation: spinPulse .34s ease-in-out infinite alternate;
}
.seatCell.spinning .cellName { filter: blur(1.1px); opacity: .78; }
@keyframes spinPulse {
    from { transform: translateY(0) scale(1); }
    to   { transform: translateY(-3px) scale(1.03); }
}
.seatCell.locked { animation: lockPop .46s cubic-bezier(.16,1.2,.3,1) both; }
@keyframes lockPop {
    0%   { transform: scale(.55) rotateX(70deg); opacity: 0; }
    45%  { transform: scale(1.22) rotateX(0deg); opacity: 1; box-shadow: 0 0 0 5px rgba(245,205,80,.55), 0 0 34px 6px rgba(245,205,80,.5); }
    75%  { transform: scale(.96); box-shadow: 0 0 0 2px rgba(245,205,80,.25), 0 0 18px 2px rgba(245,205,80,.22); }
    100% { transform: scale(1); }
}
.sweep {
    position: absolute;
    top: 0; bottom: 0;
    width: 46%;
    pointer-events: none;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.13) 38%, rgba(180,215,255,.32) 52%, rgba(255,255,255,.13) 66%, transparent);
    animation: sweepRun 1.05s cubic-bezier(.4,0,.25,1) forwards;
}
@keyframes sweepRun { from { left: -50%; } to { left: 108%; } }
.flash {
    position: fixed;
    left: 0; top: 0; right: 0; bottom: 0;
    z-index: 85;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(200,225,255,.30), transparent 68%);
    animation: flashOut .55s ease-out forwards;
}
@keyframes flashOut { from { opacity: 1; } to { opacity: 0; } }
.seatCell.burst { animation: burstFx .6s cubic-bezier(.2,1,.3,1) both; }
@keyframes burstFx {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.3) rotate(-4deg); box-shadow: 0 0 0 8px rgba(245,205,80,.42), 0 0 44px 10px rgba(245,205,80,.55); }
    60%  { transform: scale(.94) rotate(3deg); }
    100% { transform: scale(1) rotate(0); }
}
.spark { position: fixed; z-index: 96; width: 9px; height: 9px; border-radius: 50%; pointer-events: none; }

/* ============ INLINE EDIT TABLE ============ */
.cellInput {
    width: 100%;
    max-width: 210px;
    padding: 6px 11px;
    border-radius: 9px;
    background: rgba(9,12,17,0.55);
    border: 1px solid rgba(255,255,255,0.09);
    color: #eef2f7;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    outline: none;
    transition: border-color .16s, box-shadow .16s;
}
.cellInput:focus { border-color: rgba(120,165,255,0.6); box-shadow: 0 0 0 2px rgba(90,140,255,0.17); }
.cellInput:disabled { opacity: .3; }
.genBtn {
    padding: 5px 14px;
    border-radius: 9px;
    border: 1px solid rgba(127,176,255,0.32);
    background: rgba(65,131,251,0.18);
    color: #7fb0ff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s;
}
.genBtn:hover { background: rgba(65,131,251,0.3); }
.genBtn.f {
    border-color: rgba(241,147,186,0.32);
    background: rgba(227,93,149,0.18);
    color: #f193ba;
}
.genBtn.f:hover { background: rgba(227,93,149,0.3); }
.genBtn:disabled { opacity: .3; cursor: default; }

/* ============ MOBILE ============ */
@media (max-width: 860px) {
    .shell { flex-direction: column; }
    .sidebar {
        position: sticky;
        top: 0;
        z-index: 60;
        flex: none;
        width: 100%;
        height: auto;
        padding: 10px 12px;
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
    }
    .navBrand { display: none; }
    .navGroup { display: contents; }
    .navTop {
        grid-row: 1;
        justify-content: center;
        gap: 7px;
        padding: 9px 6px;
        font-size: 13.5px;
        border-radius: 12px;
        background: rgba(255,255,255,0.05);
        border-color: rgba(255,255,255,0.08);
    }
    .navIco { flex: 0 0 17px; width: 17px; height: 17px; }
    .navSubs {
        grid-row: 2;
        grid-column: 1 / -1;
        display: flex;
        gap: 6px;
        margin: 2px 0 0;
        padding: 8px 0 0;
        border-left: none;
        border-top: 1px solid rgba(255,255,255,0.08);
    }
    .navSub { flex: 1 1 0; text-align: center; padding: 7px 4px; font-size: 13px; }
    .main { padding: 20px 14px 34px; align-items: flex-start; }
    .panel { padding: 24px 18px 26px; border-radius: 22px; }
    .title { font-size: 24px; }
    .backbtn { top: 20px; right: 18px; padding: 7px 13px; font-size: 13px; }
    .split { flex-direction: column; gap: 16px; }
    .splitR { width: 100%; padding-top: 0; }
    .seatCell { width: 52px; height: 48px; font-size: 12px; margin: 0 1px; padding: 0 2px; }
    .cellNum { font-size: 9px; margin-bottom: 1px; }
    .cellName { font-size: 12px; }
    .miniCell { width: 32px; height: 26px; }
    .miniCell .cellName { font-size: 9px; }
    .deskGap { width: 9px; }
    .stable td { font-size: 14px; padding: 7px 3px; }
    .tableWrap { max-height: 400px; }
    .colNum { width: 46px; }
    .colChk { width: 48px; }
    .colCond { width: 78px; }
    .numbtn { width: 50px; padding: 9px 0; font-size: 13px; }
}
@media (max-width: 520px) {
    .main { padding: 16px 10px 30px; }
    .panel { padding: 22px 14px 24px; }
    .seatBoard { padding: 11px; }
    .seatCell { width: 44px; height: 44px; margin: 0 1px; }
    .cellNum { font-size: 8px; margin-bottom: 0; }
    .cellName { font-size: 11px; }
    .deskGap { width: 7px; }
    .miniCell { width: 28px; height: 24px; }
    .btn { padding: 10px 16px; font-size: 14px; }
    .controls .btn { margin: 4px 3px; }
    .navTop { font-size: 12.5px; gap: 5px; }
}
</style>
</head>
<body>
<div class="shell">
<nav id="sidebar" class="sidebar"></nav>
<main id="app" class="main"></main>
</div>
<div id="fx"></div>
<script type="text/javascript">
(function () {
    // ====== STATE ======
    var rows = 5;
    var cols = 6;
    var studentCount = 30;
    var absentNumbers = [];
    var participants = [];
    var students = {};
    var enabledSeats = [];
    var conditions = {};
    var currentSeats = [];
    var newSeats = [];

    var view = 'class.size';
    var condEditNum = null;
    var checkedRows = {};
    var selectedBankNum = null;
    var selectedSeatRC = null;
    var viewSelectedRC = null;
    var dragSource = null;
    var condSeatClipboard = null;
    var randomOptions = { noSamePair: false, noSameSeat: false };
    var condOnCtrl = false;
    var applyConditions = true;
    var viewFlipped = false;
    var hasResult = false;
    var revealing = false;
    var revealTimers = [];

    var GROUPS = [
        { id: 'class', label: '반 설정', subs: [
            { id: 'class.size', label: '행/열 · 끝번호' },
            { id: 'class.seatuse', label: '자리 사용 설정' }
        ] },
        { id: 'students', label: '학생 관리', subs: [
            { id: 'students.list', label: '보기' },
            { id: 'students.edit', label: '수정' }
        ] },
        { id: 'seats', label: '자리 배치', subs: [
            { id: 'seats.current', label: '현재 자리' },
            { id: 'seats.random', label: '랜덤 배치' }
        ] }
    ];

    // ====== HELPERS ======
    function trim(s) { return String(s).replace(/^\s+|\s+$/g, ''); }
    function escapeHtml(v) {
        return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function escapeTextName(v) { return String(v).replace(/"/g, '""'); }
    function shuffle(arr) {
        var i, j, t;
        for (i = arr.length - 1; i > 0; i--) {
            j = Math.floor(Math.random() * (i + 1));
            t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
    }
    function emptyGrid(value) {
        var out = [], r, c, row;
        for (r = 0; r < rows; r++) {
            row = [];
            for (c = 0; c < cols; c++) row.push(value);
            out.push(row);
        }
        return out;
    }
    function isAbsent(num) {
        var i;
        for (i = 0; i < absentNumbers.length; i++) if (absentNumbers[i] === num) return true;
        return false;
    }
    function buildParticipants() {
        var i;
        participants = [];
        for (i = 1; i <= studentCount; i++) if (!isAbsent(i)) participants.push(i);
    }
    function parseAbsentList(text, maxCount) {
        var raw = trim(text), parts, result = [], seen = {}, i, item, num;
        if (raw === '') return result;
        parts = raw.split(',');
        for (i = 0; i < parts.length; i++) {
            item = trim(parts[i]);
            if (item === '') continue;
            if (!/^\d+$/.test(item)) return null;
            num = parseInt(item, 10);
            if (num < 1 || num > maxCount) return null;
            if (!seen[num]) { seen[num] = true; result.push(num); }
        }
        result.sort(function (a, b) { return a - b; });
        return result;
    }
    function getAbsentText() { return absentNumbers.join(','); }
    function genderTag(g) { return g === 'F' ? 'F' : 'M'; }
    function getStudentLabel(num) {
        var s = students[num] || {};
        return (s.name || '') === '' ? num + '번' : num + ' ' + s.name;
    }
    function getStudentShort(num) {
        var s = students[num] || {};
        var name = s.name || '';
        if (name === '') return num + '번';
        if (name.length > 4) return num + ' ' + name.substring(0, 4);
        return num + ' ' + name;
    }
    function getMate(r, c) {
        var pc = c % 2 === 0 ? c + 1 : c - 1;
        if (pc < 0 || pc >= cols) return null;
        return { r: r, c: pc };
    }
    function sameDesk(c1, c2) { return (c1 % 2 === 0 ? c1 + 1 : c1 - 1) === c2; }
    function ensureCondition(num) {
        if (!conditions[num]) conditions[num] = { mustPairWith: null, pairGender: '', allowedSeats: [] };
        return conditions[num];
    }
    function hasAnyCondition(num) {
        var c = conditions[num];
        if (!c) return false;
        return c.mustPairWith != null || !!c.pairGender || (c.allowedSeats && c.allowedSeats.length > 0);
    }
    function countEnabled() {
        var n = 0, r, c;
        for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) if (enabledSeats[r][c]) n++;
        return n;
    }
    function displayRowOrder() {
        var arr = [], r;
        for (r = 0; r < rows; r++) arr.push(r);
        if (viewFlipped) arr.reverse();
        return arr;
    }
    function displayColOrder() {
        var arr = [], c;
        for (c = 0; c < cols; c++) arr.push(c);
        if (viewFlipped) arr.reverse();
        return arr;
    }
    function removeStudentFromGrids(num) {
        var r, c;
        for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) {
            if (currentSeats[r] && currentSeats[r][c] === num) currentSeats[r][c] = null;
            if (newSeats[r] && newSeats[r][c] === num) newSeats[r][c] = null;
        }
    }
    function syncRoster() {
        buildParticipants();
        var i, num, r, c;
        for (i = 0; i < participants.length; i++) {
            num = participants[i];
            if (!students[num]) students[num] = { name: '', gender: 'M' };
        }
        for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) {
            if (currentSeats[r][c] != null && participants.indexOf(currentSeats[r][c]) < 0) currentSeats[r][c] = null;
            if (newSeats[r][c] != null && participants.indexOf(newSeats[r][c]) < 0) newSeats[r][c] = null;
        }
        sanitizeConditionsAgainstGrid();
    }
    function sanitizeConditionsAgainstGrid() {
        var i, num, c, k, arr, p, partner, keys = [], key;
        for (i = 0; i < participants.length; i++) {
            num = participants[i];
            c = ensureCondition(num);
            if (c.mustPairWith != null) {
                partner = c.mustPairWith;
                if (participants.indexOf(partner) < 0 || partner === num) c.mustPairWith = null;
            }
            arr = [];
            if (c.allowedSeats) {
                for (k = 0; k < c.allowedSeats.length; k++) {
                    p = c.allowedSeats[k];
                    if (p.r >= 0 && p.r < rows && p.c >= 0 && p.c < cols && enabledSeats[p.r][p.c]) arr.push(p);
                }
            }
            c.allowedSeats = arr;
        }
        for (key in conditions) if (conditions.hasOwnProperty(key)) keys.push(key);
        for (i = 0; i < keys.length; i++) {
            if (participants.indexOf(parseInt(keys[i], 10)) < 0) delete conditions[keys[i]];
        }
        for (i = 0; i < participants.length; i++) {
            num = participants[i];
            c = conditions[num];
            if (c && c.mustPairWith != null) {
                var pc = ensureCondition(c.mustPairWith);
                if (pc.mustPairWith !== num) {
                    if (pc.mustPairWith == null) pc.mustPairWith = num;
                    else c.mustPairWith = null;
                }
            }
        }
    }
    function clearRevealTimers() {
        var i;
        for (i = 0; i < revealTimers.length; i++) clearTimeout(revealTimers[i]);
        revealTimers = [];
    }

    // ====== ICONS ======
    var ICON_CLASS = '<svg class="navIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<rect x="2.5" y="4" width="19" height="12.5" rx="1.6"></rect>' +
        '<line x1="1.5" y1="19.4" x2="22.5" y2="19.4"></line>' +
        '<rect x="4.2" y="17.1" width="3.4" height="2.3" rx="0.6" fill="currentColor" stroke="none"></rect></svg>';
    var ICON_STUDENT = '<svg class="navIco" viewBox="0 0 24 24" fill="currentColor">' +
        '<circle cx="12" cy="7.4" r="4.3"></circle>' +
        '<path d="M12 13.2c-4.6 0-8.2 2.7-8.2 6.1 0 0.9 0.7 1.5 1.6 1.5h13.2c0.9 0 1.6-0.6 1.6-1.5 0-3.4-3.6-6.1-8.2-6.1z"></path></svg>';
    var ICON_SHUFFLE = '<svg class="navIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M2.6 5.4h3.1c1.4 0 2.6 0.7 3.4 1.8l5.6 8.4c0.8 1.1 2 1.8 3.4 1.8h3.3"></path>' +
        '<path d="M2.6 18.6h3.1c1.4 0 2.6-0.7 3.4-1.8l0.9-1.4"></path>' +
        '<path d="M14.1 8.2l0.6-0.9c0.8-1.2 2-1.9 3.4-1.9h3.3"></path>' +
        '<polyline points="18.6,2.7 21.6,5.4 18.6,8.1"></polyline>' +
        '<polyline points="18.6,15.9 21.6,18.6 18.6,21.3"></polyline></svg>';
    var ICONS = { 'class': ICON_CLASS, 'students': ICON_STUDENT, 'seats': ICON_SHUFFLE };

    // ====== NAVIGATION ======
    function currentGroup() { return view.split('.')[0]; }
    function renderSidebar() {
        var sb = document.getElementById('sidebar');
        var html = '<div class="navBrand">자리 바꾸기</div>';
        var g, i, j, sub, active = currentGroup();
        for (i = 0; i < GROUPS.length; i++) {
            g = GROUPS[i];
            html += '<div class="navGroup">';
            html += '<button class="navTop' + (g.id === active ? ' active' : '') + '" data-g="' + g.id + '">' +
                ICONS[g.id] + '<span>' + g.label + '</span></button>';
            if (g.id === active) {
                html += '<div class="navSubs">';
                for (j = 0; j < g.subs.length; j++) {
                    sub = g.subs[j];
                    html += '<button class="navSub' + (sub.id === view ? ' active' : '') + '" data-v="' + sub.id + '">' + sub.label + '</button>';
                }
                html += '</div>';
            }
            html += '</div>';
        }
        sb.innerHTML = html;
        var tops = sb.querySelectorAll('[data-g]'), k;
        for (k = 0; k < tops.length; k++) {
            (function (el) {
                el.onclick = function () {
                    var gid = el.getAttribute('data-g'), n;
                    for (n = 0; n < GROUPS.length; n++) if (GROUPS[n].id === gid) { goView(GROUPS[n].subs[0].id); return; }
                };
            })(tops[k]);
        }
        var subsEls = sb.querySelectorAll('[data-v]');
        for (k = 0; k < subsEls.length; k++) {
            (function (el) { el.onclick = function () { goView(el.getAttribute('data-v')); }; })(subsEls[k]);
        }
    }
    function goView(v) {
        if (revealing) return;
        commitSizeInputs(true);
        commitEditInputs();
        view = v;
        condEditNum = null;
        selectedBankNum = null;
        selectedSeatRC = null;
        viewSelectedRC = null;
        render();
    }
    function render() {
        renderSidebar();
        var app = document.getElementById('app');
        if (condEditNum != null && currentGroup() === 'students') renderCondEdit(app);
        else if (view === 'class.size') renderClassSize(app);
        else if (view === 'class.seatuse') renderSeatUse(app);
        else if (view === 'students.list') renderStudentList(app);
        else if (view === 'students.edit') renderStudentEdit(app);
        else if (view === 'seats.current') renderCurrentSeats(app);
        else renderRandom(app);
    }

    // ====== SEAT BOARD ======
    // opts.mode: 'static' | 'seatuse' | 'allowed' | 'place' | 'view'
    function renderSeatBoardHtml(id, opts) {
        var mini = !!opts.mini;
        var html = '<div class="seatBoard' + (mini ? ' mini' : '') + '" id="' + id + '">';
        var ro = displayRowOrder(), co = displayColOrder();
        var ri, ci, r, c, cellClass, cellLabel, enabled, extra;
        for (ri = 0; ri < ro.length; ri++) {
            r = ro[ri];
            html += '<div class="seatRow">';
            for (ci = 0; ci < co.length; ci++) {
                c = co[ci];
                enabled = enabledSeats[r] && enabledSeats[r][c];
                cellClass = 'seatCell' + (mini ? ' miniCell' : '');
                cellLabel = '';
                extra = '';

                if (opts.mode === 'static') {
                    cellClass += ' static';
                    if (!enabled) cellClass += ' disabled';
                } else if (opts.mode === 'seatuse') {
                    if (!enabled) cellClass += ' disabled';
                } else if (opts.mode === 'allowed') {
                    if (!enabled) {
                        cellClass += ' disabled';
                    } else {
                        var al = (conditions[opts.num] && conditions[opts.num].allowedSeats) || [];
                        var isAl = false, k;
                        for (k = 0; k < al.length; k++) if (al[k].r === r && al[k].c === c) { isAl = true; break; }
                        if (isAl) cellClass += ' allowed';
                    }
                } else if (opts.mode === 'place') {
                    if (!enabled) {
                        cellClass += ' disabled';
                    } else {
                        var sn = currentSeats[r][c];
                        if (sn != null) {
                            cellClass += ' filled' + genderTag((students[sn] || {}).gender || 'M');
                            cellLabel = twoLineLabel(sn);
                            if (selectedSeatRC && selectedSeatRC.r === r && selectedSeatRC.c === c) cellClass += ' selected';
                        }
                        extra = ' draggable="true"';
                    }
                } else if (opts.mode === 'view') {
                    if (!enabled) {
                        cellClass += ' disabled';
                    } else {
                        var src = opts.useCurrent ? currentSeats : newSeats;
                        var vn = src[r][c];
                        if (vn != null) {
                            cellClass += ' filled' + genderTag((students[vn] || {}).gender || 'M');
                            cellLabel = twoLineLabel(vn);
                            if (viewSelectedRC && viewSelectedRC.r === r && viewSelectedRC.c === c) cellClass += ' selected';
                        }
                    }
                }
                html += '<button class="' + cellClass + '" data-r="' + r + '" data-c="' + c + '"' + extra + '>' + cellLabel + '</button>';
                if (ci < co.length - 1 && !sameDesk(c, co[ci + 1])) html += '<span class="deskGap"></span>';
            }
            html += '</div>';
        }
        html += '</div>';
        return html;
    }
    function twoLineLabel(num) {
        var s = students[num] || {};
        var nm = s.name || '';
        if (nm === '') return '<span class="cellName">' + num + '번</span>';
        return '<span class="cellNum">' + num + '</span><span class="cellName">' + escapeHtml(nm) + '</span>';
    }
    function boardWithChalk(id, opts, withFlip) {
        var h = '<div class="boardWrap">';
        if (withFlip) {
            h += '<div class="flipRow"><button id="flipBtn" class="btn tiny">뒤집기 · ' +
                (viewFlipped ? '선생님 시점' : '학생 시점') + '</button></div>';
        }
        if (!viewFlipped) h += '<div class="chalkRow"><span class="chalk">칠판</span></div>';
        h += '<div class="boardRow">' + renderSeatBoardHtml(id, opts) + '</div>';
        if (viewFlipped) h += '<div class="chalkRow bottom"><span class="chalk">칠판</span></div>';
        return h + '</div>';
    }
    function attachFlip() {
        var b = document.getElementById('flipBtn');
        if (b) b.onclick = function () { viewFlipped = !viewFlipped; render(); };
    }
    function attachBoardClicks(boardId, handler) {
        var board = document.getElementById(boardId);
        if (!board) return;
        var cells = board.getElementsByTagName('button'), i;
        for (i = 0; i < cells.length; i++) {
            (function (el) {
                el.onclick = function (ev) {
                    handler(parseInt(el.getAttribute('data-r'), 10), parseInt(el.getAttribute('data-c'), 10), ev);
                };
            })(cells[i]);
        }
    }

    // ====== VIEW: 반 설정 > 행/열 · 끝번호 ======
    function renderClassSize(app) {
        var html = '';
        html += '<div class="panel">';
        html += '<div class="title">행/열 · 끝번호</div>';
        html += '<div class="split"><div class="splitL">';
        html += '<div class="field"><label class="fieldLabel" for="rowsInput">행 수</label>';
        html += '<input id="rowsInput" class="inputbox" type="text" value="' + escapeHtml(rows) + '"></div>';
        html += '<div class="field"><label class="fieldLabel" for="colsInput">열 수</label>';
        html += '<input id="colsInput" class="inputbox" type="text" value="' + escapeHtml(cols) + '"></div>';
        html += '<div class="field"><label class="fieldLabel" for="countInput">끝번호</label>';
        html += '<input id="countInput" class="inputbox" type="text" value="' + escapeHtml(studentCount) + '"></div>';
        html += '<div class="field"><label class="fieldLabel" for="absentInput">결번</label>';
        html += '<input id="absentInput" class="inputbox" type="text" value="' + escapeHtml(getAbsentText()) + '" placeholder="예: 3, 7, 12"></div>';
        html += '</div><div class="splitR"><div id="previewWrap">';
        html += renderSeatBoardHtml('previewBoard', { mode: 'static', mini: true });
        html += '<div class="previewCap">미리 보기</div></div></div></div>';
        html += '<div class="controls">';
        html += '<button id="applyBtn" class="btn primary">적용</button>';
        html += '<input id="loadFileC" class="fileinput" type="file" accept=".txt">';
        html += '<button id="loadBtn" class="btn">불러오기</button>';
        html += '</div></div>';
        app.innerHTML = html;

        var ids = ['rowsInput', 'colsInput', 'countInput', 'absentInput'], i;
        for (i = 0; i < ids.length; i++) {
            (function (el) {
                if (!el) return;
                el.oninput = function () { refreshPreview(); };
                el.onkeydown = function (ev) {
                    if (ev.keyCode === 13 && commitSizeInputs(false)) { view = 'class.seatuse'; render(); }
                };
            })(document.getElementById(ids[i]));
        }
        document.getElementById('applyBtn').onclick = function () {
            if (commitSizeInputs(false)) { view = 'class.seatuse'; render(); }
        };
        document.getElementById('loadBtn').onclick = function () { openLoadDialog('loadFileC'); };
        document.getElementById('loadFileC').onchange = function () { loadFromSelectedFile('loadFileC', false); };
    }

    // Redraw only the preview so typing never loses focus. Preview is display-only.
    function refreshPreview() {
        var wrap = document.getElementById('previewWrap');
        if (!wrap) return;
        var rEl = document.getElementById('rowsInput'), cEl = document.getElementById('colsInput');
        if (rEl && cEl) {
            var rv = trim(rEl.value), cv = trim(cEl.value);
            if (/^\d+$/.test(rv) && /^\d+$/.test(cv)) {
                var nr = parseInt(rv, 10), nc = parseInt(cv, 10);
                if (nr >= 1 && nr <= 20 && nc >= 1 && nc <= 20 && (nr !== rows || nc !== cols)) resizeGrids(nr, nc);
            }
        }
        wrap.innerHTML = renderSeatBoardHtml('previewBoard', { mode: 'static', mini: true }) +
            '<div class="previewCap">미리 보기</div>';
    }
    function resizeGrids(nr, nc) {
        var oldE = enabledSeats, oldC = currentSeats, oldN = newSeats;
        var oldRows = rows, oldCols = cols, r, c;
        rows = nr; cols = nc;
        enabledSeats = emptyGrid(true);
        currentSeats = emptyGrid(null);
        newSeats = emptyGrid(null);
        for (r = 0; r < Math.min(rows, oldRows); r++) {
            for (c = 0; c < Math.min(cols, oldCols); c++) {
                enabledSeats[r][c] = oldE[r][c];
                currentSeats[r][c] = oldC[r][c];
                newSeats[r][c] = oldN[r][c];
            }
        }
        sanitizeConditionsAgainstGrid();
    }
    function commitSizeInputs(silent) {
        var rEl = document.getElementById('rowsInput');
        if (!rEl) return true;
        var cEl = document.getElementById('colsInput');
        var nEl = document.getElementById('countInput');
        var aEl = document.getElementById('absentInput');
        var rv = trim(rEl.value), cv = trim(cEl.value), nv = trim(nEl.value), av = aEl.value;
        if (!/^\d+$/.test(rv) || !/^\d+$/.test(cv) || !/^\d+$/.test(nv)) {
            if (!silent) alert('행 수, 열 수, 끝번호는 숫자로 입력해 주세요.');
            return false;
        }
        var nr = parseInt(rv, 10), nc = parseInt(cv, 10), nn = parseInt(nv, 10);
        if (nr < 1 || nc < 1 || nn < 1) {
            if (!silent) alert('행 수, 열 수, 끝번호는 1 이상이어야 합니다.');
            return false;
        }
        if (nr > 20 || nc > 20 || nn > 200) {
            if (!silent) alert('행/열은 20 이하, 끝번호는 200 이하로 입력해 주세요.');
            return false;
        }
        var abs = parseAbsentList(av, nn);
        if (abs === null) {
            if (!silent) alert('결번은 끝번호 범위 안의 숫자를 쉼표로 구분해 입력해 주세요.');
            return false;
        }
        if (nr !== rows || nc !== cols) resizeGrids(nr, nc);
        studentCount = nn;
        absentNumbers = abs;
        syncRoster();
        return true;
    }

    // ====== VIEW: 반 설정 > 자리 사용 설정 ======
    function renderSeatUse(app) {
        var html = '';
        html += '<div class="panel">';
        html += '<div class="title">자리 사용 설정</div>';

        document.getElementById('allOffBtn').onclick = function () {

            sanitizeConditionsAgainstGrid(); render();

        document.getElementById('fitBtn').onclick = function () {
            enabledSeats = emptyGrid(false);

                for (c = 0; c < cols && left > 0; c++) { enabledSeats[r][c] = true; left--; }

            var rr, cc;
            for (rr = 0; rr < rows; rr++) for (cc = 0; cc < cols; cc++) {
                if (!enabledSeats[rr][cc]) { currentSeats[rr][cc] = null; newSeats[rr][cc] = null; }
            }
            sanitizeConditionsAgainstGrid(); render();
        };

        var chks = document.getElementsByClassName('rowChk'), i;
        for (i = 0; i < chks.length; i++) {
            (function (el) {
                el.onchange = function () {
                    var num = parseInt(el.getAttribute('data-n'), 10);
                    if (el.checked) checkedRows[num] = true; else delete checkedRows[num];
                };
            })(chks[i]);
        }
        document.getElementById('chkAll').onchange = function () {
            var on = this.checked, k;
            checkedRows = {};
            if (on) for (k = 1; k <= studentCount; k++) checkedRows[k] = true;
            render();
        };
        var condBtns = document.querySelectorAll('[data-cond]');
        for (i = 0; i < condBtns.length; i++) {
            (function (el) {
                el.onclick = function () {
                    condEditNum = parseInt(el.getAttribute('data-cond'), 10);
                    ensureCondition(condEditNum);
                    render();
                };
            })(condBtns[i]);

        document.getElementById('addBtn').onclick = function () {

            studentCount++;
            checkedRows = {};
            syncRoster();
            render();
        };
        document.getElementById('delBtn').onclick = function () {
            var k, num, any = false;
            for (k in checkedRows) {

                if (num < 1 || num > studentCount) continue;
                if (!isAbsent(num)) { absentNumbers.push(num); any = true; }
                removeStudentFromGrids(num);

            if (!any) { alert('삭제할 학생을 먼저 선택해 주세요.'); return; }
            absentNumbers.sort(function (a, b) { return a - b; });
            while (studentCount > 0 && isAbsent(studentCount)) {
                var ti = absentNumbers.indexOf(studentCount);
                if (ti >= 0) absentNumbers.splice(ti, 1);

                delete conditions[studentCount];

                el.oninput = function () {

                };

                    ev.preventDefault();
                    focusNameField(num, ev.shiftKey ? -1 : 1);
                };

        }

        for (i = 0; i < genEls.length; i++) {
            (function (el) {

                            absentNumbers.sort(function (a, b) { return a - b; });

    // Move the caret to the next/previous editable name field.
    function focusNameField(fromNum, dir) {
        var n = fromNum + dir, el;
        while (n >= 1 && n <= studentCount) {
            el = document.querySelector('[data-name="' + n + '"]');
            if (el && !el.disabled) {
                el.focus();
                try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {}
                return true;
            }
            n += dir;
        }
        return false;
    }

    // Pull whatever is typed in the edit table back into state. Safe to call anywhere.
    function commitEditInputs() {
        var els = document.querySelectorAll('[data-name]'), i, num;
        for (i = 0; i < els.length; i++) {
            if (els[i].disabled) continue;
            num = parseInt(els[i].getAttribute('data-name'), 10);
            if (!students[num]) students[num] = { name: '', gender: 'M' };
            students[num].name = trim(els[i].value);
        }
    }

    function renderCondEdit(app) {

        var html = '';
        html += '<div class="panel narrow">';

        html += '<div class="condSection"><div class="condSectionTitle">강제 짝</div>';
        html += '<select id="forceSelect" class="selectbox"><option value="">없음</option>';
        var i, p;
        for (i = 0; i < participants.length; i++) {
            p = participants[i];
            if (p === num) continue;
            html += '<option value="' + p + '"' + (c.mustPairWith === p ? ' selected' : '') + '>' + escapeHtml(getStudentLabel(p)) + '</option>';
        }
        html += '</select></div>';

        html += '<div class="condSection' + (locked ? ' disabled' : '') + '"><div class="condSectionTitle">짝 성별</div>';
        html += '<label class="radioLine"><input type="radio" name="cgender" value=""' + (c.pairGender === '' ? ' checked' : '') + '>없음</label>';
        html += '<label class="radioLine"><input type="radio" name="cgender" value="M"' + (c.pairGender === 'M' ? ' checked' : '') + '>남자</label>';
        html += '<label class="radioLine"><input type="radio" name="cgender" value="F"' + (c.pairGender === 'F' ? ' checked' : '') + '>여자</label>';
        html += '</div>';

        html += '<div class="condSection' + (locked ? ' disabled' : '') + '"><div class="condSectionTitle">자리 제한</div>';
        html += '<div class="boardRow" style="text-align:center;">' + renderSeatBoardHtml('allowedBoard', { mode: 'allowed', num: num, mini: true }) + '</div>';
        html += '<div style="text-align:center;margin-top:10px;">';
        html += '<button id="clearAllowedBtn" class="btn tiny">해제</button> ';
        html += '<button id="copyAllowedBtn" class="btn tiny">저장</button> ';
        html += '<button id="pasteAllowedBtn" class="btn tiny"' + (condSeatClipboard ? '' : ' disabled') + '>불러오기</button>';
        html += '</div></div>';

        html += '<div class="controls">';
        html += '<button id="saveCondBtn" class="btn primary">저장</button>';
        html += '<button id="resetCondBtn" class="btn red">초기화</button>';
        html += '</div></div>';
        app.innerHTML = html;

        function saveCond() {
            var v = document.getElementById('forceSelect').value;
            var prevPartner = c.mustPairWith;
            c.mustPairWith = v === '' ? null : parseInt(v, 10);
            if (prevPartner != null && prevPartner !== c.mustPairWith) {
                var pc = conditions[prevPartner];
                if (pc && pc.mustPairWith === num) pc.mustPairWith = null;
            }
            if (c.mustPairWith != null) ensureCondition(c.mustPairWith).mustPairWith = num;
            var radios = document.getElementsByName('cgender'), i2;
            for (i2 = 0; i2 < radios.length; i2++) if (radios[i2].checked) c.pairGender = radios[i2].value;
        }
        document.getElementById('backBtn').onclick = function () { saveCond(); condEditNum = null; render(); };
        document.getElementById('saveCondBtn').onclick = function () { saveCond(); condEditNum = null; render(); };
        document.getElementById('resetCondBtn').onclick = function () {
            if (c.mustPairWith != null) {
                var pc = conditions[c.mustPairWith];
                if (pc && pc.mustPairWith === num) pc.mustPairWith = null;
            }
            conditions[num] = { mustPairWith: null, pairGender: '', allowedSeats: [] };
            render();
        };
        document.getElementById('forceSelect').onchange = function () { saveCond(); render(); };
        document.getElementById('clearAllowedBtn').onclick = function () {
            if (locked) return;
            c.allowedSeats = []; render();
        };
        document.getElementById('copyAllowedBtn').onclick = function () {
            if (locked) return;
            var arr = [], k;
            for (k = 0; k < c.allowedSeats.length; k++) arr.push({ r: c.allowedSeats[k].r, c: c.allowedSeats[k].c });
            condSeatClipboard = arr;
            render();
        };
        document.getElementById('pasteAllowedBtn').onclick = function () {
            if (locked || !condSeatClipboard) return;
            var arr = [], k, pp;
            for (k = 0; k < condSeatClipboard.length; k++) {
                pp = condSeatClipboard[k];
                if (pp.r < rows && pp.c < cols && enabledSeats[pp.r] && enabledSeats[pp.r][pp.c]) arr.push({ r: pp.r, c: pp.c });
            }
            c.allowedSeats = arr; render();
        };
        attachBoardClicks('allowedBoard', function (r, cc) {
            if (locked || !enabledSeats[r][cc]) return;
            var found = -1, k;
            for (k = 0; k < c.allowedSeats.length; k++) {
                if (c.allowedSeats[k].r === r && c.allowedSeats[k].c === cc) { found = k; break; }
            }
            if (found >= 0) c.allowedSeats.splice(found, 1);
            else c.allowedSeats.push({ r: r, c: cc });
            render();
        });
    }
