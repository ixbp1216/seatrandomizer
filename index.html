<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자리 바꾸기</title>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: #e9edf3;
    background-color: #14171c;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}
body::before {
    content: "";
    position: fixed;
    left: 0; top: 0; right: 0; bottom: 0;
    z-index: -1;
    pointer-events: none;
    background-image:
        radial-gradient(1000px 720px at 8% -12%, rgba(96,126,178,0.20), transparent 62%),
        radial-gradient(880px 640px at 104% 112%, rgba(72,94,138,0.18), transparent 62%),
        linear-gradient(158deg, #171a20 0%, #1c2027 48%, #13161b 100%);
}

/* ============ SHELL + SIDEBAR ============ */
.shell { display: flex; min-height: 100vh; align-items: stretch; }
.sidebar {
    position: sticky;
    top: 0;
    align-self: flex-start;
    flex: 0 0 220px;
    width: 220px;
    height: 100vh;
    padding: 26px 16px 20px;
    overflow-y: auto;
    background: rgba(255,255,255,0.035);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    backdrop-filter: blur(14px) saturate(140%);
    border-right: 1px solid rgba(255,255,255,0.07);
    scrollbar-width: none;
    -ms-overflow-style: none;
}
.sidebar::-webkit-scrollbar { display: none; }
.navBrand {
    padding: 0 11px 22px;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: #eef2f8;
}
.navGroup { margin-bottom: 2px; }
.navTop {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 11px 12px;
    border-radius: 13px;
    border: 1px solid transparent;
    background: transparent;
    color: #a6b1c0;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
    transition: background .18s, color .18s, border-color .18s;
}
.navTop:hover { background: rgba(255,255,255,0.06); color: #e7ecf3; }
.navTop.active {
    color: #ffffff;
    background: linear-gradient(135deg, rgba(92,142,250,0.32), rgba(92,142,250,0.11));
    border-color: rgba(132,176,255,0.34);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16);
}
.navIco { flex: 0 0 20px; width: 20px; height: 20px; display: block; }
.navSubs {
    margin: 4px 0 12px 21px;
    padding-left: 12px;
    border-left: 1px solid rgba(255,255,255,0.11);
}
.navSub {
    display: block;
    width: 100%;
    margin: 2px 0;
    padding: 8px 11px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: #8d98a8;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: background .16s, color .16s;
}
.navSub:hover { color: #dbe3ee; background: rgba(255,255,255,0.05); }
.navSub.active { color: #93baff; background: rgba(110,160,255,0.14); }

/* ============ MAIN ============ */
.main {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 34px 26px;
}
/* No backdrop-filter here on purpose: anything animating inside the panel would force
   the browser to re-blur the backdrop every frame. The layered translucent fill below
   reads the same against the static page gradient and costs nothing. */
.panel {
    position: relative;
    width: 100%;
    max-width: 940px;
    padding: 30px 34px 32px;
    border-radius: 26px;
    background:
        linear-gradient(158deg, rgba(255,255,255,0.085) 0%, rgba(255,255,255,0.030) 45%, rgba(255,255,255,0.055) 100%),
        rgba(28,33,41,0.62);
    border: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 26px 70px rgba(0,0,0,0.50), inset 0 1px 0 rgba(255,255,255,0.15);
}
.panel.narrow { max-width: 620px; }
.title {
    font-size: 29px;
    font-weight: 800;
    text-align: center;
    letter-spacing: -0.6px;
    margin: 0 0 22px 0;
    background: linear-gradient(180deg, #ffffff 0%, #b6c1d1 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}
.hintline { text-align: center; font-size: 13px; color: #8b96a6; margin: -12px 0 18px; }

/* ============ FORM ============ */
.split { display: flex; gap: 26px; align-items: flex-start; }
.splitL { flex: 1 1 auto; min-width: 0; }
.splitR { flex: 0 0 auto; text-align: center; padding-top: 22px; }
.field { margin-bottom: 15px; }
.fieldLabel {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #97a3b4;
    letter-spacing: .2px;
    margin-bottom: 7px;
}
.inputbox {
    width: 100%;
    padding: 13px 16px;
    border-radius: 14px;
    background: rgba(9,12,17,0.55);
    border: 1px solid rgba(255,255,255,0.085);
    color: #f0f3f8;
    font-size: 17px;
    font-weight: 600;
    font-family: inherit;
    outline: none;
    transition: border-color .18s, box-shadow .18s, background .18s;
}
.inputbox:focus {
    border-color: rgba(120,165,255,0.55);
    background: rgba(9,12,17,0.78);
    box-shadow: 0 0 0 3px rgba(90,140,255,0.15);
}
.inputbox:disabled { opacity: .4; }
.inputbox::placeholder { color: #5d6674; font-weight: 500; }
.selectbox {
    width: 100%;
    padding: 12px 14px;
    border-radius: 13px;
    background: rgba(9,12,17,0.6);
    border: 1px solid rgba(255,255,255,0.085);
    color: #eef2f7;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    outline: none;
}

/* ============ BUTTONS ============ */
.btn {
    padding: 12px 22px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.075);
    color: #e9edf3;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
}
.btn:hover { background: rgba(255,255,255,0.135); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: .35; cursor: default; transform: none; }
.btn:disabled:hover { background: rgba(255,255,255,0.075); transform: none; }
.btn.primary {
    background: linear-gradient(145deg, #4183fb, #2b62d8);
    border-color: rgba(255,255,255,0.20);
    box-shadow: 0 8px 22px rgba(45,100,220,0.34), inset 0 1px 0 rgba(255,255,255,0.30);
}
.btn.primary:hover { background: linear-gradient(145deg, #4f8cfc, #3169e0); }
.btn.green {
    background: linear-gradient(145deg, #2fb571, #1e8f55);
    border-color: rgba(255,255,255,0.18);
    box-shadow: 0 8px 20px rgba(30,140,85,0.30), inset 0 1px 0 rgba(255,255,255,0.26);
}
.btn.red {
    background: linear-gradient(145deg, #e34e4e, #bd3636);
    border-color: rgba(255,255,255,0.18);
    box-shadow: 0 8px 20px rgba(190,55,55,0.30), inset 0 1px 0 rgba(255,255,255,0.24);
}
.btn.amber {
    background: linear-gradient(145deg, #f2c94a, #dca81c);
    border-color: rgba(255,255,255,0.28);
    color: #2b2510;
    box-shadow: 0 8px 20px rgba(210,160,20,0.28), inset 0 1px 0 rgba(255,255,255,0.55);
}
.btn.orange {
    background: linear-gradient(145deg, #f28c2e, #d47015);
    border-color: rgba(255,255,255,0.18);
    box-shadow: 0 8px 20px rgba(210,110,20,0.28), inset 0 1px 0 rgba(255,255,255,0.26);
}
.btn.tiny { padding: 6px 15px; font-size: 13px; border-radius: 10px; }
.btn.sm { padding: 9px 17px; font-size: 14px; border-radius: 12px; }
.controls { text-align: center; margin-top: 20px; }
.controls .btn { margin: 5px 5px; }
.rowBetween { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ============ SEAT BOARD ============ */
.boardWrap { text-align: center; }
.flipRow { display: block; text-align: center; margin-bottom: 8px; }
.chalkRow { display: block; text-align: center; margin-bottom: 10px; }
.chalkRow.bottom { margin-bottom: 0; margin-top: 10px; }
.boardRow {
    display: block;
    text-align: center;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
    scrollbar-width: none;
    -ms-overflow-style: none;
}
.boardRow::-webkit-scrollbar { display: none; }
.chalk {
    display: inline-block;
    padding: 6px 32px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 7px;
    text-indent: 7px;
    color: #909baa;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.075);
}
.seatBoard {
    --cw: 78px;
    --ch: 60px;
    position: relative;
    display: inline-block;
    padding: 14px;
    border-radius: 20px;
    background: rgba(7,9,13,0.46);
    border: 1px solid rgba(255,255,255,0.07);
    box-shadow: inset 0 2px 22px rgba(0,0,0,0.45);
    overflow: hidden;
}
.seatRow { white-space: nowrap; margin-bottom: 7px; }
.seatRow:last-child { margin-bottom: 0; }
.seatCell {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: var(--cw);
    height: var(--ch);
    margin: 0 2px;
    padding: 0 4px;
    vertical-align: middle;
    flex: 0 0 auto;
    min-width: 0;
    border-radius: 12px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.07);
    color: #ffffff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.15;
    cursor: pointer;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    transition: transform .14s ease, box-shadow .16s ease, background .16s ease;
}
.seatCell:hover { transform: translateY(-2px); }
.seatCell.static, .seatCell.static:hover { cursor: default; transform: none; }
.seatCell.filledM {
    background: linear-gradient(150deg, #4183fb, #2a5fc4);
    border-color: rgba(255,255,255,0.20);
    box-shadow: 0 6px 16px rgba(40,90,200,0.32), inset 0 1px 0 rgba(255,255,255,0.26);
}
.seatCell.filledF {
    background: linear-gradient(150deg, #e35d95, #bf3d73);
    border-color: rgba(255,255,255,0.20);
    box-shadow: 0 6px 16px rgba(180,55,105,0.32), inset 0 1px 0 rgba(255,255,255,0.26);
}
.seatCell.disabled {
    background: transparent;
    border: 1px dashed rgba(255,255,255,0.12);
    cursor: default;
}
.seatCell.disabled:hover { transform: none; }
.seatCell.allowed {
    background: linear-gradient(150deg, #4183fb, #2a5fc4);
    border-color: rgba(245,205,80,0.9);
    box-shadow: 0 0 0 2px rgba(245,205,80,0.75), 0 6px 16px rgba(40,90,200,0.3);
}
.seatCell.selected {
    box-shadow: 0 0 0 3px #f5cd50, 0 10px 26px rgba(0,0,0,0.45);
    transform: translateY(-2px);
}
.seatCell.dropTarget { box-shadow: 0 0 0 2px rgba(120,180,255,0.8); }
.cellNum {
    font-size: 11px;
    font-weight: 500;
    color: rgba(255,255,255,0.82);
    line-height: 1.1;
    margin-bottom: 2px;
}
.cellName {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.15;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.deskGap { display: inline-block; width: 16px; vertical-align: middle; }
.miniCell { margin: 0 1px; border-radius: 8px; font-size: 12px; }
.seatBoard.mini { --cw: 40px; --ch: 32px; }
.miniCell .cellNum { font-size: 9px; }
.miniCell .cellName { font-size: 11px; }
.seatBoard.mini { padding: 9px; border-radius: 15px; }
.deskGrp { display: inline-flex; vertical-align: middle; }
.deskGrp.desk3 { width: calc(var(--cw) * 2 + 8px); }
.deskGrp.desk3 .seatCell { flex: 1 1 0; width: auto; padding: 0 1px; }
.seatBoard.mini .deskGrp.desk3 { width: calc(var(--cw) * 2 + 4px); }
.seatBoard.mini .seatRow { margin-bottom: 4px; }
.previewCap { font-size: 13px; color: #8d99a9; margin-top: 9px; font-weight: 600; }

/* ============ BANK ============ */
.bank {
    margin: 14px 0 4px;
    padding: 12px;
    border-radius: 16px;
    background: rgba(7,9,13,0.4);
    border: 1px solid rgba(255,255,255,0.06);
    text-align: center;
    min-height: 54px;
}
.bankSlot {
    display: inline-block;
    margin: 4px;
    padding: 8px 15px;
    border-radius: 11px;
    background: linear-gradient(145deg, #4183fb, #2a5fc4);
    border: 1px solid rgba(255,255,255,0.18);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
}
.bankSlot.femaleSlot { background: linear-gradient(145deg, #e35d95, #bf3d73); }
.bankSlot:hover { transform: translateY(-2px); }
.bankSlot.selected { box-shadow: 0 0 0 3px #f5cd50; }
.bankEmpty { color: #7a8494; font-size: 14px; padding: 12px 0; }

/* ============ TABLE ============ */
.tableWrap {
    max-height: 470px;
    overflow-y: auto;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(7,9,13,0.32);
    scrollbar-width: none;
    -ms-overflow-style: none;
}
.tableWrap::-webkit-scrollbar { display: none; width: 0; height: 0; }
.stable { width: 100%; border-collapse: collapse; }
.stable thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    font-size: 13px;
    font-weight: 600;
    color: #96a2b3;
    padding: 11px 6px;
    background: rgba(26,30,37,0.97);
    border-bottom: 1px solid rgba(255,255,255,0.07);
}
.stable td {
    padding: 8px 6px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    border-bottom: 1px solid rgba(255,255,255,0.045);
}
.stable tbody tr:nth-child(odd) { background: rgba(255,255,255,0.022); }
.stable tbody tr.absentRow td { color: #5f6a79; font-weight: 500; }
.colChk { width: 44px; }
.colNum { width: 70px; }
.colGen { width: 70px; }
.colCond { width: 110px; }
.gTagM { color: #7fb0ff; }
.gTagF { color: #f193ba; }
input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #4183fb; }
input[type="radio"] { width: 16px; height: 16px; cursor: pointer; accent-color: #4183fb; }
.checkline {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: #c2cbd8;
    cursor: pointer;
    margin: 6px 14px 6px 0;
}

/* ============ NUMBER GRID (조건 목록) ============ */
.numGrid { text-align: center; }
.numbtn {
    display: inline-block;
    width: 60px;
    margin: 4px;
    padding: 11px 0;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.06);
    color: #dde4ee;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s, background .15s;
}
.numbtn:hover { transform: translateY(-2px); background: rgba(255,255,255,0.12); }
.numbtn.set {
    background: linear-gradient(145deg, #f28c2e, #d47015);
    border-color: rgba(255,255,255,0.2);
    box-shadow: 0 6px 16px rgba(210,110,20,0.28), inset 0 1px 0 rgba(255,255,255,0.26);
}

/* ============ CONDITION SECTIONS ============ */
.condSection {
    margin-bottom: 15px;
    padding: 16px 18px;
    border-radius: 18px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.07);
}
.condSection.disabled { opacity: .42; pointer-events: none; }
.condSectionTitle {
    font-size: 13px;
    font-weight: 700;
    color: #f0c14b;
    letter-spacing: .3px;
    margin-bottom: 11px;
}
.radioLine {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-right: 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}
.backbtn {
    position: absolute;
    top: 26px;
    right: 30px;
    padding: 8px 16px;
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.11);
    color: #dbe2eb;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background .16s;
}
.backbtn:hover { background: rgba(255,255,255,0.15); }
.fileinput { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.stepDot { text-align: center; font-size: 13px; color: #8b96a6; font-weight: 600; margin-bottom: 14px; }

/* ============ REVEAL (SHIFT) ============ */
.seatCell.spinning {
    background: linear-gradient(150deg, #5c6675, #3e4653);
    border-color: rgba(255,255,255,0.14);
    transition: none;
    animation: spinPulse .34s ease-in-out infinite alternate;
}
.seatRow:nth-child(2n) .seatCell.spinning { animation-delay: -.11s; }
.seatRow:nth-child(3n) .seatCell.spinning { animation-delay: -.22s; }
.seatCell.spinning .cellName { opacity: .6; }
@keyframes spinPulse {
    from { transform: translateY(0) scale(1); }
    to   { transform: translateY(-3px) scale(1.03); }
}
.seatCell.locked { animation: lockPop .46s cubic-bezier(.16,1.2,.3,1) both; }
@keyframes lockPop {
    0%   { transform: scale(.55) rotateX(70deg); opacity: 0; }
    45%  { transform: scale(1.22) rotateX(0deg); opacity: 1; }
    75%  { transform: scale(.96); }
    100% { transform: scale(1); }
}
/* the gold flare is a sibling overlay: only opacity/transform animate, so it composites */
.flare {
    position: fixed;
    z-index: 94;
    border-radius: 14px;
    pointer-events: none;
    box-shadow: 0 0 0 4px rgba(245,205,80,.6), 0 0 34px 8px rgba(245,205,80,.5);
    animation: flareOut .5s ease-out both;
}
@keyframes flareOut {
    0%   { opacity: 0; transform: scale(.8); }
    28%  { opacity: 1; transform: scale(1.06); }
    100% { opacity: 0; transform: scale(1); }
}
.sweep {
    position: absolute;
    top: 0; bottom: 0;
    width: 46%;
    pointer-events: none;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.13) 38%, rgba(180,215,255,.32) 52%, rgba(255,255,255,.13) 66%, transparent);
    animation: sweepRun 1.05s cubic-bezier(.4,0,.25,1) forwards;
}
@keyframes sweepRun { from { left: -50%; } to { left: 108%; } }
.flash {
    position: fixed;
    left: 0; top: 0; right: 0; bottom: 0;
    z-index: 85;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(200,225,255,.30), transparent 68%);
    animation: flashOut .55s ease-out forwards;
}
@keyframes flashOut { from { opacity: 1; } to { opacity: 0; } }
.seatCell.burst { animation: burstFx .6s cubic-bezier(.2,1,.3,1) both; }
@keyframes burstFx {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.3) rotate(-4deg); }
    60%  { transform: scale(.94) rotate(3deg); }
    100% { transform: scale(1) rotate(0); }
}
.spark { position: fixed; z-index: 96; width: 9px; height: 9px; border-radius: 50%; pointer-events: none; }

/* ============ INLINE EDIT TABLE ============ */
.cellInput {
    width: 100%;
    max-width: 210px;
    padding: 6px 11px;
    border-radius: 9px;
    background: rgba(9,12,17,0.55);
    border: 1px solid rgba(255,255,255,0.09);
    color: #eef2f7;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    outline: none;
    transition: border-color .16s, box-shadow .16s;
}
.cellInput:focus { border-color: rgba(120,165,255,0.6); box-shadow: 0 0 0 2px rgba(90,140,255,0.17); }
.cellInput:disabled { opacity: .3; }
.genBtn {
    padding: 5px 14px;
    border-radius: 9px;
    border: 1px solid rgba(127,176,255,0.32);
    background: rgba(65,131,251,0.18);
    color: #7fb0ff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s;
}
.genBtn:hover { background: rgba(65,131,251,0.3); }
.genBtn.f {
    border-color: rgba(241,147,186,0.32);
    background: rgba(227,93,149,0.18);
    color: #f193ba;
}
.genBtn.f:hover { background: rgba(227,93,149,0.3); }
.genBtn:disabled { opacity: .3; cursor: default; }


/* ============ PRINT SHEET EDITOR ============ */
.panel.wide { max-width: 1160px; }
.sheetArea { display: flex; gap: 14px; align-items: flex-start; }
.toolCol { display: flex; flex-direction: column; gap: 10px; flex: 0 0 auto; padding-top: 2px; }
.toolBtn {
    width: 44px; height: 44px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px;

<div class="shell">

</div>
<div id="fx"></div>
<script type="text/javascript">
(function () {
    // ====== STATE ======
    var rows = 5;
    var cols = 6;
    var className = '';
    var tripleDesk = null;   // {r,c} start of the one 3-seat desk
    var deskPickMode = false;
    var studentCount = 30;
    var absentNumbers = [];
    var participants = [];
    var students = {};
    var enabledSeats = [];
    var conditions = {};
    var currentSeats = [];
    var newSeats = [];

    var view = 'class.size';
    var condEditNum = null;
    var checkedRows = {};
    var selectedBankNum = null;
    var selectedSeatRC = null;
    var viewSelectedRC = null;
    var dragSource = null;
    var condSeatClipboard = null;
    var randomOptions = { noSamePair: false, noSameSeat: false };
    var condOnCtrl = false;
    var applyConditions = true;
    var viewFlipped = false;
    var hasResult = false;
    var revealing = false;
    var revealTimers = [];
    var soundOn = true;

    // ====== PRINT SHEET ======
    var SHEET_W = 1000, SHEET_H = 707;      // A4 landscape ratio
    var sheet = null;                        // {theme, deskSide, els:[...]}
    var printTool = 'move';                  // move | text | desk | style
    var selEl = null;
    var shareMsg = '';

    var GROUPS = [
        { id: 'class', label: '반 설정', subs: [
            { id: 'class.size', label: '행/열 · 끝번호' },
            { id: 'class.seatuse', label: '자리 사용 설정' }
        ] },
        { id: 'students', label: '학생 관리', subs: [
            { id: 'students.list', label: '보기' },
            { id: 'students.edit', label: '수정' }
        ] },
        { id: 'seats', label: '자리 배치', subs: [
            { id: 'seats.current', label: '현재 자리' },
            { id: 'seats.random', label: '랜덤 배치' }
        ] },
        { id: 'print', label: '출력', subs: [
            { id: 'print.sheet', label: '자리배치표' }
        ] }
    ];

    // ====== HELPERS ======
    function trim(s) { return String(s).replace(/^\s+|\s+$/g, ''); }
    function escapeHtml(v) {
        return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function escapeTextName(v) { return String(v).replace(/"/g, '""'); }
    function shuffle(arr) {
        var i, j, t;
        for (i = arr.length - 1; i > 0; i--) {
            j = Math.floor(Math.random() * (i + 1));
            t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
    }
    function emptyGrid(value) {
        var out = [], r, c, row;
        for (r = 0; r < rows; r++) {
            row = [];
            for (c = 0; c < NC(); c++) row.push(value);
            out.push(row);
        }
        return out;
    }
    function isAbsent(num) {
        var i;
        for (i = 0; i < absentNumbers.length; i++) if (absentNumbers[i] === num) return true;
        return false;
    }
    function buildParticipants() {
        var i;
        participants = [];
        for (i = 1; i <= studentCount; i++) if (!isAbsent(i)) participants.push(i);
    }
    function parseAbsentList(text, maxCount) {
        var raw = trim(text), parts, result = [], seen = {}, i, item, num;
        if (raw === '') return result;
        parts = raw.split(',');
        for (i = 0; i < parts.length; i++) {
            item = trim(parts[i]);
            if (item === '') continue;
            if (!/^\d+$/.test(item)) return null;
            num = parseInt(item, 10);
            if (num < 1 || num > maxCount) return null;
            if (!seen[num]) { seen[num] = true; result.push(num); }
        }
        result.sort(function (a, b) { return a - b; });
        return result;
    }
    function getAbsentText() { return absentNumbers.join(','); }
    function genderTag(g) { return g === 'F' ? 'F' : 'M'; }
    function getStudentLabel(num) {
        var s = students[num] || {};
        return (s.name || '') === '' ? num + '번' : num + ' ' + s.name;
    }
    function getStudentShort(num) {
        var s = students[num] || {};
        var name = s.name || '';
        if (name === '') return num + '번';
        if (name.length > 4) return num + ' ' + name.substring(0, 4);
        return num + ' ' + name;
    }
    // Seats live in a rows x (cols+1) grid. The last column is a spare seat that only
    // exists when a 3-seat desk is designated: it shares that desk's width, so the
    // board footprint never changes -- the desk is just split into three.
    function NC() { return cols + 1; }
    function isExtra(c) { return c === cols; }
    function hasExtra(r) { return !!(tripleDesk && tripleDesk.r === r); }
    // desks are always column pairs now
    function deskLayoutForRow(r) {
        var out = [], c = 0;
        while (c < cols) {
            if (c + 1 < cols) { out.push({ s: c, n: 2 }); c += 2; }
            else { out.push({ s: c, n: 1 }); c += 1; }
        }
        return out;
    }
    // column indices seated at the desk starting at column s
    function deskSeatCols(r, sCol) {
        var L = deskLayoutForRow(r), i, d = null;
        for (i = 0; i < L.length; i++) if (L[i].s === sCol) { d = L[i]; break; }
        if (!d) return [sCol];
        var out = [], k;
        for (k = d.s; k < d.s + d.n; k++) out.push(k);
        if (hasExtra(r) && tripleDesk.c === d.s) out.push(cols);
        return out;
    }
    function deskStartOf(r, c) {
        if (isExtra(c)) return hasExtra(r) ? tripleDesk.c : -1;
        var L = deskLayoutForRow(r), i;
        for (i = 0; i < L.length; i++) if (c >= L[i].s && c < L[i].s + L[i].n) return L[i].s;
        return c;
    }
    function deskMates(r, c) {
        var st = deskStartOf(r, c);
        if (st < 0) return [];
        var seats = deskSeatCols(r, st), out = [], k;
        for (k = 0; k < seats.length; k++) if (seats[k] !== c) out.push({ r: r, c: seats[k] });
        return out;
    }
    function sameDesk(r, c1, c2) { return deskStartOf(r, c1) === deskStartOf(r, c2); }
    // Visual order for a row: desks left to right, seats within each desk.
    function rowDesks(r) {
        var L = deskLayoutForRow(r), out = [], i, seats;
        for (i = 0; i < L.length; i++) {
            seats = deskSeatCols(r, L[i].s);
            if (viewFlipped) seats = seats.slice().reverse();
            out.push({ s: L[i].s, seats: seats, triple: seats.length === 3 });
        }
        if (viewFlipped) out.reverse();
        return out;
    }
    // The spare seat is usable only on the row that owns the 3-seat desk.
    function syncExtraSeats() {
        var r;
        for (r = 0; r < rows; r++) {
            if (!enabledSeats[r]) continue;
            if (!hasExtra(r)) enabledSeats[r][cols] = false;
            else if (enabledSeats[r][cols] !== true) enabledSeats[r][cols] = true;
        }
    }
    function ensureCondition(num) {
        if (!conditions[num]) conditions[num] = { mustPairWith: null, pairGender: '', allowedSeats: [] };
        return conditions[num];
    }
    function hasAnyCondition(num) {
        var c = conditions[num];
        if (!c) return false;
        return c.mustPairWith != null || !!c.pairGender || (c.allowedSeats && c.allowedSeats.length > 0);
    }
    function countEnabled() {
        var n = 0, r, c;
        for (r = 0; r < rows; r++) for (c = 0; c < NC(); c++) if (enabledSeats[r][c]) n++;
        return n;
    }
    function displayRowOrder() {
        var arr = [], r;
        for (r = 0; r < rows; r++) arr.push(r);
        if (viewFlipped) arr.reverse();
        return arr;
    }
    function removeStudentFromGrids(num) {
        var r, c;
        for (r = 0; r < rows; r++) for (c = 0; c < NC(); c++) {
            if (currentSeats[r] && currentSeats[r][c] === num) currentSeats[r][c] = null;
            if (newSeats[r] && newSeats[r][c] === num) newSeats[r][c] = null;
        }
    }
    function syncRoster() {
        buildParticipants();
        syncExtraSeats();
        var i, num, r, c;
        for (i = 0; i < participants.length; i++) {
            num = participants[i];
            if (!students[num]) students[num] = { name: '', gender: 'M' };
        }
        for (r = 0; r < rows; r++) for (c = 0; c < NC(); c++) {
            if (currentSeats[r][c] != null && participants.indexOf(currentSeats[r][c]) < 0) currentSeats[r][c] = null;
            if (newSeats[r][c] != null && participants.indexOf(newSeats[r][c]) < 0) newSeats[r][c] = null;
        }
        sanitizeConditionsAgainstGrid();
    }
    function sanitizeConditionsAgainstGrid() {
        syncExtraSeats();
        var i, num, c, k, arr, p, partner, keys = [], key;
        for (i = 0; i < participants.length; i++) {
            num = participants[i];
            c = ensureCondition(num);
            if (c.mustPairWith != null) {
                partner = c.mustPairWith;
                if (participants.indexOf(partner) < 0 || partner === num) c.mustPairWith = null;
            }
            arr = [];
            if (c.allowedSeats) {
                for (k = 0; k < c.allowedSeats.length; k++) {
                    p = c.allowedSeats[k];
                    if (p.r >= 0 && p.r < rows && p.c >= 0 && p.c < NC() && enabledSeats[p.r][p.c]) arr.push(p);
                }
            }
            c.allowedSeats = arr;
        }
        for (key in conditions) if (conditions.hasOwnProperty(key)) keys.push(key);
        for (i = 0; i < keys.length; i++) {
            if (participants.indexOf(parseInt(keys[i], 10)) < 0) delete conditions[keys[i]];
        }
        for (i = 0; i < participants.length; i++) {
            num = participants[i];
            c = conditions[num];
            if (c && c.mustPairWith != null) {
                var pc = ensureCondition(c.mustPairWith);
                if (pc.mustPairWith !== num) {
                    if (pc.mustPairWith == null) pc.mustPairWith = num;
                    else c.mustPairWith = null;
                }
            }
        }
    }
    // ====== AUDIO (synthesised, no external files) ======
    var actx = null, master = null;
    function ensureAudio() {
        if (!soundOn) return null;
        if (actx) {
            if (actx.state === 'suspended' && actx.resume) { try { actx.resume(); } catch (e) {} }
            return actx;
        }
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { soundOn = false; return null; }
        try {
            actx = new AC();
            master = actx.createGain();
            master.gain.value = 0.9;
            master.connect(actx.destination);
        } catch (e) { actx = null; soundOn = false; return null; }
        return actx;
    }
    // one shaped oscillator blip
    function tone(f0, f1, dur, type, vol, delay) {
        var ac = ensureAudio();
        if (!ac) return;
        var t0 = ac.currentTime + (delay || 0);
        var osc = ac.createOscillator(), g = ac.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(f0, t0);
        if (f1 && f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(g); g.connect(master);
        osc.start(t0);
        osc.stop(t0 + dur + 0.03);
    }
    var noiseBuf = null;
    function noiseBurst(dur, vol, f0, f1, q) {
        var ac = ensureAudio();
        if (!ac) return;
        if (!noiseBuf) {
            noiseBuf = ac.createBuffer(1, ac.sampleRate * 1.2, ac.sampleRate);
            var d = noiseBuf.getChannelData(0), i;
            for (i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        var t0 = ac.currentTime;
        var src = ac.createBufferSource(); src.buffer = noiseBuf;
        var bp = ac.createBiquadFilter();
        bp.type = 'bandpass'; bp.Q.value = q || 1.2;
        bp.frequency.setValueAtTime(f0, t0);
        if (f1 && f1 !== f0) bp.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t0 + dur);
        var g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        src.connect(bp); bp.connect(g); g.connect(master);
        src.start(t0);
        src.stop(t0 + dur + 0.03);
    }
    var PENTA = [0, 3, 5, 7, 10];
    function sfxStart() { noiseBurst(0.5, 0.16, 240, 3200, 0.8); tone(160, 90, 0.4, 'sine', 0.1); }

    // ---- 두구두구: a proper snare buzz roll (dense, bright, accelerating) ----
    var rollTimer = null, rollNext = 0, rollT0 = 0, rollBeat = 0, rollSpan = 0;
    // One snare stroke rendered once into a buffer: envelope and wire rattle are baked in,
    // so each hit of the roll costs a source + a gain instead of source + filter + automation.
    var snareBuf = null;
    function ensureSnare(ac) {
        if (snareBuf) return snareBuf;
        var len = Math.floor(ac.sampleRate * 0.07);
        snareBuf = ac.createBuffer(1, len, ac.sampleRate);
        var d = snareBuf.getChannelData(0), prev = 0, hp = 0, i, w, env;
        for (i = 0; i < len; i++) {
            w = Math.random() * 2 - 1;
            hp = 0.78 * (hp + w - prev);          // high-passed noise = snare wires
            prev = w;
            env = Math.exp(-i / (ac.sampleRate * 0.013));
            d[i] = hp * env * 0.9;
        }
        return snareBuf;
    }
    // pr = 0..1 progress through the roll; drives pitch so the roll rises as it tightens
    function snareHit(t, vol, accent, withBody, pr) {
        var ac = ensureAudio();
        if (!ac) return;
        var rise = 0.72 + 1.05 * pr;               // buffer resampled upward = higher snare
        var src = ac.createBufferSource();
        src.buffer = ensureSnare(ac);
        src.playbackRate.value = rise * (accent ? 1.12 : 0.96 + Math.random() * 0.08);
        var g = ac.createGain();
        g.gain.value = vol * (accent ? 1.3 : 1);
        src.connect(g); g.connect(master);
        src.start(t); src.stop(t + 0.09);
        // drum body only on the pulse, so the roll keeps a beat without piling up nodes
        if (!withBody) return;
        var f0 = 132 * Math.pow(2.9, pr);          // 132Hz -> ~383Hz across the roll
        var osc = ac.createOscillator(), bg = ac.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f0 * 1.28, t);
        osc.frequency.exponentialRampToValueAtTime(f0, t + 0.03);
        bg.gain.setValueAtTime(0.0001, t);
        bg.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol * 0.9), t + 0.003);
        bg.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
        osc.connect(bg); bg.connect(master);
        osc.start(t); osc.stop(t + 0.09);
    }
    function scheduleRoll() {
        var ac = ensureAudio();
        if (!ac || !soundOn) { stopRoll(); return; }
        var horizon = ac.currentTime + 0.28, n = 0, age, pr, inten, gap;
        while (rollNext < horizon && n < 26) {
            age = rollNext - rollT0;
            pr = rollSpan > 0 ? Math.min(1, age / rollSpan) : Math.min(1, age / 3);
            inten = 0.55 + 0.45 * pr;                           // crescendo
            snareHit(rollNext, 0.05 * inten, rollBeat % 2 === 0, rollBeat % 4 === 0, pr);
            gap = Math.max(0.024, 0.052 - 0.028 * pr);          // ~19/s -> ~42/s buzz
            rollNext += gap + Math.random() * 0.003;
            rollBeat++;
            n++;
        }
    }
    function startRoll(span) {
        var ac = ensureAudio();
        if (!ac) return;
        stopRoll();
        ensureSnare(ac);
        rollSpan = span || 0;
        rollT0 = ac.currentTime;
        rollNext = ac.currentTime + 0.02;
        rollBeat = 0;
        scheduleRoll();
        rollTimer = setInterval(scheduleRoll, 120);
    }
    function stopRoll() {

    // One note per seat, always a new pitch, climbing D4 -> A6 across the whole run.
    function sfxLock(i, steps) {
        var pos = steps > 0 ? (i / steps) : 1;
        var f = 294 * Math.pow(2, (pos * 31) / 12);
        tone(f, f * 1.004, 0.17, 'triangle', 0.12);
        noiseBurst(0.05, 0.04, 2600, 1500, 2);
    }

    // ---- 띵! the bell on the final seat, sitting above the top of the ladder ----
    function sfxFinal() {
        var ac = ensureAudio();
        if (!ac) return;
        var t0 = ac.currentTime, f = 2093;
        var partials = [[1, 0.17, 1.9], [2.0, 0.075, 1.5], [2.76, 0.04, 1.05], [5.4, 0.016, 0.6]];
        var i, osc, g;
        for (i = 0; i < partials.length; i++) {
            osc = ac.createOscillator(); g = ac.createGain();
            osc.type = 'sine';
            osc.frequency.value = f * partials[i][0];
            g.gain.setValueAtTime(0.0001, t0);
            g.gain.exponentialRampToValueAtTime(partials[i][1], t0 + 0.005);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + partials[i][2]);
            osc.connect(g); g.connect(master);
            osc.start(t0); osc.stop(t0 + partials[i][2] + 0.05);
        }
        tone(261.6, 261.6, 1.0, 'sine', 0.075);
        noiseBurst(0.2, 0.085, 6000, 1800, 0.9);
    }

    function renderSeatBoardHtml(id, opts) {
        var mini = !!opts.mini;
        var html = '<div class="seatBoard' + (mini ? ' mini' : '') + '" id="' + id + '">';
        var ro = displayRowOrder();
        var ri, r, di, si, desks, dk, c, cellClass, cellLabel, enabled, extra;
        for (ri = 0; ri < ro.length; ri++) {
            r = ro[ri];
            desks = rowDesks(r);
            html += '<div class="seatRow">';
            for (di = 0; di < desks.length; di++) {
                dk = desks[di];
                html += '<span class="deskGrp' + (dk.triple ? ' desk3' : '') + '">';
                for (si = 0; si < dk.seats.length; si++) {
                    c = dk.seats[si];
                    enabled = enabledSeats[r] && enabledSeats[r][c];
                    cellClass = 'seatCell' + (mini ? ' miniCell' : '');
                    cellLabel = '';
                    extra = '';

                    if (opts.mode === 'static') {
                        cellClass += ' static';
                        if (!enabled) cellClass += ' disabled';
                    } else if (opts.mode === 'seatuse') {
                        if (!enabled) cellClass += ' disabled';
                    } else if (opts.mode === 'allowed') {
                        if (!enabled) {
                            cellClass += ' disabled';
                        } else {
                            var al = (conditions[opts.num] && conditions[opts.num].allowedSeats) || [];
                            var isAl = false, k;
                            for (k = 0; k < al.length; k++) if (al[k].r === r && al[k].c === c) { isAl = true; break; }
                            if (isAl) cellClass += ' allowed';
                        }
                    } else if (opts.mode === 'place') {
                        if (!enabled) {
                            cellClass += ' disabled';
                        } else {
                            var sn = currentSeats[r][c];
                            if (sn != null) {
                                cellClass += ' filled' + genderTag((students[sn] || {}).gender || 'M');
                                cellLabel = twoLineLabel(sn);
                                if (selectedSeatRC && selectedSeatRC.r === r && selectedSeatRC.c === c) cellClass += ' selected';
                            }
                            extra = ' draggable="true"';
                        }
                    } else if (opts.mode === 'view') {
                        if (!enabled) {
                            cellClass += ' disabled';
                        } else {
                            var src = opts.useCurrent ? currentSeats : newSeats;
                            var vn = src[r][c];
                            if (vn != null) {
                                cellClass += ' filled' + genderTag((students[vn] || {}).gender || 'M');
                                cellLabel = twoLineLabel(vn);
                                if (viewSelectedRC && viewSelectedRC.r === r && viewSelectedRC.c === c) cellClass += ' selected';
                            }
                        }
                    }
                    html += '<button class="' + cellClass + '" data-r="' + r + '" data-c="' + c + '"' + extra + '>' + cellLabel + '</button>';
                }
                html += '</span>';
                if (di < desks.length - 1) html += '<span class="deskGap"></span>';
            }
            html += '</div>';
        }
        html += '</div>';
        return html;

    // Walk up to the seat button that was hit, so one listener covers the whole board.
    function cellFrom(root, node) {

    // Redraw only the preview so typing never loses focus. Preview is display-only.
    function refreshPreview() {
        var wrap = document.getElementById('previewWrap');
        if (!wrap) return;
        var rEl = document.getElementById('rowsInput'), cEl = document.getElementById('colsInput');
        if (rEl && cEl) {
            var rv = trim(rEl.value), cv = trim(cEl.value);
            if (/^\d+$/.test(rv) && /^\d+$/.test(cv)) {
                var nr = parseInt(rv, 10), nc = parseInt(cv, 10);
                if (nr >= 1 && nr <= 20 && nc >= 1 && nc <= 20 && (nr !== rows || nc !== cols)) resizeGrids(nr, nc);
            }
        }
        wrap.innerHTML = renderSeatBoardHtml('previewBoard', { mode: 'static', mini: true }) +
            '<div class="previewCap">미리 보기</div>';
    }
    function resizeGrids(nr, nc) {
        var oldE = enabledSeats, oldC = currentSeats, oldN = newSeats;
        var oldRows = rows, oldCols = cols, r, c;
        rows = nr; cols = nc;
        enabledSeats = emptyGrid(true);
        currentSeats = emptyGrid(null);
        newSeats = emptyGrid(null);
        for (r = 0; r < Math.min(rows, oldRows); r++) {
            for (c = 0; c < Math.min(cols, oldCols); c++) {
                enabledSeats[r][c] = oldE[r][c];
                currentSeats[r][c] = oldC[r][c];
                newSeats[r][c] = oldN[r][c];
            }

        sanitizeConditionsAgainstGrid();

    function commitSizeInputs(silent) {

        var nEl = document.getElementById('countInput');
        var aEl = document.getElementById('absentInput');
        var rv = trim(rEl.value), cv = trim(cEl.value), nv = trim(nEl.value), av = aEl.value;
        if (!/^\d+$/.test(rv) || !/^\d+$/.test(cv) || !/^\d+$/.test(nv)) {
            if (!silent) alert('행 수, 열 수, 끝번호는 숫자로 입력해 주세요.');
            return false;
        }
        var nr = parseInt(rv, 10), nc = parseInt(cv, 10), nn = parseInt(nv, 10);
        if (nr < 1 || nc < 1 || nn < 1) {
            if (!silent) alert('행 수, 열 수, 끝번호는 1 이상이어야 합니다.');
            return false;
        }
        if (nr > 20 || nc > 20 || nn > 200) {
            if (!silent) alert('행/열은 20 이하, 끝번호는 200 이하로 입력해 주세요.');
            return false;
        }
        var abs = parseAbsentList(av, nn);
        if (abs === null) {
            if (!silent) alert('결번은 끝번호 범위 안의 숫자를 쉼표로 구분해 입력해 주세요.');
            return false;
        }
        if (nr !== rows || nc !== cols) resizeGrids(nr, nc);
        studentCount = nn;
        absentNumbers = abs;
        syncRoster();
        return true;
    }

        var body = app.querySelector('.stable tbody');

        body.onchange = function (ev) {
            var el = ev.target;
            if (!el.getAttribute || el.getAttribute('data-n') === null) return;
            var num = parseInt(el.getAttribute('data-n'), 10);
            if (el.checked) checkedRows[num] = true; else delete checkedRows[num];
        };
        body.onclick = function (ev) {
            var el = ev.target;
            while (el && el !== body && (!el.getAttribute || el.getAttribute('data-cond') === null)) el = el.parentNode;
            if (!el || el === body) return;
            condEditNum = parseInt(el.getAttribute('data-cond'), 10);
            ensureCondition(condEditNum);
            render();

            var on = this.checked, k;
            checkedRows = {};
            if (on) for (k = 1; k <= studentCount; k++) checkedRows[k] = true;
            render();
        };
        document.getElementById('addBtn').onclick = function () {
            if (studentCount >= 200) { alert('끝번호는 200까지 가능합니다.'); return; }
            studentCount++;
            checkedRows = {};
            syncRoster();
            render();
        };
        document.getElementById('delBtn').onclick = function () {
            var k, num, any = false;
            for (k in checkedRows) {
                if (!checkedRows.hasOwnProperty(k)) continue;
                num = parseInt(k, 10);
                if (num < 1 || num > studentCount) continue;
                if (!isAbsent(num)) { absentNumbers.push(num); any = true; }
                removeStudentFromGrids(num);
            }
            if (!any) { alert('삭제할 학생을 먼저 선택해 주세요.'); return; }
            absentNumbers.sort(function (a, b) { return a - b; });
            while (studentCount > 0 && isAbsent(studentCount)) {
                var ti = absentNumbers.indexOf(studentCount);
                if (ti >= 0) absentNumbers.splice(ti, 1);
                delete students[studentCount];
                delete conditions[studentCount];
                studentCount--;
            }
            checkedRows = {};
            syncRoster();
            render();

    // ====== VIEW: 학생 관리 > 수정 ======
    // Same table as 보기, but every field is editable in place.
    function renderStudentEdit(app) {
        var html = '';
        html += '<div class="panel narrow">';

        html += '<th class="colNum">번호</th><th>이름</th><th class="colGen">성별</th><th class="colCond">조건</th>';
        html += '</tr></thead><tbody>';
        var n, sObj, absent;
        for (n = 1; n <= studentCount; n++) {
            absent = isAbsent(n);
            sObj = students[n] || { name: '', gender: 'M' };
            html += '<tr class="' + (absent ? 'absentRow' : '') + '">';
            html += '<td class="colChk"><input type="checkbox" data-abs="' + n + '"' + (absent ? ' checked' : '') + '></td>';
            html += '<td class="colNum">' + n + '</td>';
            html += '<td><input class="cellInput" type="text" maxlength="20" data-name="' + n + '" value="' +
                escapeHtml(sObj.name || '') + '" placeholder="이름"' + (absent ? ' disabled' : '') + '></td>';
            html += '<td class="colGen"><button class="genBtn' + (sObj.gender === 'F' ? ' f' : '') + '" data-gen="' + n + '"' +
                (absent ? ' disabled' : '') + '>' + (sObj.gender === 'F' ? '여' : '남') + '</button></td>';

                html += '<td class="colCond">-</td>';

                html += '<td class="colCond"><button class="btn tiny ' + (hasAnyCondition(n) ? 'orange' : 'primary') +

        html += '</tbody></table></div>';

        var body = app.querySelector('.stable tbody');

        body.oninput = function (ev) {
            var el = ev.target;
            if (!el.getAttribute || el.getAttribute('data-name') === null) return;
            var num = parseInt(el.getAttribute('data-name'), 10);
            if (!students[num]) students[num] = { name: '', gender: 'M' };
            students[num].name = trim(el.value);
        };
        body.onkeydown = function (ev) {
            if (ev.keyCode !== 13) return;
            var el = ev.target;
            if (!el.getAttribute || el.getAttribute('data-name') === null) return;
            ev.preventDefault();
            focusNameField(parseInt(el.getAttribute('data-name'), 10), ev.shiftKey ? -1 : 1);
        };
        body.onchange = function (ev) {
            var el = ev.target;
            if (!el.getAttribute || el.getAttribute('data-abs') === null) return;
            var num = parseInt(el.getAttribute('data-abs'), 10);
            commitEditInputs();
            if (el.checked) {
                if (!isAbsent(num)) {
                    absentNumbers.push(num);
                    absentNumbers.sort(function (a, b) { return a - b; });
                }
                removeStudentFromGrids(num);
            } else {
                var idx = absentNumbers.indexOf(num);
                if (idx >= 0) absentNumbers.splice(idx, 1);
            }
            syncRoster();
            render();
        };
        body.onclick = function (ev) {
            var el = ev.target;
            while (el && el !== body) {
                if (el.getAttribute && el.getAttribute('data-gen') !== null) {
                    var gn = parseInt(el.getAttribute('data-gen'), 10);
                    if (!students[gn]) students[gn] = { name: '', gender: 'M' };

                    students[gn].gender = next;
                    el.className = 'genBtn' + (next === 'F' ? ' f' : '');
                    el.innerHTML = next === 'F' ? '여' : '남';
                    return;
                }
                if (el.getAttribute && el.getAttribute('data-cond') !== null) {
                    commitEditInputs();
                    condEditNum = parseInt(el.getAttribute('data-cond'), 10);
                    ensureCondition(condEditNum);
                    render();
                    return;
                }
                el = el.parentNode;
            }
        };
        document.getElementById('doneStu').onclick = function () {
            commitEditInputs(); view = 'students.list'; render();
        };
        focusNameField(0, 1);
    }

    // Move the caret to the next/previous editable name field.
    function focusNameField(fromNum, dir) {
        var n = fromNum + dir, el;
        while (n >= 1 && n <= studentCount) {
            el = document.querySelector('[data-name="' + n + '"]');
            if (el && !el.disabled) {
                el.focus();
                try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {}
                return true;
            }
            n += dir;
        }
        return false;
    }

    // Pull whatever is typed in the edit table back into state. Safe to call anywhere.
    function commitEditInputs() {
        var els = document.querySelectorAll('[data-name]'), i, num;
        for (i = 0; i < els.length; i++) {
            if (els[i].disabled) continue;
            num = parseInt(els[i].getAttribute('data-name'), 10);
            if (!students[num]) students[num] = { name: '', gender: 'M' };
            students[num].name = trim(els[i].value);
        }
    }

            var found = -1, k;
            for (k = 0; k < c.allowedSeats.length; k++) {
                if (c.allowedSeats[k].r === r && c.allowedSeats[k].c === cc) { found = k; break; }

            else c.allowedSeats.push({ r: r, c: cc });

    function renderBankHtml() {
        var placed = {}, r, c, i, num, html = '', any = false;
        for (r = 0; r < rows; r++) for (c = 0; c < NC(); c++) {

                escapeHtml(getStudentShort(num)) + '</button>';

    function attachBankInteractions() {
        var bank = document.getElementById('bank');
        if (!bank) return;
        function slotFrom(node) {
            while (node && node !== bank) {
                if (node.getAttribute && node.getAttribute('data-bn') !== null) return node;
                node = node.parentNode;
            }
            return null;
        }
        bank.onclick = function (ev) {
            var el = slotFrom(ev.target);
            if (!el) return;
            var num = parseInt(el.getAttribute('data-bn'), 10);
            selectedSeatRC = null;
            selectedBankNum = (selectedBankNum === num) ? null : num;
            render();
        };
        bank.ondragstart = function (ev) {
            var el = slotFrom(ev.target);
            if (!el) return;
            dragSource = { kind: 'bank', num: parseInt(el.getAttribute('data-bn'), 10) };
            if (ev.dataTransfer) {
                ev.dataTransfer.effectAllowed = 'move';
                ev.dataTransfer.setData('text/plain', String(dragSource.num));
            }
        };
        bank.ondragend = function () { dragSource = null; };
        bank.ondragover = function (ev) { ev.preventDefault(); };
        bank.ondrop = function (ev) {
            ev.preventDefault();
            if (dragSource && dragSource.kind === 'seat') {
                currentSeats[dragSource.r][dragSource.c] = null;
                dragSource = null;
                render();
            }
        };
    }

    function attachPlaceInteractions() {
        var board = document.getElementById('mainBoard');
        if (!board) return;
        var hot = null;
        function rc(node) {
            var el = cellFrom(board, node);
            if (!el) return null;
            return { el: el, r: parseInt(el.getAttribute('data-r'), 10), c: parseInt(el.getAttribute('data-c'), 10) };
        }
        board.onclick = function (ev) {
            var t = rc(ev.target);
            if (t) handlePlaceClick(t.r, t.c);
        };
        board.ondragstart = function (ev) {
            var t = rc(ev.target);
            if (!t || currentSeats[t.r][t.c] == null) { ev.preventDefault(); return; }
            dragSource = { kind: 'seat', num: currentSeats[t.r][t.c], r: t.r, c: t.c };
            if (ev.dataTransfer) {
                ev.dataTransfer.effectAllowed = 'move';
                ev.dataTransfer.setData('text/plain', String(dragSource.num));
            }
        };
        board.ondragend = function () {
            dragSource = null;
            if (hot) { hot.className = hot.className.replace(/ dropTarget/g, ''); hot = null; }
        };
        board.ondragover = function (ev) {
            var t = rc(ev.target);
            if (!t || !enabledSeats[t.r][t.c]) return;
            ev.preventDefault();
            if (hot !== t.el) {
                if (hot) hot.className = hot.className.replace(/ dropTarget/g, '');
                hot = t.el;
                hot.className += ' dropTarget';
            }
        };
        board.ondragleave = function (ev) {
            if (hot && !cellFrom(board, ev.relatedTarget)) {
                hot.className = hot.className.replace(/ dropTarget/g, '');
                hot = null;
            }
        };
        board.ondrop = function (ev) {
            ev.preventDefault();
            if (hot) { hot.className = hot.className.replace(/ dropTarget/g, ''); hot = null; }
            var t = rc(ev.target);
            if (!t || !dragSource || !enabledSeats[t.r][t.c]) return;
            if (dragSource.kind === 'bank') {
                currentSeats[t.r][t.c] = dragSource.num;
            } else {
                var prev = currentSeats[t.r][t.c];
                currentSeats[t.r][t.c] = dragSource.num;
                currentSeats[dragSource.r][dragSource.c] = prev;
            }
            dragSource = null;
            selectedBankNum = null; selectedSeatRC = null;
            render();
        };
    }

    function handlePlaceClick(r, c) {
        if (!enabledSeats[r][c]) return;
        if (selectedBankNum != null) {
            currentSeats[r][c] = selectedBankNum;
            selectedBankNum = null; selectedSeatRC = null;
            render(); return;
        }
        if (selectedSeatRC) {
            var sr = selectedSeatRC.r, sc = selectedSeatRC.c;
            if (sr === r && sc === c) { selectedSeatRC = null; render(); return; }
            var t = currentSeats[r][c];
            currentSeats[r][c] = currentSeats[sr][sc];
            currentSeats[sr][sc] = t;
            selectedSeatRC = null; render(); return;
        }
        if (currentSeats[r][c] != null) { selectedSeatRC = { r: r, c: c }; render(); }
    }

                    newSeats[sr][sc] = t;

    // ====== ARRANGEMENT ======
    function doArrangement(fancy) {
        if (revealing) return;
        if (participants.length === 0) { alert('학생이 없습니다.'); return; }
        if (countEnabled() < participants.length) {
            alert('사용 가능한 자리가 인원수보다 적습니다.');
            return;
        }
        if (applyConditions) {
            var i, num, c, partner;
            for (i = 0; i < participants.length; i++) {
                num = participants[i];
                c = conditions[num];
                if (c && c.mustPairWith != null) {
                    partner = c.mustPairWith;
                    if (participants.indexOf(partner) < 0) { alert('조건에 오류 발생: 조건을 모두 완성할 수 없습니다'); return; }
                    if (conditions[partner] && conditions[partner].mustPairWith != null && conditions[partner].mustPairWith !== num) {
                        alert('조건에 오류 발생: 조건을 모두 완성할 수 없습니다'); return;
                    }
                    ensureCondition(partner).mustPairWith = num;
                }
            }
        }
        var attempts = 0, result = null;
        while (attempts < 14 && !result) { result = runBacktrackSolver(); attempts++; }
        if (!result) { alert('조건에 오류 발생: 조건을 모두 완성할 수 없습니다'); return; }
        newSeats = result;
        viewSelectedRC = null;
        if (fancy) startReveal();
        else { hasResult = true; render(); }
    }

    // ====== SHIFT REVEAL ======
    function startReveal() {
        hasResult = true;
        revealing = true;
        render();
        var board = document.getElementById('mainBoard');
        if (!board) { revealing = false; render(); return; }

        var targets = [], r, c, el;
        for (r = 0; r < rows; r++) for (c = 0; c < NC(); c++) {
            if (newSeats[r][c] == null) continue;
            el = board.querySelector('[data-r="' + r + '"][data-c="' + c + '"]');
            if (el) targets.push({ el: el, num: newSeats[r][c] });
        }
        if (targets.length === 0) { revealing = false; render(); return; }
        shuffle(targets);

        var fx = document.getElementById('fx');
        var flash = document.createElement('div');
        flash.className = 'flash';
        fx.appendChild(flash);
        setTimeout(function () { if (flash.parentNode) flash.parentNode.removeChild(flash); }, 600);
        var sweep = document.createElement('div');
        sweep.className = 'sweep';
        board.appendChild(sweep);
        setTimeout(function () { if (sweep.parentNode) sweep.parentNode.removeChild(sweep); }, 1150);

        var pool = [], pi;
        for (pi = 0; pi < participants.length; pi++) {
            var ps = students[participants[pi]] || {};
            pool.push(ps.name ? ps.name : (participants[pi] + '번'));
        }

        // Build both spans up front and only ever write text into them, so neither the
        // spin ticks nor the lock have to re-parse HTML.
        var t, numSpan, nameSpan;
        for (t = 0; t < targets.length; t++) {
            targets[t].el.className = 'seatCell spinning';
            targets[t].el.innerHTML = '';
            numSpan = document.createElement('span');
            numSpan.className = 'cellNum';
            numSpan.style.display = 'none';
            nameSpan = document.createElement('span');
            nameSpan.className = 'cellName';
            targets[t].numTn = document.createTextNode('');
            targets[t].tn = document.createTextNode('');
            numSpan.appendChild(targets[t].numTn);
            nameSpan.appendChild(targets[t].tn);
            targets[t].el.appendChild(numSpan);
            targets[t].el.appendChild(nameSpan);
            targets[t].numSpan = numSpan;
            targets[t].tn.data = pool[(Math.random() * pool.length) | 0];
        }
        // one layout pass for the whole board; the cells do not move during the reveal
        for (t = 0; t < targets.length; t++) targets[t].rect = targets[t].el.getBoundingClientRect();
        var live = targets.slice(0);
        var spinner = setInterval(function () {
            var k;
            for (k = 0; k < live.length; k++) live[k].tn.data = pool[(Math.random() * pool.length) | 0];
        }, 55);

        // Work out the whole schedule first so the roll knows how long it has to climb.
        var n = targets.length;
        var base = n > 22 ? 105 : (n > 12 ? 150 : 200);
        var at = 330, sched = [], i2, gap;
        for (i2 = 0; i2 < n; i2++) {
            sched.push(at);
            gap = Math.max(42, base * (0.28 + 1.9 * Math.pow((i2 + 1) / n, 2)));
            at += gap;
        }
        var delay = at;

        sfxStart();
        startRoll(sched[n - 1] / 1000);

        for (i2 = 0; i2 < n; i2++) {
            (function (item, when, idx, last) {
                revealTimers.push(setTimeout(function () {
                    item.done = true;
                    var li = live.indexOf(item);
                    if (li >= 0) live.splice(li, 1);
                    var st = students[item.num] || {};
                    var g = genderTag(st.gender || 'M');
                    var nm = st.name || '';
                    if (nm === '') {
                        item.numSpan.style.display = 'none';
                        item.tn.data = item.num + '번';
                    } else {
                        item.numTn.data = item.num;
                        item.numSpan.style.display = '';
                        item.tn.data = nm;
                    }
                    item.el.className = 'seatCell filled' + g + ' locked';
                    flareAt(item.el, item.rect);
                    sparkAt(item.el, g === 'F' ? '#f393bb' : '#8fbaff', last ? 10 : 2, item.rect);
                    if (last) { stopRoll(); sfxFinal(); } else sfxLock(idx, n - 2);
                }, when));
            })(targets[i2], sched[i2], i2, i2 === n - 1);
        }
        revealTimers.push(setTimeout(function () {
            clearInterval(spinner);
            stopRoll();
            clearRevealTimers();
            revealing = false;
            render();
        }, delay + 620));
    }

    // ====== SOLVER ======
    function runBacktrackSolver() {
        var order = buildPlacementOrder();
        var seats = emptyGrid(null);
        var stepsObj = { steps: 0, max: 200000 };
        var prev = collectPrevPairsAndSeats();
        var ok = backtrackPlace(order, 0, seats, stepsObj, prev);
        return ok ? seats : null;
    }
    function cond(num) {
        if (!applyConditions) return {};
        return conditions[num] || {};
    }
    function buildPlacementOrder() {
        var p = participants.slice(0);
        shuffle(p);
        var visited = {}, order = [], i, num, c;
        for (i = 0; i < p.length; i++) {
            num = p[i];
            if (visited[num]) continue;
            order.push(num); visited[num] = true;
            c = cond(num);
            if (c.mustPairWith != null && !visited[c.mustPairWith]) {
                order.push(c.mustPairWith);
                visited[c.mustPairWith] = true;
            }
        }
        return order;
    }
    function collectPrevPairsAndSeats() {
        var prevPairs = [], prevSeats = {}, r, c, mates, mi, a, b;
        for (r = 0; r < rows; r++) {
            for (c = 0; c < NC(); c++) {
                a = currentSeats[r][c];
                if (a == null) continue;
                if (!prevSeats[a]) prevSeats[a] = [];
                prevSeats[a].push({ r: r, c: c });
                mates = deskMates(r, c);
                for (mi = 0; mi < mates.length; mi++) {
                    if (mates[mi].c <= c) continue;          // count each pair once
                    b = currentSeats[mates[mi].r][mates[mi].c];
                    if (b != null) prevPairs.push([a < b ? a : b, a < b ? b : a]);
                }
            }
        }
        return { pairs: prevPairs, seats: prevSeats };
    }
    function backtrackPlace(order, idx, seats, stepsObj, prev) {
        stepsObj.steps++;
        if (stepsObj.steps > stepsObj.max) return false;
        if (idx >= order.length) return true;
        var num = order[idx];
        var cands = candidateSeatsFor(num, seats, prev);
        shuffle(cands);
        var i;
        for (i = 0; i < cands.length; i++) {
            var pos = cands[i];
            seats[pos.r][pos.c] = num;
            if (checkPlacementConstraints(num, pos, seats, prev)) {
                if (backtrackPlace(order, idx + 1, seats, stepsObj, prev)) return true;
            }
            seats[pos.r][pos.c] = null;
            if (stepsObj.steps > stepsObj.max) return false;
        }
        return false;
    }
    function candidateSeatsFor(num, seats, prev) {
        var c = cond(num);
        var locked = c.mustPairWith != null;
        var cands = [];
        var partnerPos = locked ? findStudentInGrid(seats, c.mustPairWith) : null;
        if (partnerPos) {
            var pm = deskMates(partnerPos.r, partnerPos.c), q;
            for (q = 0; q < pm.length; q++) {
                if (!enabledSeats[pm[q].r][pm[q].c]) continue;
                if (seats[pm[q].r][pm[q].c] != null) continue;
                if (!seatPassesPlacementFilters(num, pm[q], prev, true)) continue;
                cands.push(pm[q]);
            }
            return cands;
        }
        var r, cc;
        for (r = 0; r < rows; r++) {
            for (cc = 0; cc < NC(); cc++) {
                if (!enabledSeats[r][cc]) continue;
                if (seats[r][cc] != null) continue;
                if (!seatPassesPlacementFilters(num, { r: r, c: cc }, prev, locked)) continue;
                if (locked) {
                    var mm = deskMates(r, cc), free = false, z;
                    for (z = 0; z < mm.length; z++) {
                        if (enabledSeats[mm[z].r][mm[z].c] && seats[mm[z].r][mm[z].c] == null) { free = true; break; }
                    }
                    if (!free) continue;
                }
                cands.push({ r: r, c: cc });
            }
        }
        return cands;
    }
    function seatPassesPlacementFilters(num, pos, prev, ignoreAllowed) {
        var c = cond(num);
        if (!ignoreAllowed && c.allowedSeats && c.allowedSeats.length > 0 && c.mustPairWith == null) {
            var ok = false, k;
            for (k = 0; k < c.allowedSeats.length; k++) {
                if (c.allowedSeats[k].r === pos.r && c.allowedSeats[k].c === pos.c) { ok = true; break; }
            }
            if (!ok) return false;
        }
        if (randomOptions.noSameSeat && prev.seats[num]) {
            var i;
            for (i = 0; i < prev.seats[num].length; i++) {
                if (prev.seats[num][i].r === pos.r && prev.seats[num][i].c === pos.c) return false;
            }
        }
        return true;
    }
    function checkPlacementConstraints(num, pos, seats, prev) {
        var mates = deskMates(pos.r, pos.c), mi, partner, c1 = cond(num), c2, i;
        var forced = c1.mustPairWith, forcedSeen = false, freeLeft = 0;
        for (mi = 0; mi < mates.length; mi++) {
            if (!enabledSeats[mates[mi].r][mates[mi].c]) continue;
            partner = seats[mates[mi].r][mates[mi].c];
            if (partner == null) { freeLeft++; continue; }
            c2 = cond(partner);
            if (forced != null && forced === partner) forcedSeen = true;
            if (c2.mustPairWith != null && c2.mustPairWith !== num) {
                // a 3-seat desk may still satisfy the partner elsewhere on this desk
                if (!deskHolds(seats, pos.r, pos.c, c2.mustPairWith)) return false;
            }
            if (c1.mustPairWith == null && c1.pairGender) {
                if ((students[partner] ? students[partner].gender : 'M') !== c1.pairGender) return false;
            }
            if (c2.mustPairWith == null && c2.pairGender) {
                if ((students[num] ? students[num].gender : 'M') !== c2.pairGender) return false;
            }
            if (randomOptions.noSamePair) {
                var lo = num < partner ? num : partner, hi = num < partner ? partner : num;
                for (i = 0; i < prev.pairs.length; i++) {
                    if (prev.pairs[i][0] === lo && prev.pairs[i][1] === hi) return false;
                }
            }
        }
        // a forced pair must end up on this desk: either already here, or a seat still open
        if (forced != null && !forcedSeen && freeLeft === 0) return false;
        return true;
    }
    // is `num` sitting anywhere on the desk that contains (r,c)?
    function deskHolds(seats, r, c, num) {
        var sc = deskSeatCols(r, deskStartOf(r, c)), k;
        for (k = 0; k < sc.length; k++) if (seats[r][sc[k]] === num) return true;
        return false;
    }
    function findStudentInGrid(grid, num) {
        var r, c;
        for (r = 0; r < rows; r++) for (c = 0; c < NC(); c++) if (grid[r][c] === num) return { r: r, c: c };
        return null;
    }


    // ====== SHEET MODEL ======
    // Cell metrics are shared by the DOM editor and the canvas exporter so what you
    // arrange on screen is exactly what lands in the PNG/JPG/PDF.
    var S_CELL_W = 78, S_CELL_H = 54, S_CELL_GAP = 7, S_DESK_GAP = 18, S_PAD = 14;
    var A4_LONG = 1000, A4_SHORT = 707;          // 1 : 1.414

    function applyPaper() {
        var port = (sheet && sheet.paper === 'port');
        SHEET_W = port ? A4_SHORT : A4_LONG;
        SHEET_H = port ? A4_LONG : A4_SHORT;
    }
    function rotOf() {
        if (!sheet) return 0;
        return { bottom: 0, left: 90, top: 180, right: 270 }[sheet.deskSide] || 0;
    }

    // Unrotated grid: cells laid out row by row, desks separated by a wider gap.
    function boardBaseCells() {
        var list = [], ro = displayRowOrder();
        var ri, r, di, si, desks, dk, x, y, maxW = 0, deskW, cw, c;
        var src = hasResult ? newSeats : currentSeats;
        for (ri = 0; ri < ro.length; ri++) {
            r = ro[ri];
            desks = rowDesks(r);
            y = S_PAD + ri * (S_CELL_H + S_CELL_GAP);
            x = S_PAD;
            for (di = 0; di < desks.length; di++) {
                dk = desks[di];
                // a desk is always two seats wide, however many people sit at it
                deskW = 2 * S_CELL_W + S_CELL_GAP;
                if (dk.seats.length === 1) deskW = S_CELL_W;
                cw = (deskW - (dk.seats.length - 1) * S_CELL_GAP) / dk.seats.length;
                for (si = 0; si < dk.seats.length; si++) {
                    c = dk.seats[si];
                    list.push({
                        x: x, y: y, w: cw, h: S_CELL_H,
                        on: !!(enabledSeats[r] && enabledSeats[r][c]),
                        num: src[r] ? src[r][c] : null
                    });
                    x += cw;
                    if (si < dk.seats.length - 1) x += S_CELL_GAP;
                }
                if (di < desks.length - 1) x += S_DESK_GAP;
            }
            if (x + S_PAD > maxW) maxW = x + S_PAD;
        }
        return {
            list: list,
            w: maxW,
            h: rows * S_CELL_H + (rows - 1) * S_CELL_GAP + S_PAD * 2
        };
    }
    // Turning the teacher's desk turns the whole room with it.
    function boardCells() {
        var b = boardBaseCells(), deg = rotOf();
        if (deg === 0) return b;
        var out = [], i, e, nx, ny, nw, nh;
        for (i = 0; i < b.list.length; i++) {
            e = b.list[i];
            if (deg === 90)       { nx = b.h - e.y - e.h; ny = e.x;              nw = e.h; nh = e.w; }
            else if (deg === 180) { nx = b.w - e.x - e.w; ny = b.h - e.y - e.h;  nw = e.w; nh = e.h; }
            else                  { nx = e.y;             ny = b.w - e.x - e.w;  nw = e.h; nh = e.w; }
            out.push({ x: nx, y: ny, w: nw, h: nh, on: e.on, num: e.num });
        }
        return {
            list: out,
            w: (deg === 180) ? b.w : b.h,
            h: (deg === 180) ? b.h : b.w
        };
    }
    function boardPixelSize() { var b = boardCells(); return { w: b.w, h: b.h }; }
