    // size / content controls for whatever is selected
    function renderInspector() {
        var h = '';
        if (!selEl) {
            h += '<span class="hintdim">요소를 클릭하면 크기와 내용을 바꿀 수 있습니다</span>';
            return h;
        }
        if (selEl.kind === 'board') {
            h += '<label class="checkline">자리 글씨' +
                 '<input id="sizeInput" class="numbox" type="number" min="8" max="40" value="' + sheet.cellFont + '"></label>';
        } else {
            h += '<label class="checkline">글씨 크기' +
                 '<input id="sizeInput" class="numbox" type="number" min="8" max="90" value="' + (selEl.size || 18) + '"></label>';
        }
        if (selEl.kind === 'text') {
            h += '<label class="checkline">내용' +
                 '<input id="textInput" class="txtbox" type="text" maxlength="80" value="' + escapeHtml(selEl.text || '') + '"></label>';
            if (!selEl.locked) h += '<button id="delElBtn" class="btn tiny red">삭제</button>';
        }
        return h;
    }
    function bindInspector() {
        var sz = document.getElementById('sizeInput');
        if (sz) {
            sz.oninput = function () {
                var v = parseInt(sz.value, 10);
                if (!v || v < 8) return;
                if (selEl.kind === 'board') sheet.cellFont = v; else selEl.size = v;
                repaintSheet();
            };
        }
        var tx = document.getElementById('textInput');
        if (tx) {
            tx.oninput = function () { selEl.text = tx.value; repaintSheet(); };
            if (selEl && selEl.justAdded) {
                delete selEl.justAdded;
                tx.focus();
                tx.select();
            }
        }
        var del = document.getElementById('delElBtn');
        if (del) {
            del.onclick = function () {
                var i;
                for (i = 0; i < sheet.els.length; i++) if (sheet.els[i] === selEl) { sheet.els.splice(i, 1); break; }
                selEl = null;
                render();
            };
        }
    }
    // redraw only the page, so the inspector inputs keep focus while typing
    function repaintSheet() {
        var outer = document.getElementById('sheetOuter');
        if (!outer) return;
        outer.innerHTML = renderSheetInner(THEMES[sheet.theme] || THEMES.dark);
        bindSheetDrag();
    }

    function toolBtn(id, title, svg) {
        return '<button class="toolBtn' + (printTool === id ? ' active' : '') +
            '" data-tool="' + id + '" title="' + title + '">' + svg + '</button>';
    }
    function bindPrintTools() {
        var els = document.querySelectorAll('[data-tool]'), i;
        for (i = 0; i < els.length; i++) {
            (function (el) {
                el.onclick = function () {
                    var t = el.getAttribute('data-tool');
                    if (t === 'desk') { rotateDesk(); return; }
                    if (t === 'style') { cycleTheme(); return; }
                    if (t === 'paper') { togglePaper(); return; }
                    printTool = t;
                    render();
                };
            })(els[i]);
        }
    }
    function rotateDesk() {
        var order = ['bottom', 'left', 'top', 'right'];
        var i = order.indexOf(sheet.deskSide);
        sheet.deskSide = order[(i + 1) % order.length];
        reflowSheet();
        render();
    }
    function togglePaper() {
        sheet.paper = (sheet.paper === 'port') ? 'land' : 'port';
        applyPaper();
        reflowSheet();
        render();
    }
    // re-centre the board and park the desk on its side
    function reflowSheet() {
        var board = elById('board'), desk = elById('desk'), bs = boardPixelSize();
        if (!board || !desk) return;
        board.x = Math.round((SHEET_W - bs.w) / 2);
        board.y = Math.round((SHEET_H - bs.h) / 2) - 10;
        var vert = (sheet.deskSide === 'left' || sheet.deskSide === 'right');
        desk.w = vert ? 44 : 150;
        desk.h = vert ? 150 : 44;
        if (sheet.deskSide === 'bottom') { desk.x = board.x + bs.w / 2 - desk.w / 2; desk.y = board.y + bs.h + 26; }
        else if (sheet.deskSide === 'top') { desk.x = board.x + bs.w / 2 - desk.w / 2; desk.y = board.y - 70; }
        else if (sheet.deskSide === 'left') { desk.x = board.x - 70; desk.y = board.y + bs.h / 2 - desk.h / 2; }
        else { desk.x = board.x + bs.w + 26; desk.y = board.y + bs.h / 2 - desk.h / 2; }
        desk.x = Math.round(desk.x); desk.y = Math.round(desk.y);
        var t = elById('title');
        if (t) t.x = Math.round((SHEET_W - t.w) / 2);
        var f = elById('foot'), mk = elById('mark');
        if (f) { f.x = 42; f.y = SHEET_H - 54; }
        if (mk) { mk.x = SHEET_W - 92; mk.y = SHEET_H - 56; }
    }
    function cycleTheme() {
        var i = THEME_ORDER.indexOf(sheet.theme);
        sheet.theme = THEME_ORDER[(i + 1) % THEME_ORDER.length];
        render();
    }

    // ---- DOM rendering of the sheet (mirrors the canvas exporter) ----
    function renderSheetInner(th) {
        var b = boardCells();
        var h = '<div class="sheetPage" id="sheetPage" style="width:' + SHEET_W + 'px;height:' + SHEET_H +
                'px;background:' + th.bg + ';">';
        var i, e, k, cell, lab, col, txt, sel, vert;
        for (i = 0; i < sheet.els.length; i++) {
            e = sheet.els[i];
            sel = (selEl === e) ? ' selEl' : (e.locked ? '' : ' guide');
            if (e.kind === 'title') {
                h += '<div class="sEl sTitle' + sel + '" data-el="' + e.id + '" style="left:' + e.x + 'px;top:' + e.y +
                    'px;width:' + e.w + 'px;font-size:' + e.size + 'px;color:' + th.text + ';">' +
                    escapeHtml(sheetTitleText()) + '</div>';
            } else if (e.kind === 'desk') {
                vert = (sheet.deskSide === 'left' || sheet.deskSide === 'right');
                h += '<div class="sEl sDesk' + sel + '" data-el="' + e.id + '" style="left:' + e.x + 'px;top:' + e.y +
                    'px;width:' + (e.w || 150) + 'px;height:' + (e.h || 44) + 'px;font-size:' + e.size +
                    'px;color:' + th.text + ';">' +
                    '<span' + (vert ? ' class="vtext"' : '') + '>교탁</span></div>';
            } else if (e.kind === 'board') {
                h += '<div class="sEl sBoard' + sel + '" data-el="' + e.id + '" style="left:' + e.x + 'px;top:' + e.y +
                    'px;width:' + b.w + 'px;height:' + b.h + 'px;background:' + th.panel +
                    ';border-color:' + (sheet.theme === 'paper' ? th.line : 'transparent') + ';">';
                for (k = 0; k < b.list.length; k++) {
                    cell = b.list[k];
                    if (!cell.on) continue;
                    lab = seatLabel(cell.num);
                    if (cell.num == null) { col = th.off; txt = th.sub; }
                    else if (sheet.theme === 'paper') { col = '#ffffff'; txt = '#000000'; }
                    else { col = ((students[cell.num] || {}).gender === 'F') ? th.f : th.m; txt = '#ffffff'; }
                    h += '<div class="sCell" style="left:' + cell.x + 'px;top:' + cell.y + 'px;width:' + cell.w +
                        'px;height:' + cell.h + 'px;background:' + col + ';color:' + txt +
                        ';font-size:' + sheet.cellFont + 'px;border-color:' +
                        (sheet.theme === 'paper' ? th.line : 'transparent') + ';">' + escapeHtml(lab) + '</div>';
                }
                h += '</div>';
            } else {
                if (!e.text) continue;
                h += '<div class="sEl sText' + sel + '" data-el="' + e.id + '" style="left:' + e.x + 'px;top:' + e.y +
                    'px;font-size:' + e.size + 'px;color:' + faintColor(th) +
                    ';opacity:' + (e.faint ? '.62' : '1') + ';">' + escapeHtml(e.text) + '</div>';
            }
        }
        h += '</div>';
        return h;
    }

    // ---- drag / add-text on the sheet ----
    var sheetDrag = null;
    function markSelection() {
        var page = document.getElementById('sheetPage');
        if (!page) return;
        var els = page.querySelectorAll('[data-el]'), i, el, id, on, cn;
        for (i = 0; i < els.length; i++) {
            el = els[i];
            id = el.getAttribute('data-el');
            on = !!(selEl && selEl.id === id);
            cn = el.className.replace(/ ?selEl/g, '');
            el.className = on ? cn + ' selEl' : cn;
        }
    }
    function fitSheet() {
        var outer = document.getElementById('sheetOuter');
        var page = document.getElementById('sheetPage');
        if (!outer || !page) return;
        var sc = outer.clientWidth / SHEET_W;
        page.style.transform = 'scale(' + sc + ')';
        outer.style.height = Math.round(SHEET_H * sc) + 'px';
    }
    function bindSheetDrag() {
        var page = document.getElementById('sheetPage');
        if (!page) return;
        fitSheet();
        function scaleOf() { return page.getBoundingClientRect().width / SHEET_W; }
        page.onmousedown = function (ev) {
            var node = ev.target, id = null;
            while (node && node !== page) {
                if (node.getAttribute && node.getAttribute('data-el')) { id = node.getAttribute('data-el'); break; }
                node = node.parentNode;
            }
            if (printTool === 'text') {
                var box = page.getBoundingClientRect(), sc = scaleOf();
                var nx = Math.round((ev.clientX - box.left) / sc);
                var ny = Math.round((ev.clientY - box.top) / sc);
                var el = { id: 'u' + Date.now(), kind: 'text', x: nx, y: ny, text: '새 텍스트', size: 18, justAdded: true };
                sheet.els.push(el);
                selEl = el;
                printTool = 'move';
                render();
                return;
            }
            if (!id) { selEl = null; render(); return; }
            var e = elById(id);
            if (!e) return;
            ev.preventDefault();
            var reselect = (selEl !== e);
            selEl = e;
            markSelection();
            sheetDrag = { e: e, sx: ev.clientX, sy: ev.clientY, ox: e.x, oy: e.y,
                          sc: scaleOf(), node: document.querySelector('[data-el="' + id + '"]'),
                          moved: false, reselect: reselect };
        };
    }
    document.addEventListener('mousemove', function (ev) {
        if (!sheetDrag) return;
        var dx = (ev.clientX - sheetDrag.sx) / sheetDrag.sc;
        var dy = (ev.clientY - sheetDrag.sy) / sheetDrag.sc;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) sheetDrag.moved = true;
        sheetDrag.e.x = Math.round(sheetDrag.ox + dx);
        sheetDrag.e.y = Math.round(sheetDrag.oy + dy);
        if (sheetDrag.node) {
            sheetDrag.node.style.left = sheetDrag.e.x + 'px';
            sheetDrag.node.style.top = sheetDrag.e.y + 'px';
        }
    });
    document.addEventListener('mouseup', function () {
        if (!sheetDrag) return;
        var need = sheetDrag.moved || sheetDrag.reselect;
        sheetDrag = null;
        if (need) render();
    });

    // ====== CANVAS RENDER (single source of truth for PNG / JPG / PDF) ======
    function roundRect(g, x, y, w, h, r) {
        g.beginPath();
        g.moveTo(x + r, y);
        g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
        g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
        g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
        g.closePath();
    }
    function fitText(g, text, maxW, startPx, weight) {
        var px = startPx;
        while (px > 8) {
            g.font = weight + ' ' + px + 'px "Noto Sans KR","Malgun Gothic",sans-serif';
            if (g.measureText(text).width <= maxW) break;
            px -= 1;
        }
        return px;
    }
    function renderSheetToCanvas(scale) {
        ensureSheet();
        var th = THEMES[sheet.theme] || THEMES.dark;
        var cv = document.createElement('canvas');
        cv.width = Math.round(SHEET_W * scale);
        cv.height = Math.round(SHEET_H * scale);
        var g = cv.getContext('2d');
        g.scale(scale, scale);
        g.fillStyle = th.bg;
        g.fillRect(0, 0, SHEET_W, SHEET_H);
        g.textBaseline = 'middle';
        g.textAlign = 'center';

        var b = boardCells(), i, e, k, cell, lab, col, txt, px, dw, dh, vert;
        for (i = 0; i < sheet.els.length; i++) {
            e = sheet.els[i];
            if (e.kind === 'title') {
                g.fillStyle = th.text;
                g.globalAlpha = 1;
                px = fitText(g, sheetTitleText(), e.w, e.size, 'bold');
                g.fillText(sheetTitleText(), e.x + e.w / 2, e.y + px * 0.7);
            } else if (e.kind === 'desk') {
                dw = e.w || 150; dh = e.h || 44;
                vert = (sheet.deskSide === 'left' || sheet.deskSide === 'right');
                g.globalAlpha = 1;
                g.strokeStyle = th.text;
                g.lineWidth = 1.6;
                roundRect(g, e.x, e.y, dw, dh, 8);
                g.stroke();
                g.fillStyle = th.text;
                g.font = 'bold ' + e.size + 'px "Noto Sans KR","Malgun Gothic",sans-serif';
                if (vert) {
                    // stack the two syllables the way the DOM does
                    g.fillText('교', e.x + dw / 2, e.y + dh / 2 - e.size * 0.6);
                    g.fillText('탁', e.x + dw / 2, e.y + dh / 2 + e.size * 0.6);
                } else {
                    g.fillText('교탁', e.x + dw / 2, e.y + dh / 2);
                }
            } else if (e.kind === 'board') {
                g.globalAlpha = 1;
                g.fillStyle = th.panel;
                roundRect(g, e.x, e.y, b.w, b.h, 14);
                g.fill();
                if (sheet.theme === 'paper') { g.strokeStyle = th.line; g.lineWidth = 1.2; g.stroke(); }
                for (k = 0; k < b.list.length; k++) {
                    cell = b.list[k];
                    if (!cell.on) continue;
                    lab = seatLabel(cell.num);
                    if (cell.num == null) { col = th.off; txt = th.sub; }
                    else if (sheet.theme === 'paper') { col = '#ffffff'; txt = '#000000'; }
                    else { col = ((students[cell.num] || {}).gender === 'F') ? th.f : th.m; txt = '#ffffff'; }
                    g.fillStyle = col;
                    roundRect(g, e.x + cell.x, e.y + cell.y, cell.w, cell.h, 9);
                    g.fill();
                    if (sheet.theme === 'paper') { g.strokeStyle = th.line; g.lineWidth = 1.1; g.stroke(); }
                    if (lab) {
                        g.fillStyle = txt;
                        fitText(g, lab, cell.w - 10, sheet.cellFont, 'bold');
                        g.fillText(lab, e.x + cell.x + cell.w / 2, e.y + cell.y + cell.h / 2 + 1);
                    }
                }
            } else {
                if (!e.text) continue;
                g.globalAlpha = e.faint ? 0.62 : 1;
                g.fillStyle = faintColor(th);
                g.font = '600 ' + e.size + 'px "Noto Sans KR","Malgun Gothic",sans-serif';
                g.textAlign = 'left';
                g.fillText(e.text, e.x, e.y + e.size * 0.7);
                g.textAlign = 'center';
                g.globalAlpha = 1;
            }
        }
        g.globalAlpha = 1;
        return cv;
    }

    function downloadBlob(blob, name) {
        if (window.navigator && window.navigator.msSaveBlob) { window.navigator.msSaveBlob(blob, name); return; }
        var url = window.URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
            if (a.parentNode) a.parentNode.removeChild(a);
            window.URL.revokeObjectURL(url);
        }, 120);
    }
    function sheetFileName(ext) {
        return (className || 'class').replace(/[\\/:*?"<>|]/g, '') + '_자리배치표.' + ext;
    }
    function dataUrlToBytes(u) {
        var b64 = u.substring(u.indexOf(',') + 1);
        var bin = atob(b64), n = bin.length, arr = new Uint8Array(n), i;
        for (i = 0; i < n; i++) arr[i] = bin.charCodeAt(i);
        return arr;
    }

    function exportImage(kind) {
        var cv = renderSheetToCanvas(2);
        if (kind === 'jpg') {
            // JPEG has no alpha; the canvas is already opaque, but be explicit
            var out = document.createElement('canvas');
            out.width = cv.width; out.height = cv.height;
            var g = out.getContext('2d');
            g.fillStyle = (THEMES[sheet.theme] || THEMES.dark).bg;
            g.fillRect(0, 0, out.width, out.height);
            g.drawImage(cv, 0, 0);
            downloadBlob(new Blob([dataUrlToBytes(out.toDataURL('image/jpeg', 0.94))], { type: 'image/jpeg' }), sheetFileName('jpg'));
        } else {
            downloadBlob(new Blob([dataUrlToBytes(cv.toDataURL('image/png'))], { type: 'image/png' }), sheetFileName('png'));
        }
    }

    // ---- minimal one-page PDF wrapping the JPEG ----
    function exportPdf() {
        var cv = renderSheetToCanvas(2);
        var tmp = document.createElement('canvas');
        tmp.width = cv.width; tmp.height = cv.height;
        var g = tmp.getContext('2d');
        g.fillStyle = (THEMES[sheet.theme] || THEMES.dark).bg;
        g.fillRect(0, 0, tmp.width, tmp.height);
        g.drawImage(cv, 0, 0);
        var jpg = dataUrlToBytes(tmp.toDataURL('image/jpeg', 0.94));

        var PW = 842, PH = 595;                                  // A4 landscape, points
        var sc = Math.min(PW / SHEET_W, PH / SHEET_H);
        var dw = SHEET_W * sc, dh = SHEET_H * sc;
        var dx = (PW - dw) / 2, dy = (PH - dh) / 2;

        var objs = [];
        objs.push('<</Type/Catalog/Pages 2 0 R>>');
        objs.push('<</Type/Pages/Kids[3 0 R]/Count 1>>');
        objs.push('<</Type/Page/Parent 2 0 R/MediaBox[0 0 ' + PW + ' ' + PH +
                  ']/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>');

        var content = 'q ' + dw.toFixed(2) + ' 0 0 ' + dh.toFixed(2) + ' ' +
                      dx.toFixed(2) + ' ' + dy.toFixed(2) + ' cm /Im0 Do Q';

        var parts = [], offsets = [], pos = 0;
        function push(str) { parts.push(str); pos += str.length; }
        function pushBytes(arr) { parts.push(arr); pos += arr.length; }

        push('%PDF-1.4\n');
        var i;
        for (i = 0; i < 3; i++) {
            offsets.push(pos);
            push((i + 1) + ' 0 obj\n' + objs[i] + '\nendobj\n');
        }
        offsets.push(pos);
        push('4 0 obj\n<</Type/XObject/Subtype/Image/Width ' + tmp.width + '/Height ' + tmp.height +
             '/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ' + jpg.length + '>>\nstream\n');
        pushBytes(jpg);
        push('\nendstream\nendobj\n');
        offsets.push(pos);
        push('5 0 obj\n<</Length ' + content.length + '>>\nstream\n' + content + '\nendstream\nendobj\n');

        var xref = pos;
        var x = 'xref\n0 6\n0000000000 65535 f \n';
        for (i = 0; i < 5; i++) {
            var o = String(offsets[i]);
            while (o.length < 10) o = '0' + o;
            x += o + ' 00000 n \n';
        }
        x += 'trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n' + xref + '\n%%EOF\n';
        push(x);

        var blobParts = [], j;
        for (j = 0; j < parts.length; j++) {
            if (typeof parts[j] === 'string') {
                var str = parts[j], u = new Uint8Array(str.length), q;
                for (q = 0; q < str.length; q++) u[q] = str.charCodeAt(q) & 0xff;
                blobParts.push(u);
            } else blobParts.push(parts[j]);
        }
        downloadBlob(new Blob(blobParts, { type: 'application/pdf' }), sheetFileName('pdf'));
    }

    // ---- HWP: written as HWPX (the open OWPML package Hancom 2014+ reads) ----
    var CRC_T = null;
    function crc32(buf) {
        var i, j, c;
        if (!CRC_T) {
            CRC_T = [];
            for (i = 0; i < 256; i++) {
                c = i;
                for (j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
                CRC_T[i] = c >>> 0;
            }
        }
        c = 0xFFFFFFFF;
        for (i = 0; i < buf.length; i++) c = CRC_T[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
        return (c ^ 0xFFFFFFFF) >>> 0;
    }
    function utf8Bytes(str) {
        var out = [], i, cc;
        for (i = 0; i < str.length; i++) {
            cc = str.charCodeAt(i);
            if (cc < 0x80) out.push(cc);
            else if (cc < 0x800) { out.push(0xC0 | (cc >> 6), 0x80 | (cc & 63)); }
            else if (cc >= 0xD800 && cc <= 0xDBFF) {
                var lo = str.charCodeAt(++i);
                var cp = 0x10000 + ((cc - 0xD800) << 10) + (lo - 0xDC00);
                out.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));

    // ---- share: the whole chart travels inside the link, valid for one hour ----
    function makeShareLink() {
        ensureSheet();
        var seats = [], r, c, src = hasResult ? newSeats : currentSeats;
        for (r = 0; r < rows; r++) for (c = 0; c < NC(); c++) {
            if (src[r][c] != null) seats.push(r + ',' + c + ',' + src[r][c]);
        }
        var names = {}, i, n;
        for (i = 0; i < participants.length; i++) {
            n = participants[i];
            names[n] = [(students[n] || {}).name || '', (students[n] || {}).gender || 'M'];
        }
        var off = [];
        for (r = 0; r < rows; r++) for (c = 0; c < NC(); c++) if (!enabledSeats[r][c]) off.push(r + ',' + c);
        var payload = {
            exp: Date.now() + 3600000,
            cls: className, rows: rows, cols: cols,
            td: tripleDesk, off: off, seats: seats, names: names,
            fmt: formatPayload()
        };
        var b64;
        try {
            b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        } catch (e) { alert('공유 링크를 만들지 못했습니다.'); return; }
        var url = location.href.split('#')[0] + '#s=' + b64;
        var done = function () {
            shareMsg = '링크를 복사했습니다. 1시간 동안 열 수 있습니다. (' + url.length + '자)';
            render();
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(done, function () {
                shareMsg = url; render();
            });
        } else {
            shareMsg = url; render();
        }
    }
    // Opening a shared link jumps straight to a print-ready sheet.
    function tryOpenShared() {
        var h = location.hash || '';
        if (h.indexOf('#s=') !== 0) return false;
        var b64 = h.substring(3).replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        var o;
        try { o = JSON.parse(decodeURIComponent(escape(atob(b64)))); } catch (e) { return false; }
        if (!o || !o.exp) return false;
        if (Date.now() > o.exp) {
            document.getElementById('app').innerHTML =
                '<div class="panel narrow"><div class="title">링크 만료</div>' +

        }
        className = o.cls || '';
        rows = o.rows; cols = o.cols;

        currentSeats = emptyGrid(null);
        newSeats = emptyGrid(null);
        var i, p;
        for (i = 0; i < (o.off || []).length; i++) {
            p = o.off[i].split(',');
            if (enabledSeats[+p[0]]) enabledSeats[+p[0]][+p[1]] = false;
        }
        students = {};

        }
        participants.sort(function (a, b) { return a - b; });
        studentCount = participants.length ? participants[participants.length - 1] : 0;

            currentSeats[+p[0]][+p[1]] = +p[2];

    function loadFromSelectedFile(inputId, studentsOnly) {

    function parseLoadedText(text, studentsOnly) {
        var normalized = String(text).replace(/\r/g, '');
        var lines = normalized.split('\n');
        var metaRows = null, metaCols = null, metaCount = null, metaAbsent = null, metaDisabled = null;
        var metaName = null, metaTriple = null;
        var loadedStudents = {}, placements = [], condF = {}, condG = {}, condS = {};
        var i, line, m, num, parsedAbs, parts, k, rr, cc;

        for (i = 0; i < lines.length; i++) {
            line = trim(lines[i]);
            if (line === '' || line === '.') continue;
            m = line.match(/^META\s*;\s*NAME\s*;\s*"((?:[^"]|"")*)"\s*$/i); if (m) { metaName = m[1].replace(/""/g, '"'); continue; }
            m = line.match(/^META\s*;\s*TRIPLE\s*;\s*(\d+)\s*,\s*(\d+)\s*$/i); if (m) { metaTriple = { r: parseInt(m[1],10), c: parseInt(m[2],10) }; continue; }
            m = line.match(/^META\s*;\s*ROWS\s*;\s*(\d+)\s*$/i); if (m) { metaRows = parseInt(m[1], 10); continue; }
            m = line.match(/^META\s*;\s*COLS\s*;\s*(\d+)\s*$/i); if (m) { metaCols = parseInt(m[1], 10); continue; }
            m = line.match(/^META\s*;\s*COUNT\s*;\s*(\d+)\s*$/i); if (m) { metaCount = parseInt(m[1], 10); continue; }
            m = line.match(/^META\s*;\s*ABSENT\s*;\s*"([^"]*)"\s*$/i); if (m) { metaAbsent = m[1]; continue; }
            m = line.match(/^META\s*;\s*DISABLED\s*;\s*"([^"]*)"\s*$/i); if (m) { metaDisabled = m[1]; continue; }
            m = line.match(/^S\s*;\s*(\d+)\s*;\s*"((?:[^"]|"")*)"\s*;\s*([MFN])\s*$/i);
            if (m) {
                num = parseInt(m[1], 10);
                loadedStudents[num] = { name: m[2].replace(/""/g, '"'), gender: m[3].toUpperCase() };
                continue;
            }
            m = line.match(/^P\s*;\s*(\d+)\s*;\s*(\d+)\s*;\s*(\d+)\s*$/i);
            if (m) { placements.push({ r: parseInt(m[1], 10), c: parseInt(m[2], 10), num: parseInt(m[3], 10) }); continue; }
            m = line.match(/^CF\s*;\s*(\d+)\s*;\s*(\d+)\s*$/i);
            if (m) { condF[parseInt(m[1], 10)] = parseInt(m[2], 10); continue; }
            m = line.match(/^CG\s*;\s*(\d+)\s*;\s*([MF])\s*$/i);
            if (m) { condG[parseInt(m[1], 10)] = m[2].toUpperCase(); continue; }
            m = line.match(/^CS\s*;\s*(\d+)\s*;\s*"([^"]*)"\s*$/i);
            if (m) {
                var arr = [], items = m[2].split(';');
                for (k = 0; k < items.length; k++) {
                    if (items[k] === '') continue;
                    var pp = items[k].split(',');
                    if (pp.length === 2) arr.push({ r: parseInt(pp[0], 10), c: parseInt(pp[1], 10) });
                }
                condS[parseInt(m[1], 10)] = arr;
                continue;
            }
        }
        if (metaCount == null || (!studentsOnly && (metaRows == null || metaCols == null))) {
            alert('저장 파일에서 기본 정보를 확인할 수 없습니다.'); return false;
        }
        if (metaCount < 1 || (!studentsOnly && (metaRows < 1 || metaCols < 1))) {
            alert('저장 파일의 값이 올바르지 않습니다.'); return false;
        }
        parsedAbs = parseAbsentList(metaAbsent || '', metaCount);
        if (parsedAbs === null) { alert('저장 파일의 결번 정보가 올바르지 않습니다.'); return false; }

        if (metaName != null) className = metaName;
        if (!studentsOnly) {
            rows = metaRows; cols = metaCols;
            tripleDesk = (metaTriple && metaTriple.r < metaRows && metaTriple.c + 2 < metaCols) ? metaTriple : null;
        }
        studentCount = metaCount;
        absentNumbers = parsedAbs;
        buildParticipants();
        if (participants.length < 1) { alert('저장 파일의 참여 인원이 부족합니다.'); return false; }

        if (!studentsOnly) {
            enabledSeats = emptyGrid(true);
            if (metaDisabled) {
                parts = metaDisabled.split(';');
                for (k = 0; k < parts.length; k++) {
                    if (parts[k] === '') continue;
                    var dpp = parts[k].split(',');
                    if (dpp.length === 2) {
                        rr = parseInt(dpp[0], 10); cc = parseInt(dpp[1], 10);
                        if (rr >= 0 && rr < rows && cc >= 0 && cc < NC()) enabledSeats[rr][cc] = false;
                    }
                }
            }
        }

        students = {};
        for (i = 0; i < participants.length; i++) {
            num = participants[i];
            var ls = loadedStudents[num];
            students[num] = ls
                ? { name: ls.name || '', gender: ls.gender === 'F' ? 'F' : 'M' }
                : { name: '', gender: 'M' };
        }

        if (!studentsOnly) {
            currentSeats = emptyGrid(null);
            newSeats = emptyGrid(null);
            for (i = 0; i < placements.length; i++) {
                var p2 = placements[i];
                if (p2.r < 0 || p2.r >= rows || p2.c < 0 || p2.c >= cols) continue;
                if (!enabledSeats[p2.r][p2.c]) continue;
                if (participants.indexOf(p2.num) < 0) continue;
                newSeats[p2.r][p2.c] = p2.num;
                currentSeats[p2.r][p2.c] = p2.num;
            }
        } else {
            // keep grid, just drop anyone no longer on the roster
            for (rr = 0; rr < rows; rr++) for (cc = 0; cc < NC(); cc++) {
                if (currentSeats[rr][cc] != null && participants.indexOf(currentSeats[rr][cc]) < 0) currentSeats[rr][cc] = null;
                if (newSeats[rr][cc] != null && participants.indexOf(newSeats[rr][cc]) < 0) newSeats[rr][cc] = null;
            }
        }

        conditions = {};
        for (i = 0; i < participants.length; i++) {
            num = participants[i];
            conditions[num] = {
                mustPairWith: condF[num] != null ? condF[num] : null,
                pairGender: condG[num] || '',
                allowedSeats: condS[num] || []
            };
        }
        sanitizeConditionsAgainstGrid();
        return true;
    }

    // ====== INIT ======
    function setDefaults() {
        rows = 5; cols = 6;
        studentCount = 30;
        absentNumbers = [];
        students = {};
        conditions = {};
        buildParticipants();
        enabledSeats = emptyGrid(true);
        currentSeats = emptyGrid(null);
        newSeats = emptyGrid(null);
        var i, num;
        for (i = 0; i < participants.length; i++) {
            num = participants[i];
            students[num] = { name: '', gender: 'M' };
        }
        hasResult = false;
    }

    setDefaults();
    if (!tryOpenShared()) render();
    // following a share link from an already-open page only changes the hash
    window.addEventListener('hashchange', function () { tryOpenShared(); });
})();
</script>
